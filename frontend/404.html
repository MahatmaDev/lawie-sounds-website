<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/jpeg" href="/IMAGES/LOGO/2.jpg">
  <link rel="apple-touch-icon" href="/IMAGES/LOGO/2.jpg">
  <meta name="theme-color" content="#08080f">
  <title>Page not found | Lawie Sounds</title>
  <meta name="description" content="That page does not exist. Browse our services, gallery, or get a quote for your event.">
  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/app.css">

  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .four { font-family: 'Sora', sans-serif; font-size: clamp(72px, 16vw, 148px); font-weight: 800; line-height: .9; margin: 0;
            background: linear-gradient(96deg, #fff7c2, var(--gold) 38%, var(--gold-deep));
            -webkit-background-clip: text; background-clip: text; color: transparent; }
    .lostlinks { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a href="/" class="brand" aria-label="Lawie Sounds — home">
      <img src="/IMAGES/LOGO/2.jpg" width="42" height="42" alt="">
      <span>
        <span class="brand-name">LAWIE <span class="gold">SOUNDS</span></span>
        <span class="brand-sub">Nyeri · Kenya</span>
      </span>
    </a>
    <a href="/book" class="btn btn-primary btn-sm"><i class="fas fa-calendar-check"></i>Get a quote</a>
  </div>
</header>

<main id="main" style="flex:1;display:flex;align-items:center;justify-content:center;padding:64px 0">
  <div class="wrap" style="text-align:center;max-width:640px">
    <p class="four">404</p>
    <h1 style="font-size:clamp(24px,4vw,34px);font-weight:800;margin:8px 0 0">This page does not exist</h1>

    <!-- No jokes and no dead end. Someone who lands here was looking for
         something specific; the job is to get them to it in one tap. -->
    <p style="color:var(--text-muted);line-height:1.7;margin:16px auto 0;max-width:46ch">
      The link may be out of date, or the address slightly wrong. Everything we do is still one tap away.
    </p>

    <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:32px">
      <a href="/services" class="btn btn-primary"><i class="fas fa-headphones"></i>Browse services</a>
      <a href="/book" class="btn btn-ghost"><i class="fas fa-calendar-check"></i>Get a quote</a>
    </div>

    <div class="lostlinks">
      <a href="/" class="chip">Home</a>
      <a href="/gallery" class="chip">Gallery</a>
      <a href="/reviews" class="chip">Reviews</a>
      <a href="/faq" class="chip">FAQ</a>
      <a href="/call" class="chip"><i class="fas fa-phone-alt gold"></i>+254 703 925 826</a>
      <a href="/wa" class="chip"><i class="fab fa-whatsapp" style="color:var(--wa)"></i>WhatsApp</a>
    </div>
  </div>
</main>

<footer class="site-footer" style="padding:28px 0">
  <div class="wrap" style="text-align:center">
    <p style="color:var(--text-faint);font-size:12.5px;margin:0">
      &copy; <span id="year">2026</span> Lawie Sounds · Nyeri, Kenya
    </p>
  </div>
</footer>

<script src="/js/site.js"></script>
</body>
</html>
