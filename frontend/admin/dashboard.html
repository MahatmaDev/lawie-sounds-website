  <!-- ==================== SESSION CHECK ==================== -->
  <script>
    function getTimeBasedGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return { text: "Good Morning ☀️", emoji: "🌅" };
      if (hour < 17) return { text: "Good Afternoon 🌤️", emoji: "☀️" };
      if (hour < 21) return { text: "Good Evening 🌙", emoji: "✨" };
      return { text: "Good Night 🌟", emoji: "🌙" };
    }

    function checkAdminSession() {
      let session = localStorage.getItem('lawie_admin_session');
      if (!session) session = sessionStorage.getItem('lawie_admin_session');
      if (!session) { window.location.href = 'login.html'; return false; }
      try {
        // JWT is 3 base64url parts — decode the payload (middle part)
        const parts = session.split('.');
        if (parts.length !== 3) throw new Error('not a jwt');
        const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
        // JWT exp is in seconds
        if (!payload.exp || payload.exp * 1000 < Date.now()) {
          localStorage.removeItem('lawie_admin_session');
          sessionStorage.removeItem('lawie_admin_session');
          window.location.href = 'login.html';
          return false;
        }
        const greeting = getTimeBasedGreeting();
        sessionStorage.setItem('adminName', payload.name || 'Administrator');
        sessionStorage.setItem('adminGreeting', greeting.text);
        sessionStorage.setItem('adminEmoji', greeting.emoji);
        sessionStorage.setItem('adminRole', payload.role || 'admin');
        window._adminRole = payload.role || 'admin';
        return true;
      } catch (e) { window.location.href = 'login.html'; return false; }
    }
    checkAdminSession();
  </script>

    // ==================== BETA FEATURES REGISTRY ====================

        desc:'⭐ Starred photos appear in a Staff Picks grid at the top of the public gallery page. Requires at least 2 starred photos.',
        status:'active', affects:'Public Gallery', since:'2.1', adminOnly:false },
      { id:'gallery-service-links', name:'Gallery Service Tagging', icon:'fa-link', color:'text-blue-400', bg:'bg-blue-900/20', border:'border-blue-700/30',
        desc:'Tag any gallery photo to a specific service (Drone, DJ, etc.). The service name appears as a badge when visitors hover over the photo.',

      { id:'api-gallery-filters', name:'Gallery API Smart Filters', icon:'fa-filter', color:'text-purple-400', bg:'bg-purple-900/20', border:'border-purple-700/30',
        desc:'The gallery API now supports filtering by featured status, category, and service slug. Makes page loads faster when many images exist.',

      { id:'business-health-score', name:'Business Health Score', icon:'fa-heartbeat', color:'text-green-400', bg:'bg-green-900/20', border:'border-green-700/30',
        desc:'A 0–100 composite score measuring conversion rate, review ratings, content freshness, and pipeline health. Visible on the admin Dashboard tab.',
        status:'active', affects:'Admin Dashboard', since:'2.0', adminOnly:true },

        desc:'Clients send M-Pesa payment confirmation codes directly through the booking form. Admin sees payment status per booking automatically.',

    function isBetaEnabled(id) { return localStorage.getItem('beta_' + id) === 'true'; }
    function toggleBetaFeature(id) {
      const current = isBetaEnabled(id);
      localStorage.setItem('beta_' + id, (!current).toString());
      renderBeta();
    }

    // ==================== UPDATES HELPERS ====================
    function getReadUpdates() {
      try { return JSON.parse(localStorage.getItem('lawie_updates_read') || '[]'); } catch { return []; }
    }
    function markUpdateRead(version) {
      const read = getReadUpdates();
      if (!read.includes(version)) { read.push(version); localStorage.setItem('lawie_updates_read', JSON.stringify(read)); }
      updateBadge();
      renderUpdates();
    }
    function markAllUpdatesRead() {
      localStorage.setItem('lawie_updates_read', JSON.stringify(CHANGELOG.map(c => c.version)));
      updateBadge();
      renderUpdates();
    }
    function updateBadge() {
      const read = getReadUpdates();
      const unread = CHANGELOG.filter(c => !read.includes(c.version)).length;
      const badge = document.getElementById('updatesBadge');
      if (!badge) return;
      if (unread > 0) { badge.textContent = unread; badge.classList.remove('hidden'); }
      else { badge.classList.add('hidden'); }
    }

    // ==================== API HELPERS ====================
    function getAdminToken() {
      return localStorage.getItem('lawie_admin_session') || sessionStorage.getItem('lawie_admin_session') || '';
    }

    async function apiRequest(method, path, body = null) {
      try {
        const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAdminToken()}` } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        const json = await res.json().catch(() => null);
        if (!res.ok) return { _error: true, status: res.status, message: json?.error || res.statusText };
        return json;
      } catch(e) { return { _error: true, status: 0, message: 'Network error — cannot reach API' }; }
    }

    async function loadAllDataFromAPI() {
      const [evts, svcs, gal, revs, bans, posts, bkgs, emps, pay] = await Promise.all([
        apiRequest('GET', '/api/admin/events'),
        apiRequest('GET', '/api/admin/services'),
        apiRequest('GET', '/api/admin/gallery'),
        apiRequest('GET', '/api/admin/reviews'),
        apiRequest('GET', '/api/admin/banners'),
        apiRequest('GET', '/api/admin/posters'),
        apiRequest('GET', '/api/admin/bookings'),
        apiRequest('GET', '/api/admin/employees'),
        apiRequest('GET', '/api/admin/payroll'),
      ]);
      store.events = evts?.data || [];
      store.services = svcs?.data || [];
      store.gallery = gal?.data || [];
      store.reviews = revs?.data || [];
      store.marketingBanners = bans?.data || [];
      store.posters = posts?.data || [];
      store.bookings = bkgs?.data || [];
      store.employees = emps?.data || [];
      store.payroll = pay?.data || [];
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
    function updateStats() { document.getElementById('statEvents').textContent = store.events.length; document.getElementById('statBookings').textContent = store.bookings.filter(b => b.status === 'pending').length; document.getElementById('statGallery').textContent = store.gallery.length; document.getElementById('statReviews').textContent = store.reviews.filter(r => !r.isApproved).length; }
    function updateGreetingDisplay() { const greeting = sessionStorage.getItem('adminGreeting') || 'Welcome'; const emoji = sessionStorage.getItem('adminEmoji') || '👋'; const adminName = sessionStorage.getItem('adminName') || 'Administrator'; document.getElementById('adminGreetingDisplay').textContent = `${greeting} ${emoji}`; document.getElementById('adminNameDisplay').textContent = adminName; }

    function showToast(message, type = 'info') {
      const colors = { info: 'bg-blue-600', success: 'bg-green-600', booking: 'bg-purple-600', review: 'bg-yellow-600' };
      const icons = { info: 'fa-info-circle', success: 'fa-check-circle', booking: 'fa-calendar-check', review: 'fa-star' };
      const toast = document.createElement('div');
      toast.className = 'fixed bottom-4 right-4 z-50 ' + (colors[type] || colors.info) + ' text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 max-w-sm fade-in';
      toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i><span>' + message + '</span>';

    function getEventStatusBadge(event) {
      const now = new Date().toISOString().split('T')[0];
      if (event.status === 'cancelled') return 'bg-red-600/20 text-red-400';
      if (event.date < now) return 'bg-gray-600/20 text-gray-400';
      if (event.seatsLeft === 0) return 'bg-orange-600/20 text-orange-400';
      if (event.isActive === false) return 'bg-yellow-600/20 text-yellow-400';
      return 'bg-green-600/20 text-green-400';
    }

    function getEventStatusText(event) {
      const now = new Date().toISOString().split('T')[0];
      if (event.status === 'cancelled') return 'Cancelled';
      if (event.date < now) return 'Completed';
      if (event.seatsLeft === 0) return 'Sold Out';
      if (event.isActive === false) return 'Draft';
      return 'Published';
    }

    function setEventView(mode) {
      eventViewMode = mode;
      renderEvents();
    }

    function editEvent(id) { openEventForm(id); }

    async function deleteEvent(id) {
      const result = await Swal.fire({ title: 'Delete event?', text: 'This action cannot be undone', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff' });
      if (result.isConfirmed) { store.events = store.events.filter(e => e.id !== id); await apiRequest('DELETE', `/api/admin/events/${id}`); renderEvents(); updateStats(); Swal.fire({ icon: 'success', title: 'Event deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' }); }
    }

    // Duplicate an event (for quick creation of similar events)
    async function duplicateEvent(id) {
      const originalEvent = store.events.find(e => e.id === id);
      if (!originalEvent) return;
      
      const duplicatedEvent = {
        ...originalEvent,
        id: Date.now().toString(),
        title: `${originalEvent.title} (Copy)`,
        status: 'draft',
        isActive: false,
        seatsLeft: originalEvent.totalSeats,
        bookingCount: 0,
        createdAt: new Date().toISOString()
      };
      
      store.events.push(duplicatedEvent);
      await apiRequest('POST', '/api/admin/events', duplicatedEvent);
      renderEvents();
      
      Swal.fire({ icon: 'success', title: 'Event Duplicated!', text: 'You can now edit the copy', timer: 2000, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
    }

    // Export event data as CSV
    function exportEventData(id) {
      const event = store.events.find(e => e.id === id);
      if (!event) return;
      
      // Get bookings for this event (in production, fetch from database)
      const eventBookings = store.bookings.filter(b => b.eventId === id || b.eventType === event.title);
      
      const csvData = [
        ['Event Title', event.title],
        ['Event Date', new Date(event.date).toLocaleString()],
        ['Venue', event.venue],
        ['Ticket Price', `KES ${event.price.toLocaleString()}`],
        ['Total Seats', event.totalSeats || 'N/A'],
        ['Seats Sold', (event.totalSeats || event.seatsLeft || 0) - (event.seatsLeft || 0)],
        ['Revenue', `KES ${((event.totalSeats || event.seatsLeft || 0) - (event.seatsLeft || 0)) * event.price}`],
        ['Status', event.status || (event.isActive ? 'Active' : 'Inactive')],
        [''],
        ['Booking Details'],
        ['Name', 'Email', 'Phone', 'Ticket Type', 'Quantity', 'Amount']
      ];
      
      // Add individual bookings (placeholder for now)
      eventBookings.forEach(booking => {
        csvData.push([booking.name, booking.email, booking.phone, 'Standard', 1, `KES ${event.price}`]);
      });
      
      const csvContent = csvData.map(row => row.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${event.title.replace(/[^a-z0-9]/gi, '_')}_report.csv`;
      a.click();
      URL.revokeObjectURL(url);
      
      Swal.fire({ icon: 'success', title: 'Export Started!', text: 'CSV file is being downloaded', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
    }

    async function saveEvent() {
      const title = document.getElementById('eventTitle').value;
      const date = document.getElementById('eventDate').value;
      const venue = document.getElementById('eventVenue').value;
      const price = parseInt(document.getElementById('eventPrice').value);
      const totalSeats = parseInt(document.getElementById('eventTotalSeats').value);
      const status = document.getElementById('eventStatus').value;
      const description = document.getElementById('eventDesc').value;
      const image = document.getElementById('eventImage').value;
      const isRecurring = document.getElementById('eventRecurring')?.checked || false;
      
      if (!title || !date || !venue || !price) {
        Swal.fire({ icon: 'error', title: 'Missing Fields', text: 'Please fill in all required fields', background: '#1e1e2a', color: '#fff' });
        return;
      }
      
      const seatsSold = currentEditId ? (store.events.find(e => e.id === currentEditId)?.totalSeats || totalSeats) - (store.events.find(e => e.id === currentEditId)?.seatsLeft || totalSeats) : 0;
      const seatsLeft = totalSeats - seatsSold;

      const payload = {
        title, date, venue, price, totalSeats, seatsLeft,
        description,
        image: image || 'https://placehold.co/400x300?text=' + encodeURIComponent(title),
        status,
        isActive: status !== 'draft' && status !== 'cancelled',
      };

      const result = await apiRequest(
        currentEditId ? 'PUT' : 'POST',
        currentEditId ? `/api/admin/events/${currentEditId}` : '/api/admin/events',
        payload
      );

      if (!result?.data) {
        Swal.fire({ icon: 'error', title: 'Failed to Save Event', text: result?._error ? result.message : 'Unexpected response from server', background: '#1e1e2a', color: '#fff' });
        return;
      }

      if (currentEditId) {
        store.events = store.events.map(e => e.id === currentEditId ? result.data : e);
        Swal.fire({ icon: 'success', title: 'Event Updated!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      } else {
        store.events.push(result.data);

        // Save recurring events to DB individually
        if (isRecurring) {
          const recurringType = document.getElementById('recurringType').value;
          const recurringCount = parseInt(document.getElementById('recurringCount').value);
          let currentDate = new Date(date);
          for (let i = 1; i < recurringCount; i++) {
            if (recurringType === 'weekly') currentDate = new Date(currentDate.setDate(currentDate.getDate() + 7));
            else if (recurringType === 'monthly') currentDate = new Date(currentDate.setMonth(currentDate.getMonth() + 1));
            const recurPayload = { ...payload, date: currentDate.toISOString().slice(0, 16), title: `${title} (${recurringType === 'weekly' ? 'Week' : 'Month'} ${i + 1})`, seatsLeft: totalSeats };
            const recurResult = await apiRequest('POST', '/api/admin/events', recurPayload);
            if (recurResult?.data) store.events.push(recurResult.data);
          }
          Swal.fire({ icon: 'success', title: `Created ${recurringCount} recurring events!`, timer: 2000, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
        } else {
          Swal.fire({ icon: 'success', title: 'Event Created!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
        }
      }

      closeModal();
      renderEvents();
      updateStats();
    }

    function calcROI() {
      const price = parseFloat(document.getElementById('eventPrice')?.value) || 0;
      const seats = parseInt(document.getElementById('eventTotalSeats')?.value) || 0;
      const cost = parseFloat(document.getElementById('eventCost')?.value) || 0;
      const roi = document.getElementById('roiDisplay');
      if (!roi) return;
      if (price > 0 || cost > 0) {
        roi.style.display = 'block';
        const revenue = price * seats;
        const profit = revenue - cost;
        document.getElementById('roiRevenue').textContent = 'KES ' + revenue.toLocaleString();
        document.getElementById('roiCost').textContent = 'KES ' + cost.toLocaleString();
        const profitEl = document.getElementById('roiProfit');
        profitEl.textContent = 'KES ' + profit.toLocaleString();
        profitEl.className = 'text-lg font-bold ' + (profit >= 0 ? 'text-green-400' : 'text-red-400');
      } else {
        roi.style.display = 'none';
      }
    }

    // ==================== REVAMPED SERVICES MANAGEMENT ====================
    let serviceViewMode = 'active';
    let editingPackageIndex = null;
    let editingFeatureIndex = null;
    let editingFaqIndex = null;

    function _svcDemand(name) {
      return (store.bookings || []).filter(b => {
        const s = (Array.isArray(b.services) ? b.services.join(' ') : (b.services || '')).toLowerCase();
        return s.includes((name || '').toLowerCase().slice(0, 10));
      }).length;
    }

    function _svcPriceRange(svc) {
      const prices = (svc.packages || []).map(p => parseInt(p.price) || 0).filter(p => p > 0);
      if (!prices.length) return null;
      const min = Math.min(...prices), max = Math.max(...prices);
      const fmt = n => n >= 1000 ? (n / 1000).toFixed(0) + 'K' : n.toString();
      return min === max ? `KES ${fmt(min)}` : `KES ${fmt(min)} – ${fmt(max)}`;
    }

    function _svcCompleteness(svc) {
      let s = 0;
      if (svc.mainImage && !svc.mainImage.includes('placehold')) s += 25;
      if (svc.shortDesc) s += 10;
      if (svc.longDesc)  s += 10;
      if ((svc.packages  || []).length) s += 25;
      if ((svc.features  || []).length) s += 15;
      if ((svc.faqs      || []).length) s += 15;
      return s;
    }

      // Tab switching
      function _activateServiceTab(tabBtn) {
        document.querySelectorAll('.tab-service').forEach(t => {

          t.classList.add('border-transparent', 'text-gray-400');
        });
        tabBtn.classList.remove('border-transparent', 'text-gray-400');
        tabBtn.classList.add('border-purple-500', 'text-purple-400', 'bg-purple-900/20');
        const tabId = tabBtn.dataset.tab;
        document.querySelectorAll('.tab-service-content').forEach(c => c.classList.add('hidden'));
        const target = document.getElementById(`tab${tabId.charAt(0).toUpperCase() + tabId.slice(1)}`);
        if (target) target.classList.remove('hidden');
      }

      document.querySelectorAll('.tab-service').forEach(tab => {
        tab.addEventListener('click', () => _activateServiceTab(tab));
      });

      // Apply active styling to first tab immediately
      const firstTab = document.querySelector('.tab-service[data-tab="basic"]');
      if (firstTab) _activateServiceTab(firstTab);

      const nameInput = document.getElementById('serviceName');
      if (nameInput && !id) {
        nameInput.addEventListener('input', () => {

          if (preview) preview.textContent = nameInput.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
        });

      const svcDrop = document.getElementById('svcDropLabel');
      if (svcDrop) {
        svcDrop.addEventListener('dragover', e => { e.preventDefault(); svcDrop.classList.add('border-purple-500','bg-purple-900/10'); });

      }

    function _svcUrlInput(val) {

    async function handleSvcImageFile(file) {
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        Swal.fire({ icon: 'error', title: 'File too large', text: 'Maximum 10MB.', background: '#1e1e2a', color: '#fff' });
        return;
      }
      const dropLabel = document.getElementById('svcDropLabel');
      if (dropLabel) dropLabel.innerHTML = `<div class="flex items-center justify-center h-full gap-2 text-xs text-gray-400"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div>Compressing…</div>`;
      const dataUrl = await compressImageFile(file, 1000, 0.82);
      document.getElementById('serviceFinalUrl').value = dataUrl;
      document.getElementById('svcDropLabel')?.classList.add('hidden');
      document.getElementById('svcImgThumb').src = dataUrl;
      document.getElementById('svcImgPreview').classList.remove('hidden');
    }

          <div><label class="block text-sm mb-1">Question *</label><input type="text" id="faqQuestion" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" required></div>
          <div><label class="block text-sm mb-1">Answer *</label><textarea id="faqAnswer" rows="4" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" required></textarea></div>
        </div>
      `;
      document.getElementById('formModal').classList.remove('hidden');
    }

    function editFaq(idx) {
      const service = store.services.find(s => s.id === currentEditId);
      const faq = service?.faqs?.[idx];
      if (!faq) return;

      document.getElementById('modalTitle').textContent = 'Edit FAQ';
      document.getElementById('modalForm').innerHTML = `
        <div class="space-y-3">
          <div><label class="block text-sm mb-1">Question *</label><input type="text" id="faqQuestion" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" value="${escapeHtml(faq.q)}" required></div>
          <div><label class="block text-sm mb-1">Answer *</label><textarea id="faqAnswer" rows="4" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700">${escapeHtml(faq.a)}</textarea></div>
        </div>
      `;
      editingFaqIndex = idx;
      document.getElementById('formModal').classList.remove('hidden');
    }

    function deleteFaq(idx) {
      const service = store.services.find(s => s.id === currentEditId);
      if (!service?.faqs?.[idx]) return;

      Swal.fire({
        title: 'Delete FAQ?',
        text: 'This action cannot be undone',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        confirmButtonText: 'Delete',
        background: '#1e1e2a',
        color: '#fff'
      }).then((result) => {
        if (result.isConfirmed) {
          service.faqs.splice(idx, 1);
          apiRequest('PUT', `/api/admin/services/${currentEditId}`, service);
          openServiceForm(currentEditId);
          Swal.fire({ icon: 'success', title: 'FAQ deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
        }
      });
    }

    async function saveService() {
      const name      = document.getElementById('serviceName').value.trim();
      const category  = document.getElementById('serviceCategory').value;
      const icon      = document.getElementById('serviceIcon').value.trim() || 'fa-star';
      const shortDesc = document.getElementById('serviceShortDesc').value.trim();
      const longDesc  = document.getElementById('serviceLongDesc').value.trim();
      const isActive  = document.getElementById('serviceActive').checked;

      if (!name) {
        Swal.fire({ icon: 'error', title: 'Missing Name', text: 'Please enter a service name.', background: '#1e1e2a', color: '#fff' });
        return;
      }

      // Use compressed upload or URL — both end up in serviceFinalUrl
      const finalImageUrl = document.getElementById('serviceFinalUrl')?.value ||
                            document.getElementById('serviceImageUrl')?.value || '';

      const service = store.services.find(s => s.id === currentEditId);
      // Preserve existing slug on edit — only generate new slug for brand-new services
      const slug = service?.slug || name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

      const newService = {
        id: currentEditId || Date.now().toString(),
        name,
        slug,
        category,
        icon,
        shortDesc,
        longDesc,
        mainImage: finalImageUrl,
        isActive,
        displayOrder: currentEditId ? service?.displayOrder : store.services.length + 1,
        packages: service?.packages || [],
        features: service?.features || [],
        faqs: service?.faqs || []
      };

      const _svcPath = currentEditId ? `/api/admin/services/${currentEditId}` : '/api/admin/services';
      const result = await apiRequest(currentEditId ? 'PUT' : 'POST', _svcPath, newService);
      if (!result?.data) {
        Swal.fire({ icon: 'error', title: 'Save Failed', text: result?.message || 'Could not save service. Check your API connection.', background: '#1e1e2a', color: '#fff' });
        return;
      }
      if (currentEditId) {
        store.services = store.services.map(s => s.id === currentEditId ? result.data : s);
      } else {
        store.services.push(result.data);
      }
      closeModal();
      renderServices();
      updateStats();
      Swal.fire({
        icon: 'success',
        title: currentEditId ? '✏️ Service Updated!' : '🚀 Service is Live!',
        html: isActive
          ? `<p style="color:#9ca3af">"${escapeHtml(name)}" is now visible to clients on your website.</p><a href="https://lawie-sounds-website.vercel.app/#services" target="_blank" style="color:#a78bfa;font-size:0.85rem">→ See it live</a>`
          : `<p style="color:#9ca3af">"${escapeHtml(name)}" saved as Draft — go live when ready.</p>`,
        timer: 4000, showConfirmButton: false, background: '#1e1e2a', color: '#fff'
      });
    }

    function savePackage() {
      const name = document.getElementById('packageName').value;
      const price = parseInt(document.getElementById('packagePrice').value);
      const duration = document.getElementById('packageDuration').value;
      const featuresText = document.getElementById('packageFeatures').value;

      if (!name) {
        Swal.fire({ icon: 'error', title: 'Missing Name', text: 'Package name is required', background: '#1e1e2a', color: '#fff' });
        return;
      }

      const features = featuresText.split('\n').filter(f => f.trim());
      const service = store.services.find(s => s.id === currentEditId);
      if (!service) { Swal.fire({ icon: 'error', title: 'Save the service first', text: 'Please save the service before adding packages.', background: '#1e1e2a', color: '#fff' }); return; }

      if (!service.packages) service.packages = [];

      const pkg = { name, price, duration, features };

      if (editingPackageIndex !== null) {
        service.packages[editingPackageIndex] = pkg;
      } else {
        service.packages.push(pkg);
      }

      const _pkgSvcId = currentEditId;
      apiRequest('PUT', `/api/admin/services/${_pkgSvcId}`, service);
      closeModal();
      openServiceForm(_pkgSvcId);
      Swal.fire({ icon: 'success', title: editingPackageIndex !== null ? 'Package updated!' : 'Package added!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      editingPackageIndex = null;
    }

    function saveFeature() {
      const title = document.getElementById('featureTitle').value;
      const icon = document.getElementById('featureIcon').value;
      const desc = document.getElementById('featureDesc').value;

      if (!title) {
        Swal.fire({ icon: 'error', title: 'Missing Title', text: 'Feature title is required', background: '#1e1e2a', color: '#fff' });
        return;
      }

      const service = store.services.find(s => s.id === currentEditId);

      if (!service.features) service.features = [];

      const feat = { title, icon, desc };

      if (editingFeatureIndex !== null) {
        service.features[editingFeatureIndex] = feat;
      } else {
        service.features.push(feat);
      }

      const _featSvcId = currentEditId;
      apiRequest('PUT', `/api/admin/services/${_featSvcId}`, service);
      closeModal();
      openServiceForm(_featSvcId);
      Swal.fire({ icon: 'success', title: editingFeatureIndex !== null ? 'Feature updated!' : 'Feature added!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      editingFeatureIndex = null;
    }

    function saveFaq() {
      const q = document.getElementById('faqQuestion').value;
      const a = document.getElementById('faqAnswer').value;

      if (!q || !a) {
        Swal.fire({ icon: 'error', title: 'Missing Fields', text: 'Both question and answer are required', background: '#1e1e2a', color: '#fff' });
        return;
      }

      const service = store.services.find(s => s.id === currentEditId);

      if (!service.faqs) service.faqs = [];

      const faq = { q, a };

      if (editingFaqIndex !== null) {
        service.faqs[editingFaqIndex] = faq;
      } else {
        service.faqs.push(faq);
      }

      const _faqSvcId = currentEditId;
      apiRequest('PUT', `/api/admin/services/${_faqSvcId}`, service);
      closeModal();
      openServiceForm(_faqSvcId);
      Swal.fire({ icon: 'success', title: editingFaqIndex !== null ? 'FAQ updated!' : 'FAQ added!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      editingFaqIndex = null;
    }

    async function deleteService(id) { const result = await Swal.fire({ title: 'Delete service?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff' }); if (result.isConfirmed) { store.services = store.services.filter(s => s.id !== id); await apiRequest('DELETE', `/api/admin/services/${id}`); renderServices(); Swal.fire({ icon: 'success', title: 'Deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' }); } }
    function editService(id) { openServiceForm(id); }

    async function duplicateService(id) {
      const orig = store.services.find(s => s.id === id);
      if (!orig) return;
      const copy = { ...orig, id: undefined, name: orig.name + ' (Copy)', isActive: false, display_order: (orig.displayOrder || 0) + 1 };
      delete copy.id;
      const result = await apiRequest('POST', '/api/admin/services', copy);
      if (result?.data) {
        store.services.push(result.data);
        renderServices();
        Swal.fire({ icon: 'success', title: 'Service Duplicated!', text: 'The copy is saved as a draft — edit it to go live.', timer: 2500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      }
    }

// ==================== GALLERY MANAGEMENT ====================
function renderGallery() {
    const container = document.getElementById('sectionContent');
    if (!container) return;

    const now = Date.now();
    const D30 = 30 * 864e5, D90 = 90 * 864e5;

    const bucket = item => {
      const age = now - new Date(item.createdAt || item.created_at || 0).getTime();
      if (age <= D30) return 'fresh';
      if (age <= D90) return 'recent';
      return 'archive';
    };

    const photos = store.gallery.filter(i => i.type !== 'video');
    const videos = store.gallery.filter(i => i.type === 'video');
    const thisMonth = store.gallery.filter(i => {
      const d = new Date(i.createdAt || i.created_at || 0);
      const n = new Date();
      return d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
    }).length;

    const sections = [
      { key: 'fresh',   label: 'Fresh Uploads',  sub: 'Added in the last 30 days',   color: 'text-green-400',  bg: 'bg-green-900/20', border: 'border-green-700/30',  icon: 'fa-bolt' },
      { key: 'recent',  label: 'Recent Work',     sub: '31 – 90 days ago',            color: 'text-blue-400',   bg: 'bg-blue-900/20',  border: 'border-blue-700/30',   icon: 'fa-camera' },
      { key: 'archive', label: 'Archive',         sub: 'Older uploads',               color: 'text-gray-400',   bg: 'bg-gray-800/40',  border: 'border-gray-700/30',   icon: 'fa-box-archive' },
    ];

    function galleryCard(item) {
      const isVideo = item.type === 'video';
      const thumb = isVideo
        ? `<video src="${item.imageUrl}" class="w-full h-full object-cover"></video><div class="absolute inset-0 flex items-center justify-center"><div class="w-10 h-10 bg-black/60 rounded-full flex items-center justify-center"><i class="fas fa-play text-white text-sm ml-0.5"></i></div></div>`
        : `<img src="${item.imageUrl}" alt="${escapeHtml(item.title)}" loading="lazy" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" onerror="this.parentElement.innerHTML='<div class=\'w-full h-full flex flex-col items-center justify-center bg-gray-700 text-gray-500\'><i class=\'fas fa-image text-2xl mb-1\'></i><p class=\'text-xs\'>Unavailable</p></div>'">`;
      const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleDateString('en-KE', { day:'numeric', month:'short' }) : '';
      const svcBadge = item.serviceSlug ? `<span class="absolute bottom-2 left-2 text-xs bg-purple-700/80 text-purple-200 px-1.5 py-0.5 rounded-full backdrop-blur-sm">${item.serviceSlug.replace(/-/g,' ')}</span>` : '';
      const featBadge = item.isFeatured ? `<span class="absolute top-2 right-2 text-xs bg-yellow-500/90 text-black px-1.5 py-0.5 rounded-full font-bold">⭐</span>` : '';
      return `
        <div class="bg-gray-900 rounded-xl border ${item.isFeatured ? 'border-yellow-500/40' : 'border-gray-800'} overflow-hidden hover:border-purple-500/60 transition group flex flex-col">
          <div class="relative h-36 bg-gray-800 overflow-hidden">
            ${thumb}
            <span class="absolute top-2 left-2 text-xs px-2 py-0.5 rounded-full font-medium ${isVideo ? 'bg-blue-600/80 text-white' : 'bg-black/60 text-gray-200'}">${isVideo ? '🎬' : '📷'}</span>
            ${featBadge}${svcBadge}
          </div>
          <div class="p-2.5 flex-1 flex flex-col">
            <p class="text-xs font-semibold text-white truncate">${escapeHtml(item.title)}</p>
            <p class="text-xs text-gray-500 mt-0.5">${escapeHtml(item.category || '')}${dateStr ? ' · ' + dateStr : ''}</p>
            <div class="flex gap-1 mt-auto pt-2">
              <button onclick="toggleGalleryFeatured('${item.id}')" title="${item.isFeatured ? 'Unfeature' : 'Feature this'}"
                class="flex-none px-2 py-1 rounded-lg text-xs transition ${item.isFeatured ? 'bg-yellow-500/20 text-yellow-400 hover:bg-yellow-500/30' : 'bg-gray-800 text-gray-500 hover:text-yellow-400 hover:bg-gray-700'}">
                <i class="fas fa-star"></i>
              </button>
              <button onclick="openGalleryEditForm('${item.id}')"
                class="flex-1 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs transition flex items-center justify-center gap-1">
                <i class="fas fa-pen text-xs"></i> Edit
              </button>
              <button onclick="deleteGalleryItem('${item.id}')"
                class="flex-none px-2 py-1 bg-red-600/10 hover:bg-red-600/25 text-red-400 rounded-lg text-xs transition">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        </div>`;
    }

    const headerBar = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
          <h2 class="text-xl font-bold text-white">Gallery Management</h2>
          <p class="text-sm text-gray-500 mt-0.5">${store.gallery.length} items · ${photos.length} photos · ${videos.length} videos · ${thisMonth} added this month</p>
        </div>
        <div class="flex gap-2 flex-wrap">
          <button onclick="seedExistingImages()" class="px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 bg-gray-700 hover:bg-gray-600 text-gray-200" title="Import existing service photos into gallery">
            <i class="fas fa-seedling text-green-400"></i> Import Existing Photos
          </button>
          <button onclick="openGalleryForm()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fas fa-upload"></i> Upload New
          </button>
        </div>
      </div>`;

    if (!store.gallery || store.gallery.length === 0) {
      container.innerHTML = headerBar + `
        <div class="bg-gray-900 border-2 border-dashed border-gray-700 rounded-2xl p-16 text-center">
          <div class="w-20 h-20 bg-purple-600/10 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-images text-purple-400 text-3xl"></i>
          </div>
          <h3 class="text-lg font-bold text-white mb-2">Your gallery is empty</h3>
          <p class="text-gray-500 text-sm max-w-sm mx-auto mb-6">Start by importing your existing service photos, or upload new ones from an event you just covered.</p>
          <div class="flex flex-wrap justify-center gap-3">
            <button onclick="seedExistingImages()" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-green-700 hover:bg-green-600 text-white text-sm font-medium transition">
              <i class="fas fa-seedling"></i> Import Existing Photos (84 available)
            </button>
            <button onclick="openGalleryForm()" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium transition">
              <i class="fas fa-upload"></i> Upload a New Photo
            </button>
          </div>
        </div>`;
      return;
    }

    const sectionsHtml = sections.map(s => {
      const items = store.gallery.filter(i => bucket(i) === s.key);
      if (!items.length) return '';
      return `
        <div class="mb-8">
          <div class="flex items-center gap-3 mb-4 px-1">
            <div class="w-8 h-8 ${s.bg} rounded-lg flex items-center justify-center border ${s.border}">
              <i class="fas ${s.icon} ${s.color} text-sm"></i>
            </div>
            <div>
              <h3 class="font-bold text-white">${s.label} <span class="text-gray-500 font-normal text-sm">(${items.length})</span></h3>
              <p class="text-xs text-gray-500">${s.sub}</p>
            </div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
            ${items.map(galleryCard).join('')}
          </div>
        </div>`;
    }).join('');

    // Items with no date fall into archive — already handled by bucket()
    container.innerHTML = headerBar + sectionsHtml;
}

// Seed existing local images into gallery
async function seedExistingImages() {
  const SEED = [
    // ── EVENT PHOTOS (Gallery/ folder — shown on public website) ──────────────
    // Weddings (8)
    ...Array.from({length:8}, (_,i) => ({ title:`Wedding — Shot ${i+1}`, category:'Weddings', type:'image', imageUrl:`/Gallery/Weddings/${i+1}.jpg` })),
    // Ruracio (9)
    ...Array.from({length:8}, (_,i) => ({ title:`Ruracio — Itara ${i+1}`, category:'Ruracio', type:'image', imageUrl:`/Gallery/Ruracio/Itara${i+1}.jpg` })),
    { title:'Ruracio — DSC 7967', category:'Ruracio', type:'image', imageUrl:'/Gallery/Ruracio/DSC_7967_14_11zon.jpg' },
    // Corporate (6)
    ...Array.from({length:6}, (_,i) => ({ title:`Corporate — Shot ${i+1}`, category:'Corporate', type:'image', imageUrl:`/Gallery/corporate/${i+1}.jpg` })),
    // Equipment & Setup (16)
    { title:'Line Array Setup', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/linearray.jpg' },
    { title:'Line Array Setup 2', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/linearray1.jpg' },
    { title:'Line Array Setup 3', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/linearray2.jpg' },
    { title:'DJ Decks Setup', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/Dj decks setup.jpg' },
    { title:'Connecting Cables', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/connecting cables.jpg' },
    { title:'Mixer Setup', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/mixer.jpg' },
    { title:'PAR Can Lights', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/par can lights.jpg' },
    { title:'Pyrotechnics Display', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/pyrotechnics.jpg' },
    { title:'LED Screen Setup', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/screen.jpg' },
    { title:'LED Screen Setup 2', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/screen2.jpg' },
    { title:'Stage Setup', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/setup2.jpg' },
    { title:'Stage Setup 2', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/setup3.jpg' },
    { title:'Sound Setup', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/sound setup.jpg' },
    { title:'Sound Technicians', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/sound technicians.jpg' },
    { title:'Sound Technicians 2', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/sound technicians2.jpg' },
    { title:'Equipment Shot 3', category:'Sound & Equipment', type:'image', imageUrl:'/Gallery/equipment/3.jpg' },

    // ── SERVICE PHOTOS (IMAGES/ folder — equipment & service demos) ───────────
    // DJ & MC Services (7)
    ...Array.from({length:7}, (_,i) => ({ title:`DJ & MC — Shot ${i+1}`, category:'Audio', type:'image', imageUrl:`/IMAGES/DJ and MC Services/${i+1}.jpg` })),
    // LED Screens (8)
    ...Array.from({length:8}, (_,i) => ({ title:`LED Screen — Shot ${i+1}`, category:'Visual', type:'image', imageUrl:`/IMAGES/LED Screens/${i+1}.jpg` })),
    // Power & Lighting (4)
    ...Array.from({length:4}, (_,i) => ({ title:`Power & Lighting — Shot ${i+1}`, category:'Equipment', type:'image', imageUrl:`/IMAGES/Power & Lighting/${i+1}.jpg` })),
    // Pyrotechnics (2)
    ...Array.from({length:2}, (_,i) => ({ title:`Pyrotechnics — Shot ${i+1}`, category:'Effects', type:'image', imageUrl:`/IMAGES/Pyrotechnics/${i+1}.jpg` })),
    // Photography (8)
    ...Array.from({length:8}, (_,i) => ({ title:`Photography — Shot ${i+1}`, category:'Media', type:'image', imageUrl:`/IMAGES/Photography/${i+1}.jpg` })),
    // Live Streaming (5)
    ...Array.from({length:5}, (_,i) => ({ title:`Live Streaming — Shot ${i+1}`, category:'Media', type:'image', imageUrl:`/IMAGES/Live Streaming & Media/${i+1}.jpg` })),
    // 360 Booth (4)
    ...Array.from({length:4}, (_,i) => ({ title:`360 Booth — Shot ${i+1}`, category:'Equipment', type:'image', imageUrl:`/IMAGES/360 Booth/${i+1}.jpg` })),
    // Drone (2)
    ...Array.from({length:2}, (_,i) => ({ title:`Drone Aerial — Shot ${i+1}`, category:'Media', type:'image', imageUrl:`/IMAGES/Drone/${i+1}.jpg` })),
    // Public Address (5)
    ...Array.from({length:5}, (_,i) => ({ title:`PA System — Shot ${i+1}`, category:'Audio', type:'image', imageUrl:`/IMAGES/Public Address Systems/${i+1}.jpg` })),
  ];

  // Only seed images not already in gallery (match by imageUrl)
  const existing = new Set((store.gallery || []).map(g => g.imageUrl));
  const toSeed = SEED.filter(s => !existing.has(s.imageUrl));

  if (!toSeed.length) {
    Swal.fire({ icon: 'info', title: 'Already Imported', text: 'All existing photos are already in your gallery.', background: '#1e1e2a', color: '#fff' });
    return;
  }

  const { isConfirmed } = await Swal.fire({
    icon: 'question',
    title: 'Import Existing Photos?',
    html: `<p style="color:#9ca3af">This will add <strong style="color:#fff">${toSeed.length} photos</strong> from your event and service library into the gallery — including real event photos (Weddings, Ruracio, Corporate, Equipment setups).<br><br>They'll appear on your website immediately. You can remove any you don't want afterwards.</p>`,
    showCancelButton: true,
    confirmButtonText: 'Yes, Import All',
    confirmButtonColor: '#7c4dff',
    cancelButtonText: 'Cancel',
    background: '#1e1e2a',
    color: '#fff'
  });
  if (!isConfirmed) return;

  const btn = document.querySelector('button[onclick="seedExistingImages()"]');
  if (btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Importing…';

  let done = 0, failed = 0;
  for (const item of toSeed) {
    const result = await apiRequest('POST', '/api/admin/gallery', item);
    if (result?.data) { store.gallery.unshift(result.data); done++; }
    else failed++;
  }

  updateStats();
  renderGallery();
  Swal.fire({
    icon: done > 0 ? 'success' : 'error',
    title: done > 0 ? `${done} Photos Imported!` : 'Import Failed',
    html: done > 0
      ? `<p style="color:#9ca3af">Your gallery now has <strong style="color:#fff">${store.gallery.length}</strong> items.${failed > 0 ? ` (${failed} couldn't be added — check your API connection.)` : ''}</p><a href="/gallery.html" target="_blank" style="color:#a78bfa;font-size:.85rem">→ View gallery on your website</a>`
      : `<p style="color:#9ca3af">Could not connect to the API. Check that you are logged in and the server is running.</p>`,
    timer: 5000, showConfirmButton: false, background: '#1e1e2a', color: '#fff'
  });
}

// Shared category + service-slug options for gallery forms
const GALLERY_CATEGORIES = ['Weddings','Ruracio','Corporate','Parties','Sound & Equipment','Behind the Scenes','Drone','General'];
const SERVICE_SLUG_OPTIONS = [
  { slug: '', label: '— None (not linked to a service) —' },
  { slug: 'dj-mc-services',  label: 'DJ & MC Services' },
  { slug: 'led-screens',     label: 'LED Screens' },
  { slug: 'power-lighting',  label: 'Power & Lighting' },
  { slug: 'pyrotechnics',    label: 'Pyrotechnics' },
  { slug: 'photography',     label: 'Photography' },
  { slug: 'live-streaming',  label: 'Live Streaming' },
  { slug: '360-booth',       label: '360 Booth' },
  { slug: 'drone-services',  label: 'Drone Services' },
  { slug: 'public-address',  label: 'Public Address Systems' },
];
function galleryCategoryOptions(selected = '') {
  return GALLERY_CATEGORIES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
}
function galleryServiceOptions(selected = '') {
  return SERVICE_SLUG_OPTIONS.map(o => `<option value="${o.slug}" ${o.slug === selected ? 'selected' : ''}>${o.label}</option>`).join('');
}

async function saveGalleryEdit() {
    const title      = document.getElementById('galleryEditTitle')?.value?.trim();
    const category   = document.getElementById('galleryEditCategory')?.value;
    const type       = document.getElementById('galleryEditType')?.value;
    const serviceSlug = document.getElementById('galleryEditServiceSlug')?.value || null;
    const isFeatured = document.getElementById('galleryEditFeatured')?.checked || false;
    if (!title) { Swal.fire({ icon: 'error', title: 'Missing Title', background: '#1e1e2a', color: '#fff' }); return; }
    const item = store.gallery.find(i => i.id === currentEditId);
    if (!item) return;
    const result = await apiRequest('PUT', `/api/admin/gallery/${currentEditId}`, { title, category, type, imageUrl: item.imageUrl, serviceSlug, isFeatured });
    if (!result?.data) { Swal.fire({ icon: 'error', title: 'Save Failed', background: '#1e1e2a', color: '#fff' }); return; }
    store.gallery = store.gallery.map(i => i.id === currentEditId ? result.data : i);
    closeModal();
    renderGallery();
    Swal.fire({ icon: 'success', title: 'Updated!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
}

async function toggleGalleryFeatured(id) {
    const result = await apiRequest('PATCH', `/api/admin/gallery/${id}/feature`);
    if (!result?.data) return;
    store.gallery = store.gallery.map(i => i.id === id ? result.data : i);
    renderGallery();
}

async function saveGalleryItem() {
    const titleInput = document.getElementById('galleryTitle');
    const categorySelect = document.getElementById('galleryCategory');
    const typeSelect = document.getElementById('galleryType');
    const fileInput = document.getElementById('galleryFile');
    
    if (!titleInput.value.trim()) { Swal.fire({ icon: 'error', title: 'Missing Title', text: 'Please enter a title', background: '#1e1e2a', color: '#fff' }); return; }
    if (!fileInput.files || !fileInput.files[0]) { Swal.fire({ icon: 'error', title: 'No File', text: 'Please select a file', background: '#1e1e2a', color: '#fff' }); return; }
    
    const file = fileInput.files[0];
    const title = titleInput.value;
    const category = categorySelect.value;
    const type = typeSelect.value;
    
    const progressArea = document.getElementById('uploadProgressArea');
    const progressBar = document.getElementById('uploadProgressBar');
    const percentSpan = document.getElementById('uploadPercent');
    const statusMsg = document.getElementById('uploadStatusMsg');
    
    if (progressArea) progressArea.classList.remove('hidden');
    if (statusMsg) statusMsg.textContent = type === 'image' ? 'Compressing image…' : 'Reading file…';
    if (progressBar) progressBar.style.width = '40%';
    if (percentSpan) percentSpan.textContent = '40%';

    let imageUrl;
    if (type === 'image') {
      imageUrl = await compressImageFile(file, 1400, 0.82);
    } else {
      imageUrl = await new Promise((resolve) => { const r = new FileReader(); r.onload = e => resolve(e.target.result); r.readAsDataURL(file); });
    }

    if (statusMsg) statusMsg.textContent = 'Saving to gallery…';
    if (progressBar) progressBar.style.width = '100%';
    if (percentSpan) percentSpan.textContent = '100%';

    const serviceSlug = document.getElementById('galleryServiceSlug')?.value || null;
    const isFeatured  = document.getElementById('galleryFeatured')?.checked || false;
    const result = await apiRequest('POST', '/api/admin/gallery', { title, category, type, imageUrl, serviceSlug, isFeatured });

    if (progressArea) progressArea.classList.add('hidden');
    if (progressBar) progressBar.style.width = '0%';
    if (percentSpan) percentSpan.textContent = '0%';

    if (!result?.data) {
      Swal.fire({ icon: 'error', title: 'Save Failed', text: result?.message || 'Could not save to gallery. Check your API connection.', background: '#1e1e2a', color: '#fff' });
      return;
    }

    if (!store.gallery) store.gallery = [];
    store.gallery.unshift(result.data);
    closeModal();
    renderGallery();

    Swal.fire({
      icon: 'success', title: 'Now Live on Your Website!',
      html: `<p style="color:#9ca3af">"${title}" is now visible in your gallery.</p><a href="https://lawie-sounds-website.vercel.app/#gallery" target="_blank" style="color:#a78bfa;font-size:0.85rem">→ View it on your site</a>`,
      timer: 4000, showConfirmButton: false, background: '#1e1e2a', color: '#fff'
    });
    titleInput.value = '';
    fileInput.value = '';
}

async function deleteGalleryItem(id) {
    const result = await Swal.fire({ title: 'Delete item?', text: 'This action cannot be undone', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff' });
    if (result.isConfirmed) {
        store.gallery = store.gallery.filter(i => i.id !== id);
        await apiRequest('DELETE', `/api/admin/gallery/${id}`);
        renderGallery();
        Swal.fire({ icon: 'success', title: 'Deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
    }
}

    const container = document.getElementById('sectionContent');
    if (!container) return;
    
    const now = new Date().toISOString().split('T')[0];
    let filtered = store.marketingBanners || [];
    
    if (marketingViewMode === 'active') {
        filtered = store.marketingBanners.filter(b => b.isActive === true && (!b.endDate || b.endDate >= now));
    } else if (marketingViewMode === 'expired') {
        filtered = store.marketingBanners.filter(b => b.endDate && b.endDate < now);
    }
    
    // Filtered view
    
    container.innerHTML = `
        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
            <div class="flex gap-2">
                <button onclick="setMarketingView('active')" class="px-4 py-2 rounded-lg text-sm ${marketingViewMode === 'active' ? 'bg-purple-600 text-white' : 'bg-gray-800'}">✅ Active</button>

        </div>
        
        ${filtered.length === 0 ? `

                <p class="text-gray-400">No marketing banners found</p>
                <button onclick="openMarketingForm()" class="mt-4 text-purple-400 hover:underline">Create your first banner →</button>
            </div>
        ` : `
            <div class="space-y-3">
                ${filtered.map(banner => `
                    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 hover:border-purple-500 transition">
                        <div class="flex justify-between items-start flex-wrap gap-3">
                            <div class="flex-1">
