    async function saveService() {
      const name      = document.getElementById('serviceName').value.trim();
      const category  = document.getElementById('serviceCategory').value;
      const icon      = document.getElementById('serviceIcon').value.trim() || 'fa-star';
      const shortDesc = document.getElementById('serviceShortDesc').value.trim();
      const longDesc  = document.getElementById('serviceLongDesc').value.trim();
      const isActive  = document.getElementById('serviceActive').checked;

      if (!name) {
        Swal.fire({ icon: 'error', title: 'Missing Name', text: 'Please enter a service name.', background: '#1e1e2a', color: '#fff' });
        return;
      }

      // Use compressed upload or URL — both end up in serviceFinalUrl
      const finalImageUrl = document.getElementById('serviceFinalUrl')?.value ||
                            document.getElementById('serviceImageUrl')?.value || '';

      const service = store.services.find(s => s.id === currentEditId);
      // Preserve existing slug on edit — only generate new slug for brand-new services
      const slug = service?.slug || name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

      const newService = {
        id: currentEditId || Date.now().toString(),
        name,
        slug,
        category,
        icon,
        shortDesc,
        longDesc,
        mainImage: finalImageUrl,
        isActive,
        displayOrder: currentEditId ? service?.displayOrder : store.services.length + 1,
        priceDisplay: document.getElementById('svcPriceDisplay')?.value || 'from',
        budgetNote:   document.getElementById('svcBudgetNote')?.value.trim() || null,
        // packages deliberately omitted: they are rows in service_packages now,
        // and sending the old JSONB array here would give two conflicting
        // sources of truth for the same prices.
        features: service?.features || [],
        faqs: service?.faqs || []
      };

      const _svcPath = currentEditId ? `/api/admin/services/${currentEditId}` : '/api/admin/services';
      const result = await apiRequest(currentEditId ? 'PUT' : 'POST', _svcPath, newService);
      if (!result?.data) {
        Swal.fire({ icon: 'error', title: 'Save Failed', text: result?.message || 'Could not save service. Check your API connection.', background: '#1e1e2a', color: '#fff' });
        return;
      }
      if (currentEditId) {
        store.services = store.services.map(s => s.id === currentEditId ? result.data : s);
      } else {
        store.services.push(result.data);
      }
      closeModal();
      renderServices();
      updateStats();
      Swal.fire({
        icon: 'success',
        title: currentEditId ? '✏️ Service Updated!' : '🚀 Service is Live!',
        html: isActive
          ? `<p style="color:#9ca3af">"${escapeHtml(name)}" is now visible to clients on your website.</p><a href="https://lawie-sounds-website.vercel.app/#services" target="_blank" style="color:#a78bfa;font-size:0.85rem">→ See it live</a>`
          : `<p style="color:#9ca3af">"${escapeHtml(name)}" saved as Draft — go live when ready.</p>`,
        timer: 4000, showConfirmButton: false, background: '#1e1e2a', color: '#fff'
      });
    }

    // The original index-addressed savePackage lived here. Replaced by the
    // id-based version further up, which awaits the request and checks its
    // result before reporting success. The old one fired an un-awaited PUT of
    // the whole service, mutated the local store, then re-rendered from that
    // mutated copy and showed "Package added!" regardless of the outcome.

    function saveFeature() {
      const title = document.getElementById('featureTitle').value;
      const icon = document.getElementById('featureIcon').value;
      const desc = document.getElementById('featureDesc').value;

      if (!title) {
        Swal.fire({ icon: 'error', title: 'Missing Title', text: 'Feature title is required', background: '#1e1e2a', color: '#fff' });
        return;
      }

      const service = store.services.find(s => s.id === currentEditId);

      if (!service.features) service.features = [];

      const feat = { title, icon, desc };

      if (editingFeatureIndex !== null) {
        service.features[editingFeatureIndex] = feat;
      } else {
        service.features.push(feat);
      }

      const _featSvcId = currentEditId;
      apiRequest('PUT', `/api/admin/services/${_featSvcId}`, service);
      closeModal();
      openServiceForm(_featSvcId);
      Swal.fire({ icon: 'success', title: editingFeatureIndex !== null ? 'Feature updated!' : 'Feature added!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      editingFeatureIndex = null;
    }

    function saveFaq() {
      const q = document.getElementById('faqQuestion').value;
      const a = document.getElementById('faqAnswer').value;

      if (!q || !a) {
        Swal.fire({ icon: 'error', title: 'Missing Fields', text: 'Both question and answer are required', background: '#1e1e2a', color: '#fff' });
        return;
      }

      const service = store.services.find(s => s.id === currentEditId);

      if (!service.faqs) service.faqs = [];

      const faq = { q, a };

      if (editingFaqIndex !== null) {
        service.faqs[editingFaqIndex] = faq;
      } else {
        service.faqs.push(faq);
      }

      const _faqSvcId = currentEditId;
      apiRequest('PUT', `/api/admin/services/${_faqSvcId}`, service);
      closeModal();
      openServiceForm(_faqSvcId);
      Swal.fire({ icon: 'success', title: editingFaqIndex !== null ? 'FAQ updated!' : 'FAQ added!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      editingFaqIndex = null;
    }

    async function deleteService(id) { const result = await Swal.fire({ title: 'Delete service?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff' }); if (result.isConfirmed) { store.services = store.services.filter(s => s.id !== id); await apiRequest('DELETE', `/api/admin/services/${id}`); renderServices(); Swal.fire({ icon: 'success', title: 'Deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' }); } }
    function editService(id) { openServiceForm(id); }

    async function duplicateService(id) {
      const orig = store.services.find(s => s.id === id);
      if (!orig) return;
      const copy = { ...orig, id: undefined, name: orig.name + ' (Copy)', isActive: false, display_order: (orig.displayOrder || 0) + 1 };
      delete copy.id;
      const result = await apiRequest('POST', '/api/admin/services', copy);
      if (result?.data) {
        store.services.push(result.data);
        renderServices();
        Swal.fire({ icon: 'success', title: 'Service Duplicated!', text: 'The copy is saved as a draft — edit it to go live.', timer: 2500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      }
    }

// ==================== GALLERY MANAGEMENT ====================
//
// Media goes straight from the browser to Supabase Storage via a signed URL.
// The old flow base64-encoded the file and POSTed it as JSON, which stored
// whole images inside a Postgres text column and could not work at all on
// Vercel (serverless request bodies are capped at 4.5 MB, and base64 inflates
// by a third). Nothing large ever uploaded; the failure surfaced as a generic
// "Save Failed".

const galleryUI = {
  filter:    'all',     // 'all' | 'drafts' | 'featured' | a category slug
  search:    '',
  selected:  new Set(),
  dragId:    null,
  uploads:   [],        // live upload rows, rendered in the modal
};

// Taxonomy comes from the API, not a hardcoded array. The previous hardcoded
// list had drifted so far from the live data that only one of eight values
// still existed — so opening any seeded photo in the edit form and saving
// silently reassigned its category to whatever sat first in the dropdown.
let galleryCategories = [];
let galleryCategoriesLoaded = false;   // guards the lazy fetch below

async function loadGalleryCategories() {
  const res = await apiRequest('GET', '/api/admin/gallery/categories');
  galleryCategories = res?.data || [];
  galleryCategoriesLoaded = true;
  return galleryCategories;
}

function catLabelFor(slug) {
  const c = galleryCategories.find(x => x.slug === slug);
  return c ? `${c.emoji} ${c.label}` : (slug || 'Uncategorised');
}
function galleryCategoryOptions(selected = '') {
  return galleryCategories
    .map(c => `<option value="${escapeHtml(c.slug)}" ${c.slug === selected ? 'selected' : ''}>${escapeHtml(c.emoji + ' ' + c.label)}</option>`)
    .join('');
}
function galleryServiceOptions(selected = '') {
  // Built from the live services table rather than a second hardcoded list —
  // the same drift that broke categories was waiting to happen here.
  const opts = (store.services || []).filter(s => s.slug)
    .map(s => `<option value="${escapeHtml(s.slug)}" ${s.slug === selected ? 'selected' : ''}>${escapeHtml(s.name)}</option>`)
    .join('');
  return `<option value="">— Not linked to a service —</option>${opts}`;
}

// ── Filtering ──────────────────────────────────────────────────
function visibleGalleryItems() {
  let items = store.gallery || [];
  const q = galleryUI.search.toLowerCase();

  if (galleryUI.filter === 'drafts')        items = items.filter(i => i.isPublished === false);
  else if (galleryUI.filter === 'featured') items = items.filter(i => i.isFeatured);
  else if (galleryUI.filter !== 'all')      items = items.filter(i => i.category === galleryUI.filter);

  if (q) items = items.filter(i =>
    (i.title || '').toLowerCase().includes(q) ||
    (i.category || '').toLowerCase().includes(q) ||
    (i.caption || '').toLowerCase().includes(q));

  // Reordering only makes sense inside one category, so that is the only view
  // sorted by display_order. Everywhere else, newest first.
  const single = !['all', 'drafts', 'featured'].includes(galleryUI.filter);
  return single
    ? [...items].sort((a, b) => (a.displayOrder || 0) - (b.displayOrder || 0))
    : [...items].sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
}

// ── Render ─────────────────────────────────────────────────────
function renderGallery() {
  const container = document.getElementById('sectionContent');
  if (!container) return;

  // Fetch the taxonomy once, then re-render. Keyed on "have we tried" rather
  // than "is the list empty" — an API error returns an empty list, and keying
  // on emptiness would refetch and re-render forever.
  if (!galleryCategoriesLoaded) {
    loadGalleryCategories().then(renderGallery);
  }

  const all       = store.gallery || [];
  const items     = visibleGalleryItems();
  const drafts    = all.filter(i => i.isPublished === false).length;
  const featured  = all.filter(i => i.isFeatured).length;
  const videos    = all.filter(i => i.type === 'video').length;
  const reorderable = !['all', 'drafts', 'featured'].includes(galleryUI.filter) && !galleryUI.search;

  const chip = (key, label, count, tone = '') => `
    <button type="button" onclick="setGalleryFilter('${key}')"
      class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition border ${
        galleryUI.filter === key
          ? 'bg-purple-600 border-purple-500 text-white'
          : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white hover:bg-gray-700'}">
      ${label}${count !== null ? ` <span class="opacity-60">${count}</span>` : ''}
    </button>`;

  const header = `
    <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
      <div>
        <h2 class="text-xl font-bold text-white">Gallery</h2>
        <p class="text-sm text-gray-500 mt-0.5">
          ${all.length} item${all.length !== 1 ? 's' : ''}
          ${videos ? ` · ${videos} video${videos !== 1 ? 's' : ''}` : ''}
          ${featured ? ` · ${featured} featured` : ''}
          ${drafts ? ` · <span class="text-yellow-400">${drafts} not published</span>` : ''}
        </p>
      </div>
      <div class="flex gap-2 flex-wrap">
        <a href="/gallery.html" target="_blank" rel="noopener"
          class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-gray-700 text-gray-300 transition flex items-center gap-2">
          <i class="fas fa-external-link-alt text-xs"></i> View live page
        </a>
        <button type="button" onclick="openGalleryForm()"
          class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fas fa-cloud-arrow-up"></i> Upload photos
        </button>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2 mb-4">
      <div class="flex gap-1.5 flex-wrap flex-1">
        ${chip('all', 'All', all.length)}
        ${drafts ? chip('drafts', '📝 Drafts', drafts) : ''}
        ${featured ? chip('featured', 'Featured', featured) : ''}
        ${galleryCategories.map(c => {
          const n = all.filter(i => i.category === c.slug).length;
          return n ? chip(c.slug, `${c.emoji} ${c.label}`, n) : '';
        }).join('')}
      </div>
      <div class="relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-500"></i>
        <input type="text" id="gallerySearchInput" value="${escapeHtml(galleryUI.search)}"
          oninput="onGallerySearch(this.value)" placeholder="Search…"
          class="w-40 pl-8 pr-3 py-1.5 rounded-lg text-sm bg-gray-800 border border-gray-700 focus:border-purple-500 focus:outline-none">
      </div>
    </div>`;

  // Bulk bar only exists when something is selected — an always-visible row of
  // disabled buttons is just noise the manager has to read past every time.
  const bulkBar = galleryUI.selected.size ? `
    <div class="sticky top-2 z-20 mb-4 bg-purple-900/90 backdrop-blur border border-purple-600/50 rounded-xl px-4 py-2.5 flex flex-wrap items-center gap-2">
      <span class="text-sm font-semibold text-white mr-1">${galleryUI.selected.size} selected</span>
      <button type="button" onclick="bulkGallery('publish')"   class="px-3 py-1.5 rounded-lg text-xs bg-green-600/80 hover:bg-green-600 transition">Publish</button>
      <button type="button" onclick="bulkGallery('unpublish')" class="px-3 py-1.5 rounded-lg text-xs bg-gray-700 hover:bg-gray-600 transition">Unpublish</button>
      <button type="button" onclick="bulkGallery('feature')"   class="px-3 py-1.5 rounded-lg text-xs bg-yellow-600/80 hover:bg-yellow-600 transition">Feature</button>
      <button type="button" onclick="bulkGallery('unfeature')" class="px-3 py-1.5 rounded-lg text-xs bg-gray-700 hover:bg-gray-600 transition">Unfeature</button>
      <button type="button" onclick="bulkGallery('delete')"    class="px-3 py-1.5 rounded-lg text-xs bg-red-600/80 hover:bg-red-600 transition">Delete</button>
      <button type="button" onclick="clearGallerySelection()"  class="px-3 py-1.5 rounded-lg text-xs text-purple-200 hover:text-white ml-auto">Clear</button>
    </div>` : '';

  if (!all.length) {
    container.innerHTML = header + `
      <div class="bg-gray-900 border-2 border-dashed border-gray-700 rounded-2xl p-16 text-center">
        <div class="w-20 h-20 bg-purple-600/10 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-images text-purple-400 text-3xl"></i>
        </div>
        <h3 class="text-lg font-bold text-white mb-2">Your gallery is empty</h3>
        <p class="text-gray-500 text-sm max-w-sm mx-auto mb-6">Upload photos from an event you have just covered. You can select several at once.</p>
        <button type="button" onclick="openGalleryForm()" class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium transition">
          <i class="fas fa-cloud-arrow-up"></i> Upload photos
        </button>
      </div>`;
    return;
  }

  if (!items.length) {
    container.innerHTML = header + bulkBar + `
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-12 text-center">
        <i class="fas fa-filter text-3xl text-gray-600 mb-3"></i>
        <h3 class="text-base font-bold text-white mb-1">Nothing matches this view</h3>
        <p class="text-gray-500 text-sm mb-5">Try a different category, or clear the search.</p>
        <button type="button" onclick="setGalleryFilter('all')" class="px-5 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm transition">Show all</button>
      </div>`;
    return;
  }

  const hint = reorderable
    ? `<p class="text-xs text-gray-500 mb-3"><i class="fas fa-up-down-left-right mr-1"></i> Drag photos to change the order they appear on the website.</p>`
    : `<p class="text-xs text-gray-600 mb-3"><i class="fas fa-circle-info mr-1"></i> Pick a single category to drag photos into your preferred order.</p>`;

  container.innerHTML = header + bulkBar + hint + `
    <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
      ${items.map(i => galleryCard(i, reorderable)).join('')}
    </div>`;

  if (reorderable) wireGalleryDrag();
}

function galleryCard(item, draggable) {
  const isVideo   = item.type === 'video';
  const selected  = galleryUI.selected.has(item.id);
  const draft     = item.isPublished === false;
  // A video tile shows its poster. Pointing a <video> at the source just to
  // paint a thumbnail downloads the whole file.
  const thumb     = isVideo ? (item.thumbUrl || '') : item.imageUrl;

  const media = thumb
    ? `<img src="${escapeHtml(thumb)}" alt="${escapeHtml(item.altText || item.title)}" loading="lazy" decoding="async"
         class="w-full h-full object-cover transition duration-300 group-hover:scale-105"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
       <div style="display:none" class="w-full h-full flex-col items-center justify-center bg-gray-800 text-gray-500">
         <i class="fas fa-image-slash text-xl mb-1"></i><p class="text-xs">Image missing</p></div>`
    : `<div class="w-full h-full flex flex-col items-center justify-center bg-gray-800 text-gray-500">
         <i class="fas fa-film text-xl mb-1"></i><p class="text-xs">No poster</p></div>`;

  return `
    <div class="bg-gray-900 rounded-xl border overflow-hidden transition group flex flex-col
                ${selected ? 'border-purple-500 ring-2 ring-purple-500/40' : draft ? 'border-yellow-600/40' : item.isFeatured ? 'border-yellow-500/30' : 'border-gray-800'}
                hover:border-purple-500/60"
         data-id="${item.id}" ${draggable ? 'draggable="true"' : ''}>

      <div class="relative h-32 bg-gray-800 overflow-hidden">
        ${media}

        <label class="absolute top-2 left-2 w-6 h-6 rounded-md bg-black/60 backdrop-blur flex items-center justify-center cursor-pointer hover:bg-black/80 transition">
          <input type="checkbox" ${selected ? 'checked' : ''} onchange="toggleGallerySelect('${item.id}')"
            class="accent-purple-500 w-3.5 h-3.5 cursor-pointer" aria-label="Select ${escapeHtml(item.title)}">
        </label>

        <div class="absolute top-2 right-2 flex gap-1">
          ${isVideo   ? `<span class="text-xs bg-blue-600/85 text-white px-1.5 py-0.5 rounded-full">🎬</span>` : ''}
          ${item.isFeatured ? `<span class="text-xs bg-yellow-500/90 text-black px-1.5 py-0.5 rounded-full font-bold">⭐</span>` : ''}
          ${draft     ? `<span class="text-xs bg-yellow-600/90 text-black px-1.5 py-0.5 rounded-full font-bold">Draft</span>` : ''}
        </div>

        ${item.serviceSlug ? `<span class="absolute bottom-2 left-2 text-xs bg-purple-700/80 text-purple-100 px-1.5 py-0.5 rounded-full backdrop-blur-sm">${escapeHtml(item.serviceSlug.replace(/-/g, ' '))}</span>` : ''}

async function bulkGallery(action) {
  const ids = [...galleryUI.selected];
  if (!ids.length) return;

  if (action === 'delete') {
    const ok = await Swal.fire({
      title: `Delete ${ids.length} item${ids.length !== 1 ? 's' : ''}?`,
      text: 'The photos are removed from the website and from storage. This cannot be undone.',
      icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
      confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff',
    });
    if (!ok.isConfirmed) return;
  }

  const res = await apiRequest('POST', '/api/admin/gallery/bulk', { action, ids });
  if (res?._error) { Swal.fire({ icon: 'error', title: 'Could not apply', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }

  if (action === 'delete') {
    store.gallery = store.gallery.filter(i => !ids.includes(i.id));
  } else {
    const byId = Object.fromEntries((res.data?.items || []).map(i => [i.id, i]));
    store.gallery = store.gallery.map(i => byId[i.id] || i);
  }
  galleryUI.selected.clear();
  renderGallery();
  updateStats();
  showToast(`${ids.length} item${ids.length !== 1 ? 's' : ''} updated`, 'success');
}

// ── Drag to reorder ────────────────────────────────────────────
function wireGalleryDrag() {
  const grid = document.getElementById('galleryGrid');
  if (!grid) return;

  grid.querySelectorAll('[data-id]').forEach(card => {
    card.addEventListener('dragstart', e => {
      galleryUI.dragId = card.dataset.id;
      card.style.opacity = '0.4';
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => { card.style.opacity = ''; });
    card.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    card.addEventListener('drop', async e => {
      e.preventDefault();
      const fromId = galleryUI.dragId, toId = card.dataset.id;
      if (!fromId || fromId === toId) return;

      const order = [...grid.querySelectorAll('[data-id]')].map(el => el.dataset.id);
      order.splice(order.indexOf(toId), 0, ...order.splice(order.indexOf(fromId), 1));

      // Optimistic: repaint immediately, then persist. Spacing by 10 leaves
      // room to insert between two items without renumbering everything.
      const payload = order.map((id, idx) => ({ id, displayOrder: (idx + 1) * 10 }));
      const byId = Object.fromEntries(payload.map(p => [p.id, p.displayOrder]));
      store.gallery = store.gallery.map(i => byId[i.id] !== undefined ? { ...i, displayOrder: byId[i.id] } : i);
      renderGallery();

      const res = await apiRequest('PATCH', '/api/admin/gallery/reorder', { items: payload });
      if (res?._error) {
        showToast('Order could not be saved — reloading', 'info');
        const fresh = await apiRequest('GET', '/api/admin/gallery');
        store.gallery = fresh?.data || store.gallery;
        renderGallery();
      }
    });
  });
}

  if (res?._error || !res?.data) { showToast('Could not update', 'info'); return; }
  store.gallery = store.gallery.map(i => i.id === id ? res.data : i);

async function deleteGalleryItem(id) {
  const item = store.gallery.find(i => i.id === id);
  const result = await Swal.fire({
    title: 'Delete this photo?',
    html: `<p style="color:#9ca3af">“${escapeHtml(item?.title || '')}” will be removed from the website and from storage.</p>`,
    icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
    confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff',
  });
  if (!result.isConfirmed) return;

  const res = await apiRequest('DELETE', `/api/admin/gallery/${id}`);
  if (res?._error) { Swal.fire({ icon: 'error', title: 'Delete failed', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }

  // Only drop it locally once the server confirms — the old code removed it
  // from the grid first, so a failed delete looked like a success until reload.
  store.gallery = store.gallery.filter(i => i.id !== id);
  galleryUI.selected.delete(id);
  renderGallery();
  updateStats();
  showToast('Photo deleted', 'success');
}

// ── Client-side image prep ─────────────────────────────────────
// Downscaling in the browser keeps the upload small and, just as importantly,
// gives us the intrinsic dimensions to store — which is what lets the public
// page reserve space and stop shifting as photos load.
function prepareImage(file, maxWidth = 1800, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(
        blob => blob ? resolve({ blob, width: w, height: h, mimeType: 'image/jpeg' })
                     : reject(new Error('Could not process this image')),
        'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('That file is not a readable image')); };
    img.src = url;
  });
}

// Grab a poster frame so video tiles never load video bytes to draw a thumbnail.
function grabVideoPoster(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true; v.playsInline = true;
    v.onloadeddata = () => { try { v.currentTime = Math.min(1, (v.duration || 2) / 4); } catch { } };
    v.onseeked = () => {
      const canvas = document.createElement('canvas');
      canvas.width = v.videoWidth; canvas.height = v.videoHeight;
      canvas.getContext('2d').drawImage(v, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => resolve(b ? { blob: b, width: v.videoWidth, height: v.videoHeight } : null), 'image/jpeg', 0.8);
    };
    v.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    v.src = url;
  });
}

// PUT to the signed URL with real byte-level progress. XHR is used rather than
// fetch because fetch still cannot report upload progress.
function putToStorage(signedUrl, blob, contentType, cacheControl, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', signedUrl, true);
    xhr.setRequestHeader('Content-Type', contentType);
    // Without this the object is served no-cache and every visitor re-downloads
    // it — a direct upload does not inherit the bucket's default.
    if (cacheControl) xhr.setRequestHeader('Cache-Control', cacheControl);
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload  = () => (xhr.status >= 200 && xhr.status < 300)
      ? resolve()
      : reject(new Error(`Upload failed (${xhr.status})`));
    xhr.onerror = () => reject(new Error('Network error during upload'));
    xhr.send(blob);
  });
}

async function uploadOneFile(file, meta, onProgress) {
  const isVideo = file.type.startsWith('video/');
  onProgress(0.02, 'Preparing…');

  let blob, width, height, mimeType, thumbUrl = null;

  if (isVideo) {
    blob = file; mimeType = file.type; width = null; height = null;

    const poster = await grabVideoPoster(file);
    if (poster) {
      onProgress(0.05, 'Uploading poster…');
      const pUrl = await apiRequest('POST', '/api/admin/gallery/upload-url',
        { fileName: file.name.replace(/\.[^.]+$/, '') + '-poster', mimeType: 'image/jpeg', fileSize: poster.blob.size });
      if (!pUrl?._error) {
        await putToStorage(pUrl.data.signedUrl, poster.blob, 'image/jpeg', pUrl.data.cacheControl, () => {});
        thumbUrl = pUrl.data.publicUrl;
        width = poster.width; height = poster.height;
      }
    }
    if (!thumbUrl) throw new Error('Could not read a poster frame from this video. Try an MP4.');
  } else {
    const prepped = await prepareImage(file);
    blob = prepped.blob; width = prepped.width; height = prepped.height; mimeType = prepped.mimeType;
  }

  onProgress(0.1, 'Getting upload link…');
  const signed = await apiRequest('POST', '/api/admin/gallery/upload-url',
    { fileName: meta.title || file.name, mimeType, fileSize: blob.size });
  if (signed?._error) throw new Error(signed.message);

  await putToStorage(signed.data.signedUrl, blob, mimeType, signed.data.cacheControl,
    frac => onProgress(0.1 + frac * 0.8, 'Uploading…'));

  onProgress(0.95, 'Saving…');
  const row = await apiRequest('POST', '/api/admin/gallery', {
    title: meta.title, category: meta.category, type: isVideo ? 'video' : 'image',
    imageUrl: signed.data.publicUrl, storagePath: signed.data.path,
    mimeType, fileSize: blob.size, width, height, thumbUrl,
    altText: meta.altText || meta.title, caption: meta.caption || null,
    serviceSlug: meta.serviceSlug || null, eventDate: meta.eventDate || null,
    isFeatured: meta.isFeatured, isPublished: meta.isPublished,
  });

  if (row?._error) {
    const detail = row.fields ? Object.values(row.fields)[0] : row.message;
    throw new Error(detail || 'Could not save');
  }
  onProgress(1, 'Done');
  return row.data;
}

function addGalleryFiles(files) {
  const MAX = 50 * 1024 * 1024;
  for (const file of files) {
    if (file.size > MAX) {
      Swal.fire({ icon: 'error', title: 'File too large',
        text: `“${file.name}” is ${(file.size / 1048576).toFixed(1)} MB. The limit is 50 MB.`,
        background: '#1e1e2a', color: '#fff' });
      continue;
    }
    galleryUI.uploads.push({
      file,
      // A filename makes a poor caption, but it is a far better starting point
      // than an empty box the manager must fill in for every single photo.
      title: file.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').slice(0, 120),
      status: 'queued', progress: 0, note: '',
    });
  }
  renderGalleryFileList();
}

function renderGalleryFileList() {
  const el = document.getElementById('galleryFileList');
  if (!el) return;

  el.innerHTML = galleryUI.uploads.map((u, i) => `
    <div class="flex items-center gap-2 bg-gray-800/60 rounded-lg p-2">

      <input type="text" value="${escapeHtml(u.title)}" oninput="galleryUI.uploads[${i}].title = this.value"
        class="flex-1 min-w-0 bg-transparent border-b border-gray-700 focus:border-purple-500 focus:outline-none text-sm py-0.5"
        aria-label="Title for ${escapeHtml(u.file.name)}">
      <span class="text-xs text-gray-500 flex-none">${(u.file.size / 1048576).toFixed(1)} MB</span>
      <button type="button" onclick="removeGalleryFile(${i})" class="text-gray-500 hover:text-red-400 flex-none px-1" aria-label="Remove">
        <i class="fas fa-xmark"></i>
      </button>
    </div>`).join('');
}

function removeGalleryFile(i) { galleryUI.uploads.splice(i, 1); renderGalleryFileList(); }

async function saveGalleryItem() {
  if (!galleryUI.uploads.length) {
    Swal.fire({ icon: 'info', title: 'No files chosen', text: 'Pick at least one photo to upload.', background: '#1e1e2a', color: '#fff' });
    return;
  }
  const untitled = galleryUI.uploads.find(u => !u.title.trim());
  if (untitled) {
    Swal.fire({ icon: 'error', title: 'Missing title', text: `Give “${untitled.file.name}” a title.`, background: '#1e1e2a', color: '#fff' });
    return;
  }

  const meta = {
    category:    document.getElementById('galleryCategory').value,
    serviceSlug: document.getElementById('galleryServiceSlug').value || null,
    eventDate:   document.getElementById('galleryEventDate').value || null,
    isPublished: document.getElementById('galleryPublished').checked,
    isFeatured:  document.getElementById('galleryFeatured').checked,
  };

  const saveBtn = document.getElementById('saveModalBtn');
  const progressEl = document.getElementById('galleryUploadProgress');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Uploading…';
  progressEl.classList.remove('hidden');

  const paint = () => {
    progressEl.innerHTML = galleryUI.uploads.map(u => `
      <div>
        <div class="flex justify-between text-xs mb-1">
          <span class="truncate text-gray-300">${escapeHtml(u.title || u.file.name)}</span>
          <span class="${u.status === 'error' ? 'text-red-400' : u.status === 'done' ? 'text-green-400' : 'text-gray-500'} flex-none ml-2">
            ${u.status === 'error' ? escapeHtml(u.note) : u.status === 'done' ? '✓ Done' : `${Math.round(u.progress * 100)}%`}
          </span>
        </div>
        <div class="bg-gray-700 rounded-full h-1.5">
          <div class="${u.status === 'error' ? 'bg-red-500' : 'bg-purple-600'} h-1.5 rounded-full transition-all"
               style="width:${Math.round(u.progress * 100)}%"></div>
        </div>
      </div>`).join('');
  };
  paint();

  const created = [];
  // Sequential, not parallel: a manager on Kenyan mobile data uploading eight
  // photos at once gets slower total throughput and a progress bar that lies.
  for (const u of galleryUI.uploads) {
    try {
      u.status = 'uploading';
      const item = await uploadOneFile(u.file, { ...meta, title: u.title.trim() },
        (frac, note) => { u.progress = frac; u.note = note; paint(); });
      u.status = 'done'; u.progress = 1;
      created.push(item);
    } catch (err) {
      u.status = 'error';
      u.note = err.message || 'Failed';
    }
    paint();
  }

  saveBtn.disabled = false;
  saveBtn.textContent = 'Save';

  if (created.length) {
    store.gallery = [...created, ...store.gallery];
    updateStats();
  }

  const failed = galleryUI.uploads.filter(u => u.status === 'error');
  if (!failed.length) {
    closeModal();
    renderGallery();
    Swal.fire({
      icon: 'success',
      title: `${created.length} photo${created.length !== 1 ? 's' : ''} uploaded`,
      html: meta.isPublished
        ? `<p style="color:#9ca3af">Live on your website now.</p><a href="/gallery.html" target="_blank" style="color:#a78bfa;font-size:.85rem">→ View the gallery</a>`
        : `<p style="color:#9ca3af">Saved as drafts. Publish them when you are ready.</p>`,
      timer: 4000, showConfirmButton: false, background: '#1e1e2a', color: '#fff',
    });
  } else {
    // Keep only the failures in the list so a retry does not re-upload the ones
    // that already succeeded.
    galleryUI.uploads = failed;
    renderGalleryFileList();
    renderGallery();
    Swal.fire({
      icon: 'warning', title: `${failed.length} of ${failed.length + created.length} failed`,
      html: `<p style="color:#9ca3af">${escapeHtml(failed[0].note)}</p><p style="color:#6b7280;font-size:.8rem;margin-top:.5rem">The failed files are still listed — press Save to retry.</p>`,
      background: '#1e1e2a', color: '#fff',
    });
  }
}

async function saveGalleryEdit() {
  const title = document.getElementById('galleryEditTitle')?.value?.trim();
  if (!title) { Swal.fire({ icon: 'error', title: 'Title is required', background: '#1e1e2a', color: '#fff' }); return; }

  const item = store.gallery.find(i => i.id === currentEditId);
  if (!item) return;

  const saveBtn = document.getElementById('saveModalBtn');
  saveBtn.disabled = true;

  const payload = {
    title,
    altText:     document.getElementById('galleryEditAlt').value.trim() || title,
    category:    document.getElementById('galleryEditCategory').value,
    serviceSlug: document.getElementById('galleryEditServiceSlug').value || null,
    eventDate:   document.getElementById('galleryEditEventDate').value || null,
    caption:     document.getElementById('galleryEditCaption').value.trim() || null,
    isPublished: document.getElementById('galleryEditPublished').checked,
    isFeatured:  document.getElementById('galleryEditFeatured').checked,
    type:        item.type,
    displayOrder: item.displayOrder,
  };

  try {
    // Replacement image goes to Storage first. If that fails we abort before
    // touching the row, so the item is never left pointing at nothing.
    if (galleryUI.replacement) {
      saveBtn.textContent = 'Uploading…';
      const r = galleryUI.replacement;
      const signed = await apiRequest('POST', '/api/admin/gallery/upload-url',
        { fileName: title, mimeType: r.mimeType, fileSize: r.blob.size });
      if (signed?._error) throw new Error(signed.message);

      await putToStorage(signed.data.signedUrl, r.blob, r.mimeType, signed.data.cacheControl, () => {});
      Object.assign(payload, {
        imageUrl: signed.data.publicUrl, storagePath: signed.data.path,
        mimeType: r.mimeType, fileSize: r.blob.size, width: r.width, height: r.height,
      });
    }

    saveBtn.textContent = 'Saving…';
    const res = await apiRequest('PUT', `/api/admin/gallery/${currentEditId}`, payload);
    if (res?._error) {
      const detail = res.fields ? Object.values(res.fields)[0] : res.message;
      throw new Error(detail || 'Could not save');
    }

    store.gallery = store.gallery.map(i => i.id === currentEditId ? res.data : i);
    galleryUI.replacement = null;
    closeModal();
    renderGallery();
    updateStats();
    showToast('Photo updated', 'success');
  } catch (err) {
    Swal.fire({ icon: 'error', title: 'Save failed', text: err.message, background: '#1e1e2a', color: '#fff' });
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
}

    function setReviewFilter(f) { reviewUI.filter = f; reviewUI.selected.clear(); renderReviews(); }
    function toggleReviewSelect(id) {
      reviewUI.selected.has(id) ? reviewUI.selected.delete(id) : reviewUI.selected.add(id);
      renderReviews();
    }
    function clearReviewSelection() { reviewUI.selected.clear(); renderReviews(); }

    async function setReviewStatus(id, status, rejectionReason = null) {
      const res = await apiRequest('PATCH', `/api/admin/reviews/${id}/status`, { status, rejectionReason });
      if (res?._error) {
        // 409 here is the consent guard doing its job — surface the reason
        // rather than a generic failure, because it is a decision, not a fault.
        Swal.fire({ icon: 'warning', title: 'Cannot do that', text: res.message, background: '#1e1e2a', color: '#fff' });
        return;
      }
      store.reviews = store.reviews.map(r => r.id === id ? res.data : r);
      renderReviews();
      updateStats();
      showToast(status === 'published' ? 'Review is now live' : `Review moved to ${status}`, 'success');
    }

    async function rejectReview(id) {
      const { value: reason, isConfirmed } = await Swal.fire({
        title: 'Reject this review?',
        input: 'text',
        inputLabel: 'Reason (kept internal — the client is not told)',
        inputPlaceholder: 'e.g. duplicate, spam, not about our service',
        showCancelButton: true, confirmButtonText: 'Reject', confirmButtonColor: '#ef4444',
        background: '#1e1e2a', color: '#fff',
      });
      if (!isConfirmed) return;
      await setReviewStatus(id, 'rejected', reason || null);
    }

    async function toggleReviewFeatured(id) {
      const res = await apiRequest('PATCH', `/api/admin/reviews/${id}/feature`);
      if (res?._error) { Swal.fire({ icon: 'warning', title: 'Cannot feature', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }
      store.reviews = store.reviews.map(r => r.id === id ? res.data : r);
      renderReviews();
    }

    async function replyToReview(id) {
      const current = store.reviews.find(r => r.id === id)?.adminReply || '';
      const { value: reply, isConfirmed } = await Swal.fire({
        title: 'Reply publicly',
        input: 'textarea',
        inputValue: current,
        inputLabel: 'This appears under the review on your website',
        inputAttributes: { maxlength: 1000 },
        showCancelButton: true, confirmButtonText: 'Save reply', confirmButtonColor: '#7c3aed',
        background: '#1e1e2a', color: '#fff',
      });
      if (!isConfirmed) return;

      const res = await apiRequest('PATCH', `/api/admin/reviews/${id}/reply`, { reply: reply?.trim() || null });
      if (res?._error) { Swal.fire({ icon: 'error', title: 'Could not save', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }
      store.reviews = store.reviews.map(r => r.id === id ? res.data : r);
      renderReviews();
      showToast('Reply saved', 'success');
    }

    async function approveReview(id) { return setReviewStatus(id, 'published'); }

    async function deleteReview(id) {
      const r = store.reviews.find(x => x.id === id);
      const result = await Swal.fire({
        title: 'Delete permanently?',
        html: `<p style="color:#9ca3af">This erases the review and its consent record. If you only want it off the website, use <strong>Unpublish</strong> or <strong>Reject</strong> instead — those keep the audit trail.</p>`,
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
        confirmButtonText: 'Delete for good', background: '#1e1e2a', color: '#fff',
      });
      if (!result.isConfirmed) return;

      const res = await apiRequest('DELETE', `/api/admin/reviews/${id}`);
      if (res?._error) { Swal.fire({ icon: 'error', title: 'Delete failed', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }
      store.reviews = store.reviews.filter(x => x.id !== id);
      reviewUI.selected.delete(id);
      renderReviews();
      updateStats();
      showToast('Review deleted', 'success');
    }

    async function bulkReviews(action) {
      const ids = [...reviewUI.selected];
      if (!ids.length) return;

      if (action === 'delete') {
        const ok = await Swal.fire({
          title: `Delete ${ids.length} review${ids.length !== 1 ? 's' : ''}?`,
          text: 'This erases them and their consent records permanently.',
          icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
          confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff',
        });
        if (!ok.isConfirmed) return;
      }

      const res = await apiRequest('POST', '/api/admin/reviews/bulk', { action, ids });
      if (res?._error) { Swal.fire({ icon: 'warning', title: 'Could not apply', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }

      if (action === 'delete') {
        store.reviews = store.reviews.filter(r => !ids.includes(r.id));
      } else {
        const byId = Object.fromEntries((res.data?.items || []).map(r => [r.id, r]));
        store.reviews = store.reviews.map(r => byId[r.id] || r);
      }
      reviewUI.selected.clear();
      renderReviews();
      updateStats();

      // Rows skipped for missing consent are reported, not silently dropped —
      // otherwise "publish 5" quietly publishing 3 looks like it worked.
      const skipped = res.data?.skipped || 0;
      showToast(skipped
        ? `${res.data.affected} updated · ${skipped} skipped (no consent)`
        : `${ids.length} review${ids.length !== 1 ? 's' : ''} updated`, 'success');
    }

// ==================== MARKETING ====================
//
// One tab, three things that were previously two tabs and a blind spot.
//
// The section exists so a marketer can decide what to promote and when to
// discount. It could not support either decision before: views/clicks/ctr were
// never incremented by anything, so every campaign read as zero engagement, and
// there was no discount model at all — a banner could say "10% off" as text
// while nothing recorded that an offer existed or who used it.
//
// Layout follows the order the work actually happens in:
//   1. What is live right now        (so nothing runs unnoticed or expired)
//   2. What the numbers suggest      (guidance, from real trading data)
//   3. Offers / Banners / Posters    (the things you create and edit)
//
// Posters used to be a separate top-level tab. Same job — put a message in
// front of a visitor — so keeping them apart made "what is running?" a
// two-screen question.

const marketingUI = {
  view: 'overview',        // overview | offers | banners | posters
  bannerFilter: 'live',    // live | all | expired
  guidance: null,
  guidanceError: null,
};

const OFFER_MAX_PERCENT_HINT = 50;

function mktToday() { return new Date().toISOString().split('T')[0]; }

function isLiveBanner(b) {
  const t = mktToday();
  return b.isActive === true && (!b.startDate || b.startDate <= t) && (!b.endDate || b.endDate >= t);
}
function isLivePoster(p) {
  const t = mktToday();
  return p.isActive !== false && (!p.startDate || p.startDate <= t) && (!p.endDate || p.endDate >= t);
}
function isLiveOffer(o) {
  const t = mktToday();
  if (!o.isActive) return false;
  if (o.startsOn > t) return false;
  if (o.endsOn && o.endsOn < t) return false;
  if (o.maxRedemptions !== null && o.timesRedeemed >= o.maxRedemptions) return false;
  return true;
}

function offerStatus(o) {
  const t = mktToday();
  if (!o.isActive)                                              return { label: 'Paused',          cls: 'bg-gray-700/50 text-gray-400' };
  if (o.startsOn > t)                                           return { label: 'Scheduled',       cls: 'bg-blue-600/20 text-blue-400' };
  if (o.endsOn && o.endsOn < t)                                  return { label: 'Ended',           cls: 'bg-gray-700/50 text-gray-500' };
  if (o.maxRedemptions !== null && o.timesRedeemed >= o.maxRedemptions)
                                                                 return { label: 'Fully claimed',   cls: 'bg-yellow-600/20 text-yellow-400' };
  return { label: 'Live', cls: 'bg-green-600/20 text-green-400' };
}

function discountText(o) {
  return o.discountType === 'percent'
    ? `${o.discountValue}% off`
    : `KES ${Number(o.discountValue).toLocaleString('en-KE')} off`;
}

// ── Data ───────────────────────────────────────────────────────
async function loadOffers() {
  const res = await apiRequest('GET', '/api/admin/offers');
  store.offers = res?._error ? (store.offers || []) : (res.data || []);
  return res;
}

async function loadGuidance() {
  const res = await apiRequest('GET', '/api/admin/marketing/guidance');
  if (res?._error) {
    marketingUI.guidance = null;
    // 403 is the manager role hitting an admin-only endpoint, which is a
    // different message from a genuine failure.
    marketingUI.guidanceError = res.status === 403 ? 'admin-only' : (res.message || 'unavailable');
    return;
  }
  marketingUI.guidance = res.data;
  marketingUI.guidanceError = null;
}

// ── Render ─────────────────────────────────────────────────────
async function renderMarketing() {
  const container = document.getElementById('sectionContent');
  if (!container) return;

  if (!store.offers) {
    container.innerHTML = `<div class="flex justify-center py-16"><div class="spinner"></div></div>`;
    await Promise.all([loadOffers(), loadGuidance()]);
  }

  const offers  = store.offers || [];
  const banners = store.marketingBanners || [];
  const posters = store.posters || [];

  const liveOffers  = offers.filter(isLiveOffer);
  const liveBanners = banners.filter(isLiveBanner);
  const livePosters = posters.filter(isLivePoster);

  const tab = (key, label, count) => `
    <button type="button" onclick="setMarketingView('${key}')"
      class="px-3.5 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition border ${
        marketingUI.view === key
          ? 'bg-purple-600 border-purple-500 text-white'
          : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white hover:bg-gray-700'}">
      ${label}${count !== null ? ` <span class="opacity-60">${count}</span>` : ''}
    </button>`;

  const header = `
    <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
      <div>
        <h2 class="text-xl font-bold text-white">Marketing</h2>
        <p class="text-sm text-gray-500 mt-0.5">
          ${liveOffers.length + liveBanners.length + livePosters.length === 0
            ? 'Nothing is currently promoted on your website.'
            : `${liveBanners.length} banner${liveBanners.length === 1 ? '' : 's'}, ${livePosters.length} poster${livePosters.length === 1 ? '' : 's'} and ${liveOffers.length} offer${liveOffers.length === 1 ? '' : 's'} live right now.`}
        </p>
      </div>
      <a href="/index.html" target="_blank" rel="noopener"
        class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 hover:bg-gray-700 text-gray-300 transition flex items-center gap-2">
        <i class="fas fa-external-link-alt text-xs"></i> See the live homepage
      </a>
    </div>

    <div class="flex gap-1.5 flex-wrap mb-5">
      ${tab('overview', '📊 Overview', null)}
      ${tab('offers',   '🎟️ Offers',   offers.length)}
      ${tab('banners',  '📢 Banners',  banners.length)}
      ${tab('posters',  '🖼️ Posters',  posters.length)}
    </div>`;

  let body = '';
  if (marketingUI.view === 'overview')      body = marketingOverview(liveOffers, liveBanners, livePosters);
  else if (marketingUI.view === 'offers')   body = marketingOffers(offers);
  else if (marketingUI.view === 'banners')  body = marketingBanners(banners);
  else if (marketingUI.view === 'posters')  body = marketingPosters(posters);

  container.innerHTML = header + body;
}

// ── Overview: what is live, and what to do about it ────────────

  const g = marketingUI.guidance;

  const liveCard = (icon, kind, items, describe, goTo) => `

      ${items.length
        ? `<ul class="space-y-1.5">${items.slice(0, 3).map(i =>
            `<li class="text-sm text-gray-300 truncate">${icon} ${escapeHtml(describe(i))}</li>`).join('')}

      <button type="button" onclick="setMarketingView('${goTo}')" class="text-xs text-purple-400 hover:underline mt-3">Manage →</button>
    </div>`;

  if (marketingUI.guidanceError === 'admin-only') {
    guidancePanel = `
      <div class="bg-gray-900 rounded-2xl border border-gray-800 p-5 mb-5">
        <i class="fas fa-lock text-gray-600 mr-2"></i>
        <span class="text-sm text-gray-500">Discount guidance is visible to the business owner only — it is based on revenue and outstanding balances.</span>
      </div>`;
  } else if (!g) {
    guidancePanel = `
      <div class="bg-gray-900 rounded-2xl border border-red-900/40 p-5 mb-5">
        <p class="text-sm text-gray-400"><i class="fas fa-triangle-exclamation text-red-400 mr-2"></i>
          Could not load guidance${marketingUI.guidanceError ? `: ${escapeHtml(marketingUI.guidanceError)}` : ''}.

      </div>`;
  } else {
    const TONE = {
      opportunity: { border: 'border-green-600/40',  bg: 'bg-green-900/10',  icon: 'fa-lightbulb',            color: 'text-green-400'  },
      warning:     { border: 'border-red-600/40',    bg: 'bg-red-900/10',    icon: 'fa-triangle-exclamation', color: 'text-red-400'    },
      caution:     { border: 'border-yellow-600/40', bg: 'bg-yellow-900/10', icon: 'fa-hand',                 color: 'text-yellow-400' },
      neutral:     { border: 'border-gray-700',      bg: 'bg-gray-800/40',   icon: 'fa-circle-info',          color: 'text-blue-400'   },
    };
    const CONF = { high: 'Strong signal', medium: 'Reasonable signal', low: 'Weak signal — treat as a hint' };

    guidancePanel = `
      <div class="mb-5">
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="font-semibold text-white">What the numbers suggest</h3>
            <p class="text-xs text-gray-500 mt-0.5">Worked out from your enquiries, bookings, payments and reviews — not generic advice.</p>
          </div>
          <button type="button" onclick="reloadMarketingGuidance()" class="text-xs text-gray-500 hover:text-gray-300 transition">
            <i class="fas fa-rotate-right mr-1"></i>Refresh
          </button>
        </div>

        ${g.recommendations.length === 0
          ? `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center">
               <i class="fas fa-circle-check text-2xl text-green-400 mb-2"></i>
               <p class="text-sm text-gray-400">Nothing to flag. Your promotions and pricing look reasonable for the current data.</p>
             </div>`
          : `<div class="space-y-3">${g.recommendations.map(r => {
              const t = TONE[r.tone] || TONE.neutral;
              return `
                <div class="rounded-2xl border ${t.border} ${t.bg} p-4">
                  <div class="flex items-start gap-3">
                    <i class="fas ${t.icon} ${t.color} mt-0.5 flex-shrink-0"></i>
                    <div class="min-w-0 flex-1">
                      <p class="font-semibold text-white">${escapeHtml(r.title)}</p>
                      <p class="text-xs text-gray-500 mt-1"><strong class="text-gray-400">What we see:</strong> ${escapeHtml(r.signal)}</p>
                      <p class="text-sm text-gray-300 mt-2"><strong class="${t.color}">Do this:</strong> ${escapeHtml(r.action)}</p>
                      <p class="text-xs text-gray-500 mt-1.5">${escapeHtml(r.why)}</p>
                      <div class="flex items-center gap-2 mt-2.5">
                        <span class="text-xs px-2 py-0.5 rounded-full bg-gray-800 text-gray-400">${CONF[r.confidence] || r.confidence}</span>
                        ${r.id === 'quiet-weeks-ahead'
                          ? `<button type="button" onclick="createOfferForQuietWeeks()" class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-green-600 hover:bg-green-500 transition">Create a dated offer</button>`
                          : ''}
                        ${r.id === 'nothing-running'
                          ? `<button type="button" onclick="setMarketingView('banners'); openMarketingForm()" class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-purple-600 hover:bg-purple-500 transition">Write a banner</button>`
                          : ''}
                        ${r.id === 'stale-offers'
                          ? `<button type="button" onclick="setMarketingView('offers')" class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-gray-700 hover:bg-gray-600 transition">Review offers</button>`

               <p class="text-sm text-gray-300"><i class="fas fa-arrow-trend-down text-yellow-400 mr-2"></i>
                 No enquiries in 90 days for:
                 <strong>${g.slowServices.map(s => escapeHtml(s.name)).join(', ')}</strong></p>

  return `

      ${liveCard('📢', 'Banners', liveBanners, b => b.message, 'banners')}
      ${liveCard('🖼️', 'Posters', livePosters, p => p.title, 'posters')}
    </div>
    ${guidancePanel}`;
}

// ── Offers ─────────────────────────────────────────────────────
function marketingOffers(offers) {
  const head = `
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <p class="text-sm text-gray-500">
        A code a client types when booking. Every use is recorded, so you can see what a campaign actually brought in.
      </p>
      <button type="button" onclick="openOfferForm()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="fas fa-plus"></i> New offer
      </button>
    </div>`;

  if (!offers.length) {
    return head + `
      <div class="bg-gray-900 border-2 border-dashed border-gray-700 rounded-2xl p-14 text-center">
        <div class="w-16 h-16 bg-purple-600/10 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fas fa-ticket text-2xl text-purple-400"></i>
        </div>
        <h3 class="font-bold text-white mb-2">No offers yet</h3>
        <p class="text-sm text-gray-500 max-w-md mx-auto mb-6">
          Start with something small and dated — 10% off for a specific quiet week. A capped, time-limited offer
          tells you whether price is the obstacle without permanently lowering what you charge.
        </p>
        <button type="button" onclick="openOfferForm()" class="px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-sm font-medium transition">
          Create your first offer
        </button>
      </div>`;
  }

  return head + `<div class="space-y-3">${offers.map(o => {
    const st = offerStatus(o);
    const capPct = o.maxRedemptions ? Math.min(100, Math.round(o.timesRedeemed / o.maxRedemptions * 100)) : null;
    return `
      <div class="bg-gray-900 rounded-2xl border ${isLiveOffer(o) ? 'border-green-700/30' : 'border-gray-800'} p-4">
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap mb-1.5">
              <code class="px-2 py-0.5 rounded bg-gray-800 text-yellow-400 font-bold tracking-wider">${escapeHtml(o.code.trim())}</code>
              <span class="text-sm font-semibold text-white">${discountText(o)}</span>
              <span class="text-xs px-2 py-0.5 rounded-full ${st.cls}">${st.label}</span>
            </div>
            <p class="text-sm text-gray-300">${escapeHtml(o.label)}</p>
            <p class="text-xs text-gray-500 mt-1">
              ${o.startsOn}${o.endsOn ? ` → ${o.endsOn}` : ' → no end date'}
              ${o.minAmount ? ` · from KES ${Number(o.minAmount).toLocaleString('en-KE')}` : ''}
              ${o.appliesTo?.length ? ` · ${o.appliesTo.length} service${o.appliesTo.length === 1 ? '' : 's'} only` : ''}
            </p>

            <div class="mt-2.5 flex items-center gap-3">
              <span class="text-xs text-gray-400">
                <strong class="${o.timesRedeemed ? 'text-green-400' : 'text-gray-500'}">${o.timesRedeemed}</strong>
                used${o.maxRedemptions ? ` of ${o.maxRedemptions}` : ''}
              </span>
              ${capPct !== null ? `
                <div class="h-1.5 w-28 bg-gray-800 rounded-full overflow-hidden">
                  <div class="h-1.5 rounded-full ${capPct >= 100 ? 'bg-yellow-500' : 'bg-green-500'}" style="width:${capPct}%"></div>
                </div>` : ''}
              ${o.timesRedeemed > 0
                ? `<button type="button" onclick="viewOfferRedemptions('${o.id}')" class="text-xs text-purple-400 hover:underline">Who used it →</button>`
                : ''}
            </div>
          </div>

          <div class="flex gap-1.5 flex-wrap flex-shrink-0">
            <button type="button" onclick="toggleOffer('${o.id}')" class="px-3 py-1.5 rounded-lg text-xs transition ${o.isActive ? 'bg-yellow-600/20 text-yellow-400 hover:bg-yellow-600/30' : 'bg-green-600/20 text-green-400 hover:bg-green-600/30'}">
              ${o.isActive ? 'Pause' : 'Resume'}
            </button>
            <button type="button" onclick="openOfferForm('${o.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 transition">
              <i class="fas fa-pen mr-1"></i>Edit
            </button>
            <button type="button" onclick="deleteOffer('${o.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-red-600/10 hover:bg-red-600/25 text-red-400 transition">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>`;
  }).join('')}</div>`;
}

// ── Banners ────────────────────────────────────────────────────
function marketingBanners(banners) {
  const t = mktToday();
  let shown = banners;
  if (marketingUI.bannerFilter === 'live')    shown = banners.filter(isLiveBanner);
  if (marketingUI.bannerFilter === 'expired') shown = banners.filter(b => b.endDate && b.endDate < t);

  const chip = (k, l, n) => `
    <button type="button" onclick="setBannerFilter('${k}')"
      class="px-3 py-1.5 rounded-full text-xs font-medium transition border ${
        marketingUI.bannerFilter === k
          ? 'bg-purple-600 border-purple-500 text-white'
          : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white'}">${l} <span class="opacity-60">${n}</span></button>`;

  const head = `
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex gap-1.5 flex-wrap">
        ${chip('live', '🟢 Live', banners.filter(isLiveBanner).length)}
        ${chip('all', 'All', banners.length)}
        ${chip('expired', '⏰ Expired', banners.filter(b => b.endDate && b.endDate < t).length)}
      </div>
      <button type="button" onclick="openMarketingForm()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="fas fa-plus"></i> New banner
      </button>
    </div>
    <p class="text-xs text-gray-500 mb-4">
      <i class="fas fa-circle-info mr-1"></i>
      The banner is the strip across the top of your homepage. Only the highest-priority live one is shown, so a visitor never sees two at once.
    </p>`;

  if (!shown.length) {
    return head + `
      <div class="bg-gray-900 border border-gray-800 rounded-2xl p-12 text-center">
        <i class="fas fa-bullhorn text-3xl text-gray-600 mb-3"></i>
        <p class="text-gray-400 text-sm mb-4">${banners.length ? 'No banners in this view.' : 'No banners yet.'}</p>
        <button type="button" onclick="openMarketingForm()" class="text-purple-400 hover:underline text-sm">Create one →</button>
      </div>`;
  }

  return head + `<div class="space-y-3">${shown.map(b => {
    const live = isLiveBanner(b);
    const expired = b.endDate && b.endDate < t;
    // Now that views are actually counted, CTR is real. It used to be hidden
    // behind `views > 0`, which never happened, so the marketer saw nothing.
    const hasData = (b.views || 0) > 0;
    return `
      <div class="bg-gray-900 rounded-2xl border ${live ? 'border-green-700/30' : 'border-gray-800'} p-4">
        <div class="flex flex-wrap justify-between items-start gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex gap-2 mb-2 flex-wrap items-center">
              <span class="px-2 py-0.5 rounded-full text-xs ${live ? 'bg-green-600/20 text-green-400' : 'bg-gray-700/50 text-gray-400'}">
                ${live ? '🟢 Live now' : b.isActive ? '⏸ Not showing' : '⚫ Paused'}
              </span>
              ${expired ? '<span class="px-2 py-0.5 rounded-full text-xs bg-gray-700/50 text-gray-500">⏰ Expired</span>' : ''}
              ${b.priority ? `<span class="text-xs text-gray-600">priority ${b.priority}</span>` : ''}
            </div>

            <!-- Shown as it appears on the site, so the marketer judges the real
                 thing rather than a field value in a list. -->
            <div class="rounded-lg px-3 py-2 mb-2" style="background:linear-gradient(90deg,#facc15,#f59e0b)">
              <p class="text-sm font-bold text-black truncate">${escapeHtml(b.message)}</p>
            </div>

            <p class="text-xs text-gray-500">
              <i class="fas fa-hand-pointer mr-1"></i>${escapeHtml(b.ctaText || 'Learn more')} → ${escapeHtml(b.ctaLink || '/book')}
              · <i class="far fa-calendar-alt ml-1 mr-1"></i>${b.startDate || 'now'} → ${b.endDate || 'no end'}
            </p>

            <div class="mt-2 text-xs ${hasData ? 'text-gray-400' : 'text-gray-600'}">
              <i class="fas fa-chart-line mr-1"></i>
              ${hasData
                ? `${b.views.toLocaleString()} views · ${b.clicks.toLocaleString()} clicks · <strong class="${b.ctr >= 2 ? 'text-green-400' : b.ctr >= 1 ? 'text-yellow-400' : 'text-red-400'}">${b.ctr}% clicked</strong>`
                : 'No views recorded yet — figures appear once visitors see it.'}
            </div>
          </div>

          <div class="flex gap-1.5 flex-wrap flex-shrink-0">
            <button type="button" onclick="toggleMarketingBanner('${b.id}')" class="px-3 py-1.5 rounded-lg text-xs transition ${b.isActive ? 'bg-yellow-600/20 text-yellow-400 hover:bg-yellow-600/30' : 'bg-green-600/20 text-green-400 hover:bg-green-600/30'}">
              ${b.isActive ? 'Pause' : 'Activate'}
            </button>
            <button type="button" onclick="openMarketingForm('${b.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 transition"><i class="fas fa-pen mr-1"></i>Edit</button>
            <button type="button" onclick="duplicateMarketingBanner('${b.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 transition"><i class="fas fa-copy"></i></button>
            <button type="button" onclick="deleteMarketingBanner('${b.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-red-600/10 hover:bg-red-600/25 text-red-400 transition"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>`;
  }).join('')}</div>`;
}

      <div class="bg-gray-900 border-2 border-dashed border-gray-700 rounded-2xl p-14 text-center">

          <i class="fas fa-image text-2xl text-purple-400"></i>

        <h3 class="font-bold text-white mb-2">No posters yet</h3>

  return head + `

              </span>
            </div>
            <div class="p-3 flex-1 flex flex-col">
              <p class="font-semibold text-sm text-white truncate">${escapeHtml(p.title || 'Untitled')}</p>

              <p class="text-xs text-gray-600 mt-1">${p.startDate || 'now'} → ${p.endDate || 'no end'} · order ${p.displayOrder ?? 0}</p>

                <button type="button" onclick="togglePoster('${p.id}')" class="flex-1 py-1.5 rounded-lg text-xs transition ${p.isActive !== false ? 'bg-yellow-600/20 text-yellow-400 hover:bg-yellow-600/30' : 'bg-green-600/20 text-green-400 hover:bg-green-600/30'}">
                  ${p.isActive !== false ? 'Pause' : 'Activate'}
                </button>
                <button type="button" onclick="openPosterForm('${p.id}')" class="flex-1 py-1.5 rounded-lg text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 transition">Edit</button>
                <button type="button" onclick="deletePoster('${p.id}')" class="flex-none px-2.5 py-1.5 rounded-lg text-xs bg-red-600/10 hover:bg-red-600/25 text-red-400 transition"><i class="fas fa-trash"></i></button>
              </div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

async function toggleOffer(id) {
  const res = await apiRequest('PATCH', `/api/admin/offers/${id}/toggle`);
  if (res?._error) { Swal.fire({ icon: 'error', title: 'Could not change', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }
  store.offers = store.offers.map(o => o.id === id ? res.data : o);

async function deleteOffer(id) {
  const o = (store.offers || []).find(x => x.id === id);
  const used = o?.timesRedeemed || 0;

  const first = await Swal.fire({
    title: used ? 'This offer has been used' : 'Delete this offer?',
    html: used
      ? `<p style="color:#9ca3af">${used} booking${used === 1 ? '' : 's'} used <strong style="color:#fff">${escapeHtml(o.code.trim())}</strong>. Deleting erases the record of which bookings came from this campaign.</p>
         <p style="color:#9ca3af;font-size:.85rem;margin-top:.5rem">Pausing keeps the history and stops new uses.</p>`
      : `<p style="color:#9ca3af">Nobody has used this code, so nothing is lost.</p>`,
    icon: 'warning', showCancelButton: true,
    confirmButtonText: used ? 'Delete anyway' : 'Delete',
    denyButtonText: 'Pause instead', showDenyButton: !!used,
    confirmButtonColor: '#ef4444', background: '#1e1e2a', color: '#fff',
  });

  if (first.isDenied) { await toggleOffer(id); return; }
  if (!first.isConfirmed) return;

  const res = await apiRequest('DELETE', `/api/admin/offers/${id}${used ? '?force=true' : ''}`);
  if (res?._error) { Swal.fire({ icon: 'error', title: 'Could not delete', text: res.message, background: '#1e1e2a', color: '#fff' }); return; }
  store.offers = store.offers.filter(o2 => o2.id !== id);
  renderMarketing();
  showToast('Offer deleted', 'success');
}

// Pre-fills a dated offer for the specific empty weeks the guidance found.
// The whole value of naming those dates is lost if the marketer then has to
// re-enter them by hand.
function createOfferForQuietWeeks() {
  const weeks = (marketingUI.guidance?.recommendations || [])
    .find(r => r.id === 'quiet-weeks-ahead')?.weeks || [];
  if (!weeks.length) { openOfferForm(); return; }

  const first = weeks[0].weekStart;
  const last  = weeks[weeks.length - 1].weekStart;
  const end   = new Date(last); end.setDate(end.getDate() + 6);

  marketingUI.view = 'offers';
  renderMarketing();
  openOfferForm(null, {
    label: `Quiet weeks push (${first} to ${end.toISOString().split('T')[0]})`,
    description: 'Discount for selected dates',
    discountValue: 10,
    startsOn: mktToday(),
    endsOn: end.toISOString().split('T')[0],
    maxRedemptions: Math.max(2, weeks.length),
    notes: `Auto-suggested for weeks with nothing booked: ${weeks.map(w => w.weekStart).join(', ')}`,
  });
}

async function saveOffer() {
  document.querySelectorAll('#modalForm .field-err').forEach(e => { e.textContent = ''; e.classList.add('hidden'); });

  const payload = {
    code:           document.getElementById('offerCode').value.trim().toUpperCase(),
    label:          document.getElementById('offerLabel').value.trim(),
    description:    document.getElementById('offerDesc').value.trim() || null,
    discountType:   document.getElementById('offerType').value,
    discountValue:  Number(document.getElementById('offerValue').value),
    maxRedemptions: document.getElementById('offerCap').value === '' ? null : Number(document.getElementById('offerCap').value),
    minAmount:      document.getElementById('offerMin').value === '' ? null : Number(document.getElementById('offerMin').value),
    startsOn:       document.getElementById('offerStart').value || null,
    endsOn:         document.getElementById('offerEnd').value || null,
    notes:          document.getElementById('offerNotes').value.trim() || null,
    isActive:       document.getElementById('offerActive').checked,
    appliesTo:      [...document.querySelectorAll('.offerService:checked')].map(c => c.value),
  };

  const btn = document.getElementById('saveModalBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  const res = currentEditId
    ? await apiRequest('PUT', `/api/admin/offers/${currentEditId}`, payload)
    : await apiRequest('POST', '/api/admin/offers', payload);

  btn.disabled = false; btn.textContent = 'Save';

  if (res?._error) {
    if (res.fields) {
      Object.entries(res.fields).forEach(([f, m]) => {
        const el = document.querySelector(`#modalForm .field-err[data-for="${f}"]`);
        if (el) { el.textContent = m; el.classList.remove('hidden'); }
      });
      return;
    }
    Swal.fire({ icon: 'error', title: 'Could not save', text: res.message, background: '#1e1e2a', color: '#fff' });
    return;
  }

  store.offers = currentEditId
    ? (store.offers || []).map(o => o.id === currentEditId ? res.data : o)
    : [res.data, ...(store.offers || [])];

  closeModal();
  await loadGuidance();       // a new offer can clear the "nothing running" advice
  renderMarketing();
  showToast(currentEditId ? 'Offer updated' : 'Offer created', 'success');
}

    const result = isEdit
        ? await apiRequest('PUT', '/api/admin/banners/' + currentEditId, payload)
        : await apiRequest('POST', '/api/admin/banners', payload);
    if (!result?.data) {
        const detail = result?._error ? result.message + (result.status ? ' (HTTP ' + result.status + ')' : '') : 'Unexpected response';
