    function switchTab(tab) { currentTab = tab; document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('tab-active', 'border-purple-500', 'text-purple-400'); btn.classList.add('border-transparent'); }); const activeBtn = document.querySelector(`.tab-btn[data-tab="${tab}"]`); if (activeBtn) { activeBtn.classList.add('tab-active', 'border-purple-500', 'text-purple-400'); activeBtn.classList.remove('border-transparent'); } if (tab === 'dashboard') renderDashboard(); else if (tab === 'events') renderEvents(); else if (tab === 'services') renderServices(); else if (tab === 'gallery') renderGallery(); else if (tab === 'reviews') renderReviews(); else if (tab === 'marketing') renderMarketing(); else if (tab === 'posters') { marketingUI.view = 'posters'; currentTab = 'marketing'; renderMarketing(); } else if (tab === 'bookings') renderBookings(); else if (tab === 'employees') renderEmployees(); else if (tab === 'payroll') renderPayroll(); else if (tab === 'analytics') { destroyAnalyticsCharts(); renderAnalytics(); } else if (tab === 'training') renderTraining(); else if (tab === 'beta') renderBeta(); else if (tab === 'updates') renderUpdates(); }
    function closeModal() { document.getElementById('formModal').classList.add('hidden'); currentEditId = null; }
    function logout() { localStorage.removeItem('lawie_admin_session'); sessionStorage.removeItem('lawie_admin_session'); window.location.href = 'login.html?logout=1'; }

    function applyRoleBasedUI() {
      const role = window._adminRole || sessionStorage.getItem('adminRole') || 'admin';

      // Name first, role second. On a shared screen this answers "whose session
      // is this?" — the question that matters before anyone clicks anything.
      const subtitle = document.getElementById('dashboardSubtitle');
      if (subtitle) {
        const who = escapeHtml(sessionStorage.getItem('adminName') || 'Administrator');
        const tone = role === 'manager' ? 'text-yellow-400' : role === 'developer' ? 'text-blue-400' : 'text-purple-400';
        const label = role === 'manager' ? 'Manager' : role === 'developer' ? 'Developer' : 'Owner';
        subtitle.innerHTML = `<span class="${tone} font-semibold">${who}</span> <span class="text-gray-600">·</span> ${label}`;
      }

      // Hide every tab the role has no access to, not just some of them —
      // offering a tab and then refusing it is worse than not offering it.
      //
      // Driven off the same rules the server enforces, rather than a single
      // `if (role === 'manager')`. When the developer role was added it
      // inherited the admin layout by omission, so Employees and Payroll were
      // offered to an account the API answers 403 for. Nothing errored: the
      // tables simply rendered "Total Employees 0" and "Total Paid KES 0",
      // which reads as a company with no staff rather than as no access.
      //
      // Analytics is in nobody's list. A manager marketing the company needs to
      // see enquiry volume, conversion and reply times to do the job; what they
      // must not see is the owner's financial position. That split is made by
      // the server, which sends those accounts the operational figures only, so
      // the tab can be open without disclosing revenue.
      const HIDDEN_TABS_BY_ROLE = {
        // adminOnly on the server: employees, payroll. workLogAccess: the log.
        manager:   ['tabEmployees', 'tabPayroll', 'tabUpdates'],
        // The developer keeps the work log — recording deliverables is the point
        // of that account — but staff records and payroll are the owner's alone.
        developer: ['tabEmployees', 'tabPayroll'],
      };
      (HIDDEN_TABS_BY_ROLE[role] || [])
        .forEach(id => document.getElementById(id)?.classList.add('hidden'));
    }

    async function init() {
      applyRoleBasedUI();
      updateGreetingDisplay();
      document.getElementById('sectionContent').innerHTML = '<div class="flex justify-center py-12"><div class="spinner"></div></div>';
      await loadAllDataFromAPI();
      updateStats();
      const urlTab = new URLSearchParams(window.location.search).get('tab');
      const validTabs = ['dashboard','events','services','gallery','reviews','marketing','posters','bookings','employees','payroll','analytics','training','beta','updates'];
      switchTab(validTabs.includes(urlTab) ? urlTab : 'dashboard');
      updateNotifBadge();
      updateBadge();
      startAutoRefresh();
      document.getElementById('notifBtn')?.addEventListener('click', () => switchTab('bookings'));

      document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));

      // Belt and braces. Every button in this file is now type="button", but a
      // future one added without it would submit this form and reload the page,
      // throwing away whatever the admin was editing. Nothing here is ever
      // meant to submit natively, so refuse it outright.
      document.getElementById('modalForm')?.addEventListener('submit', e => e.preventDefault());

      const closeBtn = document.getElementById('closeModalBtn');
      const cancelBtn = document.getElementById('cancelModalBtn');
      const saveBtn = document.getElementById('saveModalBtn');

      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      if (cancelBtn) cancelBtn.addEventListener('click', closeModal);
      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          if (document.getElementById('posterTitle')) savePoster();
          else if (document.getElementById('eventTitle')) saveEvent();
          else if (document.getElementById('galleryFiles')) saveGalleryItem();
          else if (document.getElementById('galleryEditTitle')) saveGalleryEdit();
          else if (document.getElementById('wlTitle')) saveWorkItem();
          else if (document.getElementById('offerCode')) saveOffer();
          else if (document.getElementById('bannerMessage')) saveMarketingBanner();
          else if (document.getElementById('empName')) saveEmployee();
          else if (document.getElementById('payrollEmployee')) savePayroll();
          else if (document.getElementById('packageName')) savePackage();
          else if (document.getElementById('featureTitle')) saveFeature();
          else if (document.getElementById('faqQuestion')) saveFaq();
          else if (document.getElementById('serviceName')) saveService();
        });
      }

      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) logoutBtn.addEventListener('click', logout);
    }
    init();

ured = toggleGalleryFeatured; window.toggleGalleryPublish = toggleGalleryPublish; window.deleteGalleryItem = deleteGalleryItem; window.setGalleryFilter = setGalleryFilter; window.onGallerySearch = onGallerySearch; window.toggleGallerySelect = toggleGallerySelect; window.clearGallerySelection = clearGallerySelection; window.bulkGallery = bulkGallery; window.removeGalleryFile = removeGalleryFile; window.galleryUI = galleryUI; window.approveReview = approveReview; window.deleteReview = deleteReview; window.setReviewFilter = setReviewFilter; window.toggleReviewSelect = toggleReviewSelect; window.clearReviewSelection = clearReviewSelection; window.setReviewStatus = setReviewStatus; window.rejectReview = rejectReview; window.toggleReviewFeatured = toggleReviewFeatured; window.replyToReview = replyToReview; window.bulkReviews = bulkReviews; window.renderReviews = renderReviews; window.openMarketingForm = openMarketingForm; window.toggleMarketingBanner = toggleMarketingBanner; window.duplicateMarketingBanner = duplicateMarketingBanner; window.deleteMarketingBanner = deleteMarketingBanner; window.setMarketingView = setMarketingView; window.setBannerFilter = setBannerFilter; window.renderMarketing = renderMarketing; window.reloadMarketingGuidance = reloadMarketingGuidance; window.openOfferForm = openOfferForm; window.saveOffer = saveOffer; window.toggleOffer = toggleOffer; window.deleteOffer = deleteOffer; window.viewOfferRedemptions = viewOfferRedemptions; window.createOfferForQuietWeeks = createOfferForQuietWeeks; window.marketingUI = marketingUI; window.updateBookingStatus = updateBookingStatus; window.viewBookingDetails = viewBookingDetails; window.deleteBooking = deleteBooking; window.setBookingView = setBookingView; window.openEmployeeForm = openEmployeeForm; window.editEmployee = editEmployee; window.deleteEmployee = deleteEmployee; window.openPayrollForm = openPayrollForm; window.editPayroll = editPayroll; window.deletePayroll = deletePayroll; window.openPosterForm =   </script>
