    /* ── Welcome hero ────────────────────────────────────────────────────────
       The first thing either of them sees each day. It has to feel like their
       own desk rather than a piece of software, so it is built around their
       name, the real date, and what has actually changed since they were last
       here — never a motivational line with no fact behind it.

       The aurora is two slow-drifting radial gradients under a blur. It reads
       as depth and warmth without costing a single image request, and it stops
       entirely for anyone who has asked for reduced motion. */
    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 1.5rem;
      background: linear-gradient(140deg, #14141f 0%, #191926 55%, #1b1b2b 100%);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .hero::before,
    .hero::after {
      content: '';
      position: absolute;
      width: 460px; height: 460px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      pointer-events: none;
    }
    .hero::before {
      background: radial-gradient(circle, rgba(124,77,255,0.55), transparent 68%);
      top: -230px; left: -110px;
      animation: heroDriftA 22s ease-in-out infinite alternate;
    }
    .hero::after {
      background: radial-gradient(circle, rgba(250,204,21,0.30), transparent 68%);
      bottom: -260px; right: -120px;
      animation: heroDriftB 27s ease-in-out infinite alternate;
    }
    @keyframes heroDriftA { to { transform: translate3d(70px, 45px, 0) scale(1.12); } }
    @keyframes heroDriftB { to { transform: translate3d(-60px, -40px, 0) scale(1.08); } }
    .hero-inner { position: relative; z-index: 1; }

    /* The name is the loudest thing on the screen, on purpose. */
    .hero-name {
      background: linear-gradient(95deg, #fff 15%, #c4b5fd 55%, #facc15 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Momentum chips. Glass over the aurora so the colour shows through. */
    .hero-chip {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.09);
      backdrop-filter: blur(8px);
      border-radius: 1rem;
      transition: transform .25s ease, border-color .25s ease, background .25s ease;
    }
    .hero-chip:hover {
      transform: translateY(-3px);
      border-color: rgba(167,139,250,0.45);
      background: rgba(255,255,255,0.07);
    }

    /* Entrance: each element arrives a beat after the one before, so the eye is
       led from the greeting to the numbers rather than meeting them at once. */
    .hero-rise { animation: heroRise .55s cubic-bezier(.21,.6,.35,1) both; }
    @keyframes heroRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .spark-line { stroke-dasharray: 300; stroke-dashoffset: 300; animation: sparkDraw 1.4s ease-out .35s forwards; }
    @keyframes sparkDraw { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .hero::before, .hero::after, .hero-rise, .spark-line { animation: none !important; }
      .spark-line { stroke-dashoffset: 0; }
      .hero-chip { transition: none; }
    }
    
    /* Modal draggable styles */
    .modal-header { cursor: move; user-select: none; }
    .modal-resize-handle { position: absolute; bottom: 0; right: 0; width: 16px; height: 16px; cursor: se-resize; background-color: #7c4dff; border-radius: 4px 0 0 0; }
    .modal-resize-handle:hover { background-color: #6c3ce0; width: 20px; height: 20px; }
    
    /* Badge styles */
    .badge-pending { background: rgba(245,158,11,0.2); color:#f59e0b; padding:2px 8px; border-radius:999px; font-size:0.75rem; }
    .badge-confirmed { background: rgba(34,197,94,0.2); color:#22c55e; padding:2px 8px; border-radius:999px; font-size:0.75rem; }
    .badge-completed { background: rgba(59,130,246,0.2); color:#3b82f6; padding:2px 8px; border-radius:999px; font-size:0.75rem; }
    .badge-cancelled { background: rgba(239,68,68,0.2); color:#ef4444; padding:2px 8px; border-radius:999px; font-size:0.75rem; }

  <script>
    function getTimeBasedGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return { text: "Good Morning ☀️", emoji: "🌅" };
      if (hour < 17) return { text: "Good Afternoon 🌤️", emoji: "☀️" };
      if (hour < 21) return { text: "Good Evening 🌙", emoji: "✨" };
      return { text: "Good Night 🌟", emoji: "🌙" };
    }

    function checkAdminSession() {
      let session = localStorage.getItem('lawie_admin_session');
      if (!session) session = sessionStorage.getItem('lawie_admin_session');
      if (!session) { window.location.href = 'login.html'; return false; }
      try {
        // JWT is 3 base64url parts — decode the payload (middle part)
        const parts = session.split('.');
        if (parts.length !== 3) throw new Error('not a jwt');
        const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
        // JWT exp is in seconds
        if (!payload.exp || payload.exp * 1000 < Date.now()) {
          localStorage.removeItem('lawie_admin_session');
          sessionStorage.removeItem('lawie_admin_session');
          window.location.href = 'login.html';
          return false;
        }
        const greeting = getTimeBasedGreeting();
        sessionStorage.setItem('adminName', payload.name || 'Administrator');
        sessionStorage.setItem('adminGreeting', greeting.text);
        sessionStorage.setItem('adminEmoji', greeting.emoji);
        sessionStorage.setItem('adminRole', payload.role || 'admin');
        window._adminRole = payload.role || 'admin';
        return true;
      } catch (e) { window.location.href = 'login.html'; return false; }
    }
    checkAdminSession();
  </script>

    // ==================== UPDATES HELPERS ====================
    function getReadUpdates() {
      try { return JSON.parse(localStorage.getItem('lawie_updates_read') || '[]'); } catch { return []; }
    }
    function markUpdateRead(version) {
      const read = getReadUpdates();
      if (!read.includes(version)) { read.push(version); localStorage.setItem('lawie_updates_read', JSON.stringify(read)); }

    // Counts work waiting for the owner to accept, not unread changelog entries.
    // A badge against a hardcoded array told nobody anything actionable; this
    // one is the amount of delivered work sitting unacknowledged.
    async function updateBadge() {
      const badge = document.getElementById('updatesBadge');
      if (!badge) return;
      const role = window._adminRole || sessionStorage.getItem('adminRole') || 'admin';
      if (!['admin', 'developer'].includes(role)) { badge.classList.add('hidden'); return; }

      const res = await apiRequest('GET', '/api/admin/work-log?status=delivered');
      const n = res?._error ? 0 : (res.meta?.total || 0);
      if (n > 0) { badge.textContent = n; badge.classList.remove('hidden'); }
      else { badge.classList.add('hidden'); }
    }

    // ==================== API HELPERS ====================
    function getAdminToken() {
      return localStorage.getItem('lawie_admin_session') || sessionStorage.getItem('lawie_admin_session') || '';
    }

    async function apiRequest(method, path, body = null) {
      try {
        const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getAdminToken()}` } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        const json = await res.json().catch(() => null);
        // `fields` must survive. The API returns per-field messages so a form can
        // mark the input that is actually wrong; dropping them here meant every
        // caller fell back to a generic "Could not save" popup and the manager
        // had to guess which field the server objected to. Affects packages,
        // offers, reviews and gallery alike.
        // `duplicates` rides along for the same reason `fields` does: the Quick
        // Add form answers a 409 by showing the rows it clashed with, and it
        // cannot do that if the only thing that survives is the message.
        if (!res.ok) return { _error: true, status: res.status, message: json?.error || res.statusText, fields: json?.fields || null, duplicates: json?.duplicates || null };
        return json;
      } catch(e) { return { _error: true, status: 0, message: 'Network error — cannot reach API' }; }
    }

    // The gallery list endpoint is capped at 100 rows per request. The dashboard
    // grid wants the whole library, so page through rather than silently showing
    // the first hundred once the gallery outgrows that.
    async function loadAllGalleryPages() {
      const PAGE = 100;
      const all = [];
      for (let offset = 0; ; offset += PAGE) {
        const res = await apiRequest('GET', `/api/admin/gallery?limit=${PAGE}&offset=${offset}`);
        if (res?._error) return offset === 0 ? res : { data: all };
        all.push(...(res.data || []));
        if (!res.meta?.hasMore) break;
      }
      return { data: all };
    }

      const [evts, svcs, gal, revs, bans, posts, bkgs, emps, pay] = await Promise.all([

        loadAllGalleryPages(),
        apiRequest('GET', '/api/admin/reviews'),
        apiRequest('GET', '/api/admin/banners'),
        apiRequest('GET', '/api/admin/posters'),
        apiRequest('GET', '/api/admin/bookings'),
        apiRequest('GET', '/api/admin/employees'),
        apiRequest('GET', '/api/admin/payroll'),
      ]);
      store.events = evts?.data || [];
      store.services = svcs?.data || [];
      store.gallery = gal?.data || [];
      store.reviews = revs?.data || [];
      store.marketingBanners = bans?.data || [];
      store.posters = posts?.data || [];

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
    function updateStats() { document.getElementById('statEvents').textContent = store.events.length; document.getElementById('statBookings').textContent = store.bookings.filter(b => b.status === 'pending').length; document.getElementById('statGallery').textContent = store.gallery.length; document.getElementById('statReviews').textContent = store.reviews.filter(r => !r.isApproved).length; }
    function updateGreetingDisplay() { const greeting = sessionStorage.getItem('adminGreeting') || 'Welcome'; const emoji = sessionStorage.getItem('adminEmoji') || '👋'; const adminName = sessionStorage.getItem('adminName') || 'Administrator'; document.getElementById('adminGreetingDisplay').textContent = `${greeting} ${emoji}`; document.getElementById('adminNameDisplay').textContent = adminName; }

    function showToast(message, type = 'info') {

      const icons = { info: 'fa-info-circle', success: 'fa-check-circle', booking: 'fa-calendar-check', review: 'fa-star' };

      toast.className = 'fixed bottom-4 right-4 z-50 ' + (colors[type] || colors.info) + ' text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 max-w-sm fade-in';
      toast.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '"></i><span>' + message + '</span>';
      document.body.appendChild(toast);

    function updateNotifBadge() {

    async function refreshLiveData() {
      const prevBookings = store.bookings.length;
      const prevPendingRevs = store.reviews.filter(r => !r.isApproved).length;
      await loadAllDataFromAPI();
      updateStats();
      updateNotifBadge();
      const newBookings = store.bookings.length - prevBookings;
      const newPendingRevs = store.reviews.filter(r => !r.isApproved).length - prevPendingRevs;
      if (newBookings > 0) showToast(newBookings + ' new booking request' + (newBookings > 1 ? 's' : '') + '!', 'booking');
      if (newPendingRevs > 0) showToast(newPendingRevs + ' new review' + (newPendingRevs > 1 ? 's' : '') + ' awaiting approval!', 'review');
      if (newBookings > 0 || newPendingRevs > 0) {
        if (currentTab === 'dashboard') renderDashboard();
        else if (currentTab === 'bookings' && newBookings > 0) renderBookings();
        else if (currentTab === 'reviews' && newPendingRevs > 0) renderReviews();
      }
      const indicator = document.getElementById('lastRefreshed');
      if (indicator) indicator.textContent = 'Updated: ' + new Date().toLocaleTimeString();
    }

    function startAutoRefresh() { setInterval(refreshLiveData, 30000); }

    // ==================== WELCOME HERO ====================
    //
    // Shared by both dashboards. Every figure in it is read from data already
    // loaded — nothing is estimated, rounded up, or invented to look better.
    // A greeting that congratulates you on numbers that are not real is worse
    // than no greeting: it teaches you to distrust the whole screen.

    function firstName(full) {
      return String(full || '').trim().split(/\s+/)[0] || 'there';
    }

    // Kenya is UTC+3 and does not observe daylight saving. Using the browser's
    // clock would greet the owner "good evening" at 11am if he ever opened the
    // dashboard while travelling.
    function nairobiNow() {
      return new Date(new Date().toLocaleString('en-US', { timeZone: 'Africa/Nairobi' }));
    }

    function heroGreeting(h) {
      if (h < 5)  return { text: 'Still up',      icon: 'fa-moon' };
      if (h < 12) return { text: 'Good morning',  icon: 'fa-sun' };
      if (h < 17) return { text: 'Good afternoon',icon: 'fa-sun' };
      if (h < 21) return { text: 'Good evening',  icon: 'fa-cloud-moon' };
      return { text: 'Good evening', icon: 'fa-moon' };
    }

    // What has actually changed since this person last had the dashboard open.
    // Read before the marker is rewritten, so the first render after a login
    // reports the gap rather than zero.
    function readLastSeen(role) {
      const key = `lawie_last_seen_${role}`;
      const raw = localStorage.getItem(key);
      localStorage.setItem(key, new Date().toISOString());
      const t = raw ? Date.parse(raw) : NaN;
      return Number.isFinite(t) ? t : null;
    }

    function humanGap(ms) {
      const h = ms / 3600000;
      if (h < 1)  return 'a few minutes ago';
      if (h < 2)  return 'an hour ago';
      if (h < 24) return `${Math.round(h)} hours ago`;
      const d = Math.round(h / 24);
      return d === 1 ? 'yesterday' : `${d} days ago`;
    }

    // A fortnight of enquiry counts as an inline SVG. No library, no request,
    // and it answers "are things moving?" faster than any number can.
    function heroSparkline(counts, stroke = '#a78bfa') {
      const w = 132, h = 34, max = Math.max(1, ...counts);
      const step = counts.length > 1 ? w / (counts.length - 1) : w;
      const pts = counts.map((v, i) => [i * step, h - (v / max) * (h - 4) - 2]);
      const line = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      const area = `${line} L${w},${h} L0,${h} Z`;
      return `
        <svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" class="overflow-visible">
          <defs>
            <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${stroke}" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="${stroke}" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${area}" fill="url(#sparkFill)"></path>
          <path d="${line}" fill="none" stroke="${stroke}" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" class="spark-line"></path>
        </svg>`;
    }

    function dailyCounts(items, field, days = 14) {
      const out = new Array(days).fill(0);
      const today = new Date(); today.setHours(23, 59, 59, 999);
      const start = new Date(today.getTime() - (days - 1) * 86400000); start.setHours(0, 0, 0, 0);
      items.forEach(it => {
        const t = Date.parse(it[field] || '');
        if (!Number.isFinite(t) || t < start.getTime() || t > today.getTime()) return;
        const idx = Math.floor((t - start.getTime()) / 86400000);
        if (idx >= 0 && idx < days) out[idx]++;
      });
      return out;
    }

    function heroChip(label, value, note, accent = 'text-white', delay = 0) {
      return `
        <div class="hero-chip px-4 py-3 hero-rise" style="animation-delay:${delay}ms">
          <p class="text-[11px] uppercase tracking-wide text-gray-400">${label}</p>
          <p class="text-2xl font-black ${accent} leading-tight mt-0.5">${value}</p>
          <p class="text-[11px] text-gray-500 mt-0.5">${note}</p>
        </div>`;
    }

    /**

            <h2 class="mt-2 text-3xl sm:text-[2.6rem] font-black leading-[1.1] hero-rise" style="animation-delay:70ms">
              <span class="hero-name">${escapeHtml(name)}</span>
            </h2>

            <p class="text-sm text-gray-400 mt-2 max-w-lg hero-rise" style="animation-delay:130ms">
              ${role === 'manager'
                ? 'Everything you publish today is what a client sees tomorrow.'
                : 'Every number here is read from your live data — nothing estimated.'}
            </p>

            <div class="mt-5 flex flex-wrap items-center gap-3 hero-rise" style="animation-delay:190ms">
              <button type="button" onclick="switchTab('${cta.tab}')"

          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 xl:w-[27rem] flex-shrink-0">

        </div>
      </section>`;
    }

    // ==================== DASHBOARD ====================
    function renderDashboard() {
      const role = window._adminRole || sessionStorage.getItem('adminRole') || 'admin';
      if (role === 'manager') { renderManagerDashboard(); return; }
      const container = document.getElementById('sectionContent');
      const recentBookings = store.bookings.slice(0, 5);
      const pendingReviews = store.reviews.filter(r => !r.isApproved);
      // Real agreed prices on work actually won — not budget-bracket midpoints.
      //
      // This previously read: budgets = {'10k-30k': 20000, ...} mapped from the
      // client's self-declared bracket and summed across EVERY booking including
      // cancelled ones. That printed a fabricated "KES 20,000 Total Pipeline" off
      // a single enquiry nobody had quoted yet. The analytics tab was rebuilt to
      // stop doing this; the same invented figure was still on this screen.
      const wonBookings = store.bookings.filter(b => ['confirmed','completed'].includes(b.status));
      const bookedValue = wonBookings.reduce((s, b) => s + (Number(b.agreedAmount) || 0), 0);
      const unpricedWon = wonBookings.filter(b => b.agreedAmount === null || b.agreedAmount === undefined).length;
      const confirmedBookings = store.bookings.filter(b => ['confirmed','completed'].includes(b.status)).length;

      const greeting = sessionStorage.getItem('adminGreeting') || 'Welcome'; const emoji = sessionStorage.getItem('adminEmoji') || '👋'; const adminName = sessionStorage.getItem('adminName') || 'Administrator';

      // Build last 6 months chart data from real bookings

      const chartCounts = last6.map(mo => store.bookings.filter(b => { const d = new Date(b.createdAt || b.eventDate); return d.getMonth() === mo.m && d.getFullYear() === mo.y; }).length);

      const rawActivity = [
        ...store.bookings.slice(-15).map(b => ({ type: 'booking', date: new Date(b.createdAt || b.eventDate || Date.now()), item: b })),

      ].sort((a, b) => b.date - a.date).slice(0, 8);
      const activityHtml = rawActivity.length === 0

            return '<div class="px-4 py-3 flex items-center gap-3 hover:bg-gray-800/50 transition"><div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ' + bg + '"><i class="fas ' + icon + ' text-xs"></i></div><div class="flex-1 min-w-0"><p class="text-sm font-medium truncate">' + label + '</p><p class="text-xs text-gray-500 mt-0.5">' + a.date.toLocaleDateString() + ' &middot; ' + badge + '</p></div></div>';
          }).join('');

      // Upcoming events in next 30 days
      const nowDate = new Date();
      const in30 = new Date(nowDate.getTime() + 30 * 24 * 60 * 60 * 1000);
      const upcomingEvents = store.events
        .filter(e => { const d = new Date(e.date); return d >= nowDate && d <= in30 && e.status !== 'cancelled'; })
        .sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 5);
      const upcomingHtml = upcomingEvents.length === 0 ? '' : `

          <div class="px-6 py-4 border-b border-gray-800 flex items-center gap-3 bg-orange-500/5">

              return `<div class="px-6 py-3.5 flex items-center gap-4 hover:bg-gray-800/40 transition">

      // monthRevEst removed: it was the same budget-bracket midpoint fabrication

      const activeServices = store.services.filter(s => s.isActive).length;

      // ── Owner's hero ──────────────────────────────────────────────

      const heroPending  = store.bookings.filter(b => b.status === 'pending').length;
      const heroSpark    = dailyCounts(store.bookings, 'createdAt', 14);
      const ownerCta =

                       : { label: 'Open full analytics', tab: 'analytics', tone: 'bg-purple-600 hover:bg-purple-500 text-white' };

      const ownerChips =
        heroChip('Booked', bookedValue ? kesShort(bookedValue) : '—',
                 unpricedWon ? `${unpricedWon} still unpriced` : 'on work won', 'text-white', 0) +
        heroChip('Jobs won', wonBookings.length,

            ${[{icon:'fa-calendar-alt',label:'Events',tab:'events',c:'text-purple-400 bg-purple-600/10 hover:bg-purple-600/20'},{icon:'fa-images',label:'Gallery',tab:'gallery',c:'text-blue-400 bg-blue-600/10 hover:bg-blue-600/20'},{icon:'fa-bullhorn',label:'Marketing',tab:'marketing',c:'text-yellow-400 bg-yellow-600/10 hover:bg-yellow-600/20'},{icon:'fa-star',label:'Reviews',tab:'reviews',c:'text-orange-400 bg-orange-600/10 hover:bg-orange-600/20'},{icon:'fa-headphones',label:'Services',tab:'services',c:'text-green-400 bg-green-600/10 hover:bg-green-600/20'},{icon:'fa-clipboard-list',label:'Enquiries',tab:'bookings',c:'text-red-400 bg-red-600/10 hover:bg-red-600/20'}].map(n => `<button type="button" onclick="switchTab('${n.tab}')" class="flex flex-col items-center gap-2 p-3 ${n.c} rounded-xl transition"><i class="fas ${n.icon} text-lg"></i><span class="text-xs font-medium">${n.label}</span></button>`).join('')}

    // ==================== REVAMPED EVENTS MANAGEMENT ====================
    let eventViewMode = 'upcoming'; // upcoming, past, all

    // Seats sold is derived, not stored, so it inherits any inconsistency
    // between capacity and seats remaining. Live rows had seats_left above
    // total_seats, and this figure went straight onto the Events tab as
    // "Tickets Sold -130" and "Revenue Generated KES -435,000" — numbers that
    // are not merely wrong but impossible, which is worse, because the manager
    // has no way to tell which of the four tiles to believe.
    //
    // The write path now clamps the two together, but a dashboard must not
    // depend on its data being clean to show a sane number. One helper, used
    // everywhere the figure appears, so the tiles, the progress bar and the
    // export can never disagree with each other again.
    function capacityFor(event) {
      const total = Number(event?.totalSeats);
      if (Number.isFinite(total) && total > 0) return total;
      const left = Number(event?.seatsLeft);
      return Number.isFinite(left) && left > 0 ? left : 0;
    }

    function seatsSoldFor(event) {
      const capacity = capacityFor(event);
      const left = Number(event?.seatsLeft);
      if (!capacity) return 0;
      const sold = capacity - (Number.isFinite(left) ? left : capacity);
      // Bounded by the capacity at both ends: you cannot sell a negative ticket,
      // and you cannot sell more seats than the room holds.
      return Math.min(Math.max(sold, 0), capacity);
    }

    function percentSoldFor(event) {
      const capacity = capacityFor(event);
      return capacity ? Math.round((seatsSoldFor(event) / capacity) * 100) : 0;
    }

    // What the manager should see as remaining, regardless of what is stored.
    function seatsLeftFor(event) {
      return capacityFor(event) - seatsSoldFor(event);
    }

    function getEventStatusBadge(event) {
      const now = new Date().toISOString().split('T')[0];
      if (event.status === 'cancelled') return 'bg-red-600/20 text-red-400';
      if (event.date < now) return 'bg-gray-600/20 text-gray-400';
      if (seatsLeftFor(event) <= 0) return 'bg-orange-600/20 text-orange-400';
      if (event.isActive === false) return 'bg-yellow-600/20 text-yellow-400';
      return 'bg-green-600/20 text-green-400';
    }

    function getEventStatusText(event) {
      const now = new Date().toISOString().split('T')[0];
      if (event.status === 'cancelled') return 'Cancelled';
      if (event.date < now) return 'Completed';
      if (seatsLeftFor(event) <= 0) return 'Sold Out';
      if (event.isActive === false) return 'Draft';
      return 'Published';
    }

      if (result.isConfirmed) { store.events = store.events.filter(e => e.id !== id); await apiRequest('DELETE', `/api/admin/events/${id}`); renderEvents(); updateStats(); Swal.fire({ icon: 'success', title: 'Event deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' }); }
    }

    // Duplicate an event (for quick creation of similar events)
    async function duplicateEvent(id) {
      const originalEvent = store.events.find(e => e.id === id);
      if (!originalEvent) return;
      
      const duplicatedEvent = {
        ...originalEvent,
        id: Date.now().toString(),
        title: `${originalEvent.title} (Copy)`,
        status: 'draft',
        isActive: false,
        seatsLeft: originalEvent.totalSeats,
        bookingCount: 0,
        createdAt: new Date().toISOString()
      };
      
      store.events.push(duplicatedEvent);
      await apiRequest('POST', '/api/admin/events', duplicatedEvent);
      renderEvents();
      
      Swal.fire({ icon: 'success', title: 'Event Duplicated!', text: 'You can now edit the copy', timer: 2000, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
    }

    // Export event data as CSV
    function exportEventData(id) {
      const event = store.events.find(e => e.id === id);
      if (!event) return;
      
      // Get bookings for this event (in production, fetch from database)
      const eventBookings = store.bookings.filter(b => b.eventId === id || b.eventType === event.title);
      
      const csvData = [
        ['Event Title', event.title],
        ['Event Date', new Date(event.date).toLocaleString()],
        ['Venue', event.venue],
        ['Ticket Price', `KES ${event.price.toLocaleString()}`],
        ['Total Seats', event.totalSeats || 'N/A'],
        ['Seats Sold', seatsSoldFor(event)],
        ['Revenue', `KES ${(seatsSoldFor(event) * (event.price || 0)).toLocaleString()}`],
        ['Status', event.status || (event.isActive ? 'Active' : 'Inactive')],
        [''],
        ['Booking Details'],
        ['Name', 'Email', 'Phone', 'Ticket Type', 'Quantity', 'Amount']
      ];
      
      // Add individual bookings (placeholder for now)
      eventBookings.forEach(booking => {
        csvData.push([booking.name, booking.email, booking.phone, 'Standard', 1, `KES ${event.price}`]);
      });
      
      const csvContent = csvData.map(row => row.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${event.title.replace(/[^a-z0-9]/gi, '_')}_report.csv`;
      a.click();
      URL.revokeObjectURL(url);
      
      Swal.fire({ icon: 'success', title: 'Export Started!', text: 'CSV file is being downloaded', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
    }

    async function saveEvent() {
      const title = document.getElementById('eventTitle').value;
      const date = document.getElementById('eventDate').value;
      const venue = document.getElementById('eventVenue').value;
      const price = parseInt(document.getElementById('eventPrice').value);
      const totalSeats = parseInt(document.getElementById('eventTotalSeats').value);
      const status = document.getElementById('eventStatus').value;
      const description = document.getElementById('eventDesc').value;
      const image = document.getElementById('eventImage').value;
      const isRecurring = document.getElementById('eventRecurring')?.checked || false;
      
      if (!title || !date || !venue || !price) {
        Swal.fire({ icon: 'error', title: 'Missing Fields', text: 'Please fill in all required fields', background: '#1e1e2a', color: '#fff' });
        return;
      }
      
      // Seats already sold are preserved across an edit — the manager is
      // changing capacity, not un-selling tickets. seatsSoldFor bounds that
      // figure, so an edit to a row whose stored numbers had drifted repairs it
      // instead of carrying the drift forward: the old expression derived a
      // negative "sold" and then subtracted it, pushing seats remaining further
      // above capacity on every save.
      const existing = currentEditId ? store.events.find(e => e.id === currentEditId) : null;
      const seatsSold = existing ? seatsSoldFor(existing) : 0;
      // Reducing capacity below what is already sold reads as sold out, never as
      // negative stock.
      const seatsLeft = Math.max(totalSeats - seatsSold, 0);

      const payload = {
        title, date, venue, price, totalSeats, seatsLeft,
        description,
        image: image || 'https://placehold.co/400x300?text=' + encodeURIComponent(title),
        status,
        isActive: status !== 'draft' && status !== 'cancelled',
      };

      const result = await apiRequest(
        currentEditId ? 'PUT' : 'POST',
        currentEditId ? `/api/admin/events/${currentEditId}` : '/api/admin/events',
        payload
      );

      if (!result?.data) {
        Swal.fire({ icon: 'error', title: 'Failed to Save Event', text: result?._error ? result.message : 'Unexpected response from server', background: '#1e1e2a', color: '#fff' });
        return;
      }

      if (currentEditId) {
        store.events = store.events.map(e => e.id === currentEditId ? result.data : e);
        Swal.fire({ icon: 'success', title: 'Event Updated!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      } else {
        store.events.push(result.data);

        // Save recurring events to DB individually
        if (isRecurring) {
          const recurringType = document.getElementById('recurringType').value;
          const recurringCount = parseInt(document.getElementById('recurringCount').value);
          let currentDate = new Date(date);
          for (let i = 1; i < recurringCount; i++) {
            if (recurringType === 'weekly') currentDate = new Date(currentDate.setDate(currentDate.getDate() + 7));
            else if (recurringType === 'monthly') currentDate = new Date(currentDate.setMonth(currentDate.getMonth() + 1));
            const recurPayload = { ...payload, date: currentDate.toISOString().slice(0, 16), title: `${title} (${recurringType === 'weekly' ? 'Week' : 'Month'} ${i + 1})`, seatsLeft: totalSeats };
            const recurResult = await apiRequest('POST', '/api/admin/events', recurPayload);
            if (recurResult?.data) store.events.push(recurResult.data);
          }
          Swal.fire({ icon: 'success', title: `Created ${recurringCount} recurring events!`, timer: 2000, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
        } else {
          Swal.fire({ icon: 'success', title: 'Event Created!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
        }
      }

      closeModal();
      renderEvents();
      updateStats();
    }

    function calcROI() {
      const price = parseFloat(document.getElementById('eventPrice')?.value) || 0;
      const seats = parseInt(document.getElementById('eventTotalSeats')?.value) || 0;
      const cost = parseFloat(document.getElementById('eventCost')?.value) || 0;
      const roi = document.getElementById('roiDisplay');
      if (!roi) return;
      if (price > 0 || cost > 0) {
        roi.style.display = 'block';
        const revenue = price * seats;
        const profit = revenue - cost;
        document.getElementById('roiRevenue').textContent = 'KES ' + revenue.toLocaleString();
        document.getElementById('roiCost').textContent = 'KES ' + cost.toLocaleString();
        const profitEl = document.getElementById('roiProfit');
        profitEl.textContent = 'KES ' + profit.toLocaleString();
        profitEl.className = 'text-lg font-bold ' + (profit >= 0 ? 'text-green-400' : 'text-red-400');
      } else {
        roi.style.display = 'none';
      }
    }

    // ==================== SERVICES ====================
    //
    // This is the engine that generates all revenue, so the tab leads with what
    // each service actually earns rather than with content editing. An owner
    // opening it should see, without clicking: which services bring enquiries,
    // which convert, which earn, and which are dormant.
    //
    // Content editing sits behind that because it is the less frequent task —
    // but readiness is shown on every card, because right now every service is
    // missing the thing that matters most: a price.

    let serviceViewMode = 'performance';   // performance | content | inactive
    let servicePerf = null;
    let servicePerfError = null;

    const SERVICE_RANGES = { '30d': 30, '90d': 90, '365d': 365 };
    let servicePerfRange = '90d';

    async function loadServicePerformance() {
      const days = SERVICE_RANGES[servicePerfRange] || 90;
      const to   = new Date();
      const from = new Date(); from.setDate(from.getDate() - (days - 1));
      const iso  = d => d.toISOString().split('T')[0];

      const res = await apiRequest('GET', `/api/admin/services/performance?from=${iso(from)}&to=${iso(to)}`);
      if (res?._error) {
        servicePerf = null;
        servicePerfError = res.status === 403 ? 'admin-only' : (res.message || 'unavailable');
        return;
      }
      servicePerf = res.data;
      servicePerfError = null;
    }

    function svcKes(n) {
      const v = Number(n) || 0;
      if (Math.abs(v) >= 1000000) return 'KES ' + (v / 1000000).toFixed(1) + 'M';
      if (Math.abs(v) >= 1000)    return 'KES ' + Math.round(v / 1000) + 'K';
      return 'KES ' + Math.round(v).toLocaleString('en-KE');
    }

    // Same rule as the analytics tab: no meaningful percentage exists from zero,
    // so say "new" rather than inventing +100%.
    function svcDelta(cur, prev, { goodIsUp = true } = {}) {
      const c = Number(cur) || 0, p = Number(prev) || 0;
      if (p === 0) return c === 0 ? '' : `<span class="text-xs px-1.5 py-0.5 rounded bg-blue-500/15 text-blue-400 font-semibold">new</span>`;
      const pct = ((c - p) / p) * 100;
      if (Math.round(Math.abs(pct)) === 0) return `<span class="text-xs text-gray-600">level</span>`;
      const up = pct > 0, good = up === goodIsUp;
      return `<span class="text-xs ${good ? 'text-green-400' : 'text-red-400'} font-semibold">
                <i class="fas fa-arrow-${up ? 'up' : 'down'} text-[10px]"></i>${Math.abs(pct).toFixed(0)}%</span>`;
    }

    function readinessColour(r) {
      return r >= 80 ? 'text-green-400' : r >= 50 ? 'text-yellow-400' : 'text-red-400';
    }

    // What is missing, named. "Readiness 35%" tells the manager nothing about
    // what to do next; "no price, no full description" does.
    function missingBits(c) {
      const gaps = [];
      if (!c.pricedPackages) gaps.push(c.packages ? 'no price on any package' : 'no packages');
      if (!c.shortDesc)      gaps.push('no summary');
      if (!c.longDesc)       gaps.push('no full description');
      if (!c.photos)         gaps.push('no photos');
      else if (c.photos < 3) gaps.push('only ' + c.photos + ' photo' + (c.photos === 1 ? '' : 's'));
      if (!c.image)          gaps.push('no cover image');
      return gaps;
    }

    async function renderServices() {
      const container = document.getElementById('sectionContent');
      if (!container) return;

      if (!servicePerf && !servicePerfError) {
        container.innerHTML = `<div class="flex justify-center py-16"><div class="spinner"></div></div>`;
        await loadServicePerformance();
      }

      const services = store.services || [];
      const perfById = {};
      (servicePerf?.services || []).forEach(s => { perfById[s.id] = s; });

      const tab = (k, label) => `
        <button type="button" onclick="setServiceView('${k}')"
          class="px-3.5 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition border ${
            serviceViewMode === k ? 'bg-purple-600 border-purple-500 text-white'
                                  : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white hover:bg-gray-700'}">${label}</button>`;

      const t = servicePerf?.totals;
      const header = `
        <div class="flex flex-wrap items-start justify-between gap-3 mb-4">
          <div>
            <h2 class="text-xl font-bold text-white">Services</h2>
            <p class="text-sm text-gray-500 mt-0.5">
              ${t ? `${t.activeServices} of ${t.services} active · ${t.pricedPackages} priced package${t.pricedPackages === 1 ? '' : 's'} · ${t.enquiries} enquir${t.enquiries === 1 ? 'y' : 'ies'} in this period`
                  : `${services.length} services`}
            </p>
          </div>
          <div class="flex gap-2 flex-wrap">
            ${Object.keys(SERVICE_RANGES).map(k => `
              <button type="button" onclick="setServicePerfRange('${k}')"
                class="px-3 py-1.5 rounded-lg text-xs font-medium transition border ${
                  servicePerfRange === k ? 'bg-purple-600 border-purple-500 text-white'
                                        : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white'}">
                ${k === '365d' ? '12 months' : k.replace('d', ' days')}
              </button>`).join('')}
            <button type="button" onclick="openServiceForm()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
              <i class="fas fa-plus"></i> New service
            </button>
          </div>
        </div>

        <div class="flex gap-1.5 flex-wrap mb-5">
          ${tab('performance', '📈 Performance')}
          ${tab('content', '📝 Content gaps')}
          ${tab('inactive', '⚫ Inactive')}
        </div>`;

      if (servicePerfError === 'admin-only') {
        container.innerHTML = header + `
          <div class="bg-gray-900 border border-gray-800 rounded-2xl p-10 text-center">
            <i class="fas fa-lock text-2xl text-gray-600 mb-3"></i>
            <p class="text-sm text-gray-500">Revenue per service is visible to the business owner only. You can still edit service content below.</p>
          </div>` + serviceCards(services, perfById, true);
        return;
      }

      // How trustworthy the revenue split is. A booking carries one agreed
      // amount across several services, so unless a per-service price was
      // recorded the split is even — and the tab says so rather than implying
      // a precision it does not have.
      const attributionNote = t && (t.evenlySplit > 0 || t.booked > 0) ? `
        <p class="text-xs text-gray-600 mb-4">
          <i class="fas fa-circle-info mr-1"></i>
          Revenue is split evenly between the services on each booking${t.exactlyAttributed ? `, except ${t.exactlyAttributed} with a recorded per-service price` : ''}.
          Record a price per service on a booking to make this exact.
        </p>` : '';

      let body = '';
      if (serviceViewMode === 'performance')   body = attributionNote + serviceCards(services.filter(s => s.isActive), perfById);
      else if (serviceViewMode === 'content')  body = serviceContentView(services, perfById);
      else                                     body = serviceCards(services.filter(s => !s.isActive), perfById);

      container.innerHTML = header + body;
    }

    function serviceCards(list, perfById, hidePerf = false) {
      if (!list.length) {
        return `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-12 text-center">
            <i class="fas fa-headphones text-3xl text-gray-600 mb-3"></i>
            <p class="text-gray-400 text-sm mb-4">${serviceViewMode === 'inactive' ? 'No inactive services.' : 'No services yet.'}</p>
            <button type="button" onclick="openServiceForm()" class="text-purple-400 hover:underline text-sm">Add one →</button>
          </div>`;
      }

      // Ordered by what they earn, then by demand — the question an owner opens
      // this tab to answer. Falls back to the manual display order only when
      // there is nothing to rank by.
      const ordered = [...list].sort((a, b) => {
        const pa = perfById[a.id] || {}, pb = perfById[b.id] || {};
        return (pb.booked || 0) - (pa.booked || 0)
            || (pb.enquiries || 0) - (pa.enquiries || 0)
            || (a.displayOrder || 0) - (b.displayOrder || 0);
      });

      return `<div class="space-y-3">${ordered.map(s => {
        const p = perfById[s.id];
        const c = p?.content;
        const gaps = c ? missingBits(c) : [];

        return `
          <div class="bg-gray-900 rounded-2xl border ${s.isActive ? 'border-gray-800' : 'border-gray-800 opacity-70'} p-4">
            <div class="flex flex-wrap items-start justify-between gap-4">

              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  <i class="fas ${escapeHtml(s.icon || 'fa-star')} text-purple-400"></i>
                  <h3 class="font-bold text-white">${escapeHtml(s.name)}</h3>
                  ${!s.isActive ? '<span class="text-xs px-2 py-0.5 rounded-full bg-gray-700/50 text-gray-400">Hidden from site</span>' : ''}
                  ${p?.fromPrice != null
                    ? `<span class="text-xs px-2 py-0.5 rounded-full bg-green-600/15 text-green-400">from ${svcKes(p.fromPrice)}</span>`
                    : `<span class="text-xs px-2 py-0.5 rounded-full bg-red-600/15 text-red-400">no price</span>`}
                </div>
                <p class="text-xs text-gray-500">${escapeHtml(s.shortDesc || 'No summary written yet.')}</p>

                ${gaps.length ? `
                  <p class="text-xs text-yellow-500/90 mt-2">
                    <i class="fas fa-triangle-exclamation mr-1"></i>${gaps.join(' · ')}
                  </p>` : `
                  <p class="text-xs text-green-500/80 mt-2"><i class="fas fa-circle-check mr-1"></i>Fully set up</p>`}
              </div>

              ${!hidePerf && p ? `
                <div class="grid grid-cols-4 gap-4 flex-shrink-0 text-center">
                  <div>
                    <p class="text-xs text-gray-500">Enquiries</p>
                    <p class="text-lg font-bold text-white">${p.enquiries}</p>
                    ${svcDelta(p.enquiries, p.enquiriesPrev)}
                  </div>
                  <div>
                    <p class="text-xs text-gray-500">Won</p>
                    <p class="text-lg font-bold text-purple-400">${p.won}</p>
                    <span class="text-xs text-gray-600">${p.winRate != null ? p.winRate + '%' : '—'}</span>
                  </div>
                  <div>
                    <p class="text-xs text-gray-500">Booked</p>
                    <p class="text-lg font-bold ${p.booked > 0 ? 'text-green-400' : 'text-gray-600'}">${svcKes(p.booked)}</p>
                    ${svcDelta(p.booked, p.bookedPrev)}
                  </div>
                  <div>
                    <p class="text-xs text-gray-500">Ready</p>
                    <p class="text-lg font-bold ${readinessColour(c.readiness)}">${c.readiness}%</p>
                    <span class="text-xs text-gray-600">${c.packages} pkg</span>
                  </div>
                </div>` : ''}

              <div class="flex gap-1.5 flex-wrap flex-shrink-0">
                <button type="button" onclick="openServiceForm('${s.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-purple-600 hover:bg-purple-700 transition">
                  <i class="fas fa-pen mr-1"></i>Edit
                </button>
                <button type="button" onclick="toggleServiceActive('${s.id}')" class="px-3 py-1.5 rounded-lg text-xs transition ${s.isActive ? 'bg-yellow-600/20 text-yellow-400 hover:bg-yellow-600/30' : 'bg-green-600/20 text-green-400 hover:bg-green-600/30'}">
                  ${s.isActive ? 'Hide' : 'Show'}
                </button>
                <button type="button" onclick="deleteService('${s.id}')" class="px-3 py-1.5 rounded-lg text-xs bg-red-600/10 hover:bg-red-600/25 text-red-400 transition">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>`;
      }).join('')}</div>`;
    }

    // Content view: sorted by what is most broken, so the work queue is the
    // screen rather than something the manager has to assemble mentally.
    function serviceContentView(services, perfById) {
      const rows = services
        .map(s => ({ s, p: perfById[s.id] }))
        .filter(r => r.p)
        .sort((a, b) => a.p.content.readiness - b.p.content.readiness);

      if (!rows.length) return `<p class="text-sm text-gray-500">No content data available.</p>`;

      const complete = rows.filter(r => r.p.content.readiness >= 80).length;

      return `
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 mb-4">
          <p class="text-sm text-gray-300">
            <strong class="${complete === rows.length ? 'text-green-400' : 'text-yellow-400'}">${complete} of ${rows.length}</strong>
            services are fully set up for clients.
          </p>
          <p class="text-xs text-gray-500 mt-1">
            A service with no price is the most expensive gap — visitors compare on price and leave when they cannot find one.
          </p>
        </div>

        <div class="space-y-2">
          ${rows.map(({ s, p }) => {
            const c = p.content;
            const chip = (ok, label) => `
              <span class="text-xs px-2 py-0.5 rounded-full ${ok ? 'bg-green-600/15 text-green-400' : 'bg-red-600/15 text-red-400'}">
                <i class="fas ${ok ? 'fa-check' : 'fa-xmark'} mr-1"></i>${label}
              </span>`;
            return `
              <div class="bg-gray-900 rounded-xl border border-gray-800 p-3.5">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-sm font-semibold text-white">${escapeHtml(s.name)}</span>
                    <span class="text-xs font-bold ${readinessColour(c.readiness)}">${c.readiness}%</span>
                  </div>
                  <button type="button" onclick="openServiceForm('${s.id}')" class="text-xs text-purple-400 hover:underline">Fix this →</button>
                </div>
                <div class="h-1.5 bg-gray-800 rounded-full overflow-hidden mb-2.5">
                  <div class="h-1.5 rounded-full ${c.readiness >= 80 ? 'bg-green-500' : c.readiness >= 50 ? 'bg-yellow-500' : 'bg-red-500'}" style="width:${c.readiness}%"></div>
                </div>
                <div class="flex gap-1.5 flex-wrap">
                  ${chip(c.pricedPackages > 0, c.pricedPackages ? `${c.pricedPackages} priced` : 'no price')}
                  ${chip(c.shortDesc, 'summary')}
                  ${chip(c.longDesc, 'full description')}
                  ${chip(c.photos >= 3, c.photos ? `${c.photos} photos` : 'no photos')}
                  ${chip(c.image, 'cover image')}
                  ${chip(c.faqs > 0, c.faqs ? `${c.faqs} FAQs` : 'no FAQs')}
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }

    function setServiceView(mode) { serviceViewMode = mode; renderServices(); }

    async function setServicePerfRange(k) {
      servicePerfRange = k;
      servicePerf = null; servicePerfError = null;
      await renderServices();
    }

    // Spells out the consequence of each mode as it is chosen, including the
    // cost of hiding prices — which is easy to underweight because the customers
    // it loses never appear as an enquiry.
    function updatePriceDisplayHint() {
      const sel = document.getElementById('svcPriceDisplay');
      const out = document.getElementById('svcPriceHint');
      if (!sel || !out) return;
      const hints = {
        from:       'Recommended. A visible entry price tells someone with a small event that they can afford you.',
        range:      'Shows both ends. Useful when the cheapest option is genuinely small — less so if the top figure is far above it.',
        on_request: 'No figures are sent to the browser at all. Be aware this also loses visitors who compare suppliers and pick whoever published a price — they never enquire, so you will not see them.',
      };
      out.textContent = hints[sel.value] || '';
      out.className = 'text-xs mt-1.5 ' + (sel.value === 'on_request' ? 'text-yellow-500/90' : 'text-gray-500');
    }

    // Hiding a service is the safe alternative to deleting one: the website
    // stops offering it while every booking that ever referenced it keeps its
    // attribution. Awaited and checked, so the card cannot show a state the
    // server did not accept.
    async function toggleServiceActive(id) {
      const s = store.services.find(x => x.id === id);
      if (!s) return;

      const res = await apiRequest('PUT', `/api/admin/services/${id}`, { ...s, isActive: !s.isActive });
      if (res?._error) {
        Swal.fire({ icon: 'error', title: 'Could not change', text: res.message, background: '#1e1e2a', color: '#fff' });
        return;
      }
      store.services = store.services.map(x => x.id === id ? res.data : x);
      servicePerf = null;                       // active count and ordering change
      await renderServices();
      showToast(res.data.isActive ? 'Service is live on the website' : 'Service hidden from the website', 'success');
    }

    function openServiceForm(id = null) {
      currentEditId = id;
      const service = id ? store.services.find(s => s.id === id) : null;

      const pkgCount  = (service?.packages  || []).length;
      const featCount = (service?.features  || []).length;
      const faqCount  = (service?.faqs      || []).length;
      const countBadge = n => n ? `<span class="ml-1 text-xs bg-purple-800/60 text-purple-300 rounded-full px-1.5 py-0.5 font-bold">${n}</span>` : '';

      // Addressed by pkg.id, not by array index. The buttons used to pass the
      // position in the array, so a reorder or a concurrent edit acted on
      // whichever package happened to occupy that slot.
      const pkgListHtml = (service?.packages || []).map(pkg => `
        <div class="bg-gray-800/70 border ${pkg.isPopular ? 'border-yellow-600/50' : 'border-gray-700/50'} rounded-xl p-3 flex justify-between items-start gap-3">
          <div class="flex-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2 mb-1">
              <span class="font-semibold text-white text-sm">${escapeHtml(pkg.name)}</span>
              ${pkg.price != null
                ? `<span class="text-yellow-400 text-xs font-bold">KES ${Number(pkg.price).toLocaleString('en-KE')}</span>`
                : '<span class="text-gray-500 text-xs">Contact for a quote</span>'}
              ${pkg.duration ? `<span class="text-gray-500 text-xs">· ${escapeHtml(pkg.duration)}</span>` : ''}
              ${pkg.isPopular ? '<span class="text-xs bg-yellow-500/90 text-black px-1.5 py-0.5 rounded-full font-bold">Most popular</span>' : ''}
              ${pkg.isActive === false ? '<span class="text-xs bg-gray-700/60 text-gray-400 px-1.5 py-0.5 rounded-full">Hidden</span>' : ''}
            </div>
            ${(pkg.features||[]).length ? `<p class="text-xs text-gray-500 line-clamp-1">${(pkg.features).slice(0,3).map(f=>escapeHtml(f)).join(' · ')}${pkg.features.length>3?' …':''}</p>` : ''}
          </div>
          <div class="flex gap-1 shrink-0">
            <button type="button" onclick="editPackage('${pkg.id}')" class="px-2.5 py-1 bg-purple-600/20 hover:bg-purple-600/40 text-purple-400 rounded-lg text-xs transition">Edit</button>
            <button type="button" onclick="deletePackage('${pkg.id}')" class="px-2.5 py-1 bg-red-600/10 hover:bg-red-600/30 text-red-400 rounded-lg text-xs transition">Delete</button>
          </div>
        </div>`).join('') || '<p class="text-gray-500 text-center py-6 text-sm">No packages yet. A visitor comparing suppliers leaves when they cannot find a price — this is the highest-value thing to add.</p>';

      const featListHtml = (service?.features || []).map((feat, idx) => `
        <div class="bg-gray-800/70 border border-gray-700/50 rounded-xl p-3 flex justify-between items-start gap-3">
          <div class="flex items-start gap-2.5 flex-1 min-w-0">
            <div class="w-8 h-8 bg-purple-900/40 rounded-lg flex items-center justify-center shrink-0 mt-0.5">
              <i class="fas ${escapeHtml(feat.icon || 'fa-star')} text-purple-400 text-sm"></i>
            </div>
            <div class="min-w-0">
              <p class="font-semibold text-white text-sm">${escapeHtml(feat.title)}</p>
              <p class="text-xs text-gray-400 line-clamp-1 mt-0.5">${escapeHtml(feat.desc || '')}</p>
            </div>
          </div>
          <div class="flex gap-1 shrink-0">
            <button type="button" onclick="editFeature(${idx})" class="px-2.5 py-1 bg-purple-600/20 hover:bg-purple-600/40 text-purple-400 rounded-lg text-xs transition">Edit</button>
            <button type="button" onclick="deleteFeature(${idx})" class="px-2.5 py-1 bg-red-600/10 hover:bg-red-600/30 text-red-400 rounded-lg text-xs transition">Delete</button>
          </div>
        </div>`).join('') || '<p class="text-gray-500 text-center py-6 text-sm">No features yet — highlight what makes this service special.</p>';

      const faqListHtml = (service?.faqs || []).map((faq, idx) => `
        <div class="bg-gray-800/70 border border-gray-700/50 rounded-xl p-3 flex justify-between items-start gap-3">
          <div class="flex-1 min-w-0">
            <p class="font-semibold text-sm text-white">❓ ${escapeHtml(faq.q)}</p>
            <p class="text-xs text-gray-400 mt-1 line-clamp-2">${escapeHtml(faq.a)}</p>
          </div>
          <div class="flex gap-1 shrink-0">
            <button type="button" onclick="editFaq(${idx})" class="px-2.5 py-1 bg-purple-600/20 hover:bg-purple-600/40 text-purple-400 rounded-lg text-xs transition">Edit</button>
            <button type="button" onclick="deleteFaq(${idx})" class="px-2.5 py-1 bg-red-600/10 hover:bg-red-600/30 text-red-400 rounded-lg text-xs transition">Delete</button>
          </div>
        </div>`).join('') || '<p class="text-gray-500 text-center py-6 text-sm">No FAQs yet — answer common client questions.</p>';

      document.getElementById('modalTitle').innerHTML = id
        ? `Edit service <span class="text-sm font-normal text-gray-400 ml-2">${escapeHtml(service?.name || '')}</span>`
        : 'New service';

      document.getElementById('modalForm').innerHTML = `
        <!-- Tab navigation -->
        <div class="flex gap-0.5 border-b border-gray-700 mb-4 overflow-x-auto">
          <button type="button" class="tab-service shrink-0 px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent hover:text-purple-300 transition" data-tab="basic">
            📝 Info
          </button>
          ${id ? `
          <button type="button" class="tab-service shrink-0 px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 border-transparent hover:text-purple-300 transition" data-tab="packages">

    async function handleSvcImageFile(file) {
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) {
        Swal.fire({ icon: 'error', title: 'File too large', text: 'Maximum 10MB.', background: '#1e1e2a', color: '#fff' });
        return;
      }
      const dropLabel = document.getElementById('svcDropLabel');
      if (dropLabel) dropLabel.innerHTML = `<div class="flex items-center justify-center h-full gap-2 text-xs text-gray-400"><div class="spinner" style="width:18px;height:18px;border-width:2px"></div>Compressing…</div>`;
      const dataUrl = await compressImageFile(file, 1000, 0.82);
      document.getElementById('serviceFinalUrl').value = dataUrl;
      document.getElementById('svcDropLabel')?.classList.add('hidden');
      document.getElementById('svcImgThumb').src = dataUrl;
      document.getElementById('svcImgPreview').classList.remove('hidden');
    }

    function clearSvcImg() {

      document.getElementById('svcImgPreview').classList.add('hidden');
      const dropLabel = document.getElementById('svcDropLabel');

        dropLabel.classList.remove('hidden');
        dropLabel.innerHTML = `<i class="fas fa-images text-2xl text-gray-500 group-hover:text-purple-400 mb-1 transition"></i><p class="text-xs font-medium text-gray-300 group-hover:text-white">Tap to choose from gallery or storage</p><p class="text-xs text-gray-600 mt-0.5">or drag &amp; drop · auto-compressed</p>`;

    // ── Packages ───────────────────────────────────────────────
    //
    // Packages are rows with stable ids now. Everything below addresses a
    // package by id rather than by array position, which is what made
    // editPackage(2) mean "whatever happens to be third right now" and let a
    // reorder or a concurrent edit modify the wrong one.
    //
    // Every save is AWAITED and its result checked before the UI claims success.
    // The previous savePackage fired the request without awaiting, mutated the
    // local store, then re-rendered from that mutated copy and showed
    // "Package added!" — so a failed save was indistinguishable from a good one
    // until the page was reloaded.

    let editingPackageId = null;

    function packageFormHtml(pkg) {
      const featureText = (pkg && pkg.features ? pkg.features : []).join('\n');
      return '<div class="space-y-3">'
        + '<div><label class="block text-sm mb-1" for="packageName">Package name *</label>'
        + '<input type="text" id="packageName" value="' + escapeHtml(pkg && pkg.name || '') + '" maxlength="80"'
        + ' class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" placeholder="e.g. Standard, Premium, VIP">'
        + '<p class="pkg-err text-xs text-red-400 mt-1 hidden" data-for="name"></p></div>'
        + '<div class="grid grid-cols-2 gap-3">'
        + '<div><label class="block text-sm mb-1" for="packagePrice">Price (KES)</label>'
        + '<input type="number" id="packagePrice" min="0" step="500" value="' + (pkg && pkg.price != null ? pkg.price : '') + '"'
        + ' class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" placeholder="Leave blank to quote">'
        + '<p class="text-xs text-gray-600 mt-1">Blank shows "contact us for a quote".</p>'
        + '<p class="pkg-err text-xs text-red-400 mt-1 hidden" data-for="price"></p></div>'
        + '<div><label class="block text-sm mb-1" for="packageDuration">Duration</label>'
        + '<input type="text" id="packageDuration" value="' + escapeHtml(pkg && pkg.duration || '') + '" maxlength="60"'
        + ' class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" placeholder="e.g. 4 hours, Full day"></div>'
        + '</div>'
        + '<div><label class="block text-sm mb-1" for="packageFeatures">What is included — one per line</label>'
        + '<textarea id="packageFeatures" rows="5" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700">'
        + escapeHtml(featureText) + '</textarea></div>'
        + '<label class="flex items-center gap-2 cursor-pointer">'
        + '<input type="checkbox" id="packagePopular" class="accent-yellow-400" ' + (pkg && pkg.isPopular ? 'checked' : '') + '>'
        + '<span class="text-sm">Highlight as "most popular" <span class="text-gray-600 text-xs">(only one per service)</span></span></label>'
        + '<p class="text-xs text-gray-500 bg-gray-800/50 rounded-lg px-3 py-2">'
        + '<i class="fas fa-lightbulb text-yellow-400 mr-1"></i>Three tiers works well — a cheap entry point, the one you want them to pick, and a premium option.</p>'
        + '</div>';
    }

    function addPackage() {
      if (!currentEditId) {
        Swal.fire({ icon: 'info', title: 'Save the service first', text: 'A package has to belong to a saved service.', background: '#1e1e2a', color: '#fff' });
        return;
      }
      editingPackageId = null;
      document.getElementById('modalTitle').textContent = 'New package';
      document.getElementById('modalForm').innerHTML = packageFormHtml(null);
      document.getElementById('formModal').classList.remove('hidden');
    }

    function editPackage(pkgId) {
      const service = store.services.find(s => s.id === currentEditId);
      const pkg = ((service && service.packages) || []).find(p => p.id === pkgId);
      if (!pkg) return;
      editingPackageId = pkgId;
      document.getElementById('modalTitle').textContent = 'Edit package';
      document.getElementById('modalForm').innerHTML = packageFormHtml(pkg);
      document.getElementById('formModal').classList.remove('hidden');
    }

    async function deletePackage(pkgId) {
      const service = store.services.find(s => s.id === currentEditId);
      const pkg = ((service && service.packages) || []).find(p => p.id === pkgId);
      if (!pkg) return;

      const ok = await Swal.fire({
        title: 'Delete this package?',
        html: '<p style="color:#9ca3af">"' + escapeHtml(pkg.name) + '" will be removed from the website.</p>',
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
        confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff',
      });
      if (!ok.isConfirmed) return;

      const res = await apiRequest('DELETE', '/api/admin/packages/' + pkgId);
      if (res && res._error) {
        // 409 means a client actually chose this package. Offer the action that
        // keeps the sales record rather than pushing them to force it.
        const wantHide = await Swal.fire({
          icon: 'warning', title: 'Cannot delete', text: res.message,
          showCancelButton: true, confirmButtonText: 'Deactivate instead',
          background: '#1e1e2a', color: '#fff',
        });
        if (wantHide.isConfirmed) {
          await apiRequest('PUT', '/api/admin/packages/' + pkgId, { isActive: false });
          await refreshServicePackages(currentEditId);
          openServiceForm(currentEditId);
          showToast('Package deactivated', 'success');
        }
        return;
      }
      await refreshServicePackages(currentEditId);
      openServiceForm(currentEditId);
      showToast('Package deleted', 'success');
    }

    async function savePackage() {
      document.querySelectorAll('#modalForm .pkg-err').forEach(e => { e.textContent = ''; e.classList.add('hidden'); });

      const priceRaw = document.getElementById('packagePrice').value.trim();
      const payload = {
        name:      document.getElementById('packageName').value.trim(),
        price:     priceRaw === '' ? null : Number(priceRaw),
        duration:  document.getElementById('packageDuration').value.trim() || null,
        features:  document.getElementById('packageFeatures').value.split('\n').map(f => f.trim()).filter(Boolean),
        isPopular: document.getElementById('packagePopular').checked,
      };

      const btn = document.getElementById('saveModalBtn');
      btn.disabled = true; btn.textContent = 'Saving…';

      const res = editingPackageId
        ? await apiRequest('PUT',  '/api/admin/packages/' + editingPackageId, payload)
        : await apiRequest('POST', '/api/admin/services/' + currentEditId + '/packages', payload);

      btn.disabled = false; btn.textContent = 'Save';

      // Check the result before claiming it worked.
      if (res && res._error) {
        if (res.fields) {
          Object.entries(res.fields).forEach(([f, m]) => {
            const el = document.querySelector('#modalForm .pkg-err[data-for="' + f + '"]');
            if (el) { el.textContent = m; el.classList.remove('hidden'); }
          });
          return;
        }
        Swal.fire({ icon: 'error', title: 'Could not save', text: res.message, background: '#1e1e2a', color: '#fff' });
        return;
      }

      const wasEdit = !!editingPackageId;
      editingPackageId = null;
      closeModal();
      await refreshServicePackages(currentEditId);
      openServiceForm(currentEditId);
      showToast(wasEdit ? 'Package updated' : 'Package added', 'success');
    }

    // Re-reads packages for one service from the server rather than trusting the
    // local copy, so what the form shows is what was actually stored.
    async function refreshServicePackages(serviceId) {
      const res = await apiRequest('GET', '/api/admin/services/' + serviceId + '/packages');
      if (res && res._error) return;
      store.services = store.services.map(s =>
        s.id === serviceId ? Object.assign({}, s, { packages: res.data }) : s);
      servicePerf = null;   // readiness and "from price" have changed
    }

    async function deleteService(id) {
      const s = store.services.find(x => x.id === id);
      const ok = await Swal.fire({
        title: 'Delete this service?',
        html: '<p style="color:#9ca3af">"' + escapeHtml((s && s.name) || '') + '" and its packages would be removed.</p>',
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
        confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff',
      });
      if (!ok.isConfirmed) return;

      const res = await apiRequest('DELETE', '/api/admin/services/' + id);
      if (res && res._error) {
        const wantHide = await Swal.fire({
          icon: 'warning', title: 'Cannot delete', text: res.message,
          showCancelButton: true, confirmButtonText: 'Hide it instead',
          background: '#1e1e2a', color: '#fff',
        });
        if (wantHide.isConfirmed) await toggleServiceActive(id);
        return;
      }
      store.services = store.services.filter(x => x.id !== id);
      servicePerf = null;
      renderServices();
      showToast('Service deleted', 'success');
    }

    function addFeature() {
      document.getElementById('modalTitle').textContent = 'New feature';
      document.getElementById('modalForm').innerHTML = `
        <div class="space-y-3">
