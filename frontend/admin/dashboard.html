                    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800 hover:border-purple-500 transition">
                        <div class="flex justify-between items-start flex-wrap gap-3">
                            <div class="flex-1">
                                <div class="flex gap-2 mb-2 flex-wrap">
                                    <span class="px-2 py-1 rounded-full text-xs ${banner.isActive ? 'bg-green-600/20 text-green-400' : 'bg-red-600/20 text-red-400'}">
                                        ${banner.isActive ? '🟢 Active' : '⚫ Inactive'}
                                    </span>
                                    ${banner.endDate && banner.endDate < now ? '<span class="px-2 py-1 rounded-full text-xs bg-gray-600/20 text-gray-400">⏰ Expired</span>' : ''}
                                    <span class="text-xs text-gray-500">📢 ${banner.type || 'banner'}</span>
                                </div>
                                <p class="font-medium text-lg">${escapeHtml(banner.message)}</p>
                                <div class="flex gap-3 mt-2 flex-wrap">
                                    <span class="text-xs text-gray-500"><i class="fas fa-hand-pointer mr-1"></i> CTA: ${escapeHtml(banner.ctaText)} → ${escapeHtml(banner.ctaLink)}</span>
                                    <span class="text-xs text-gray-500"><i class="far fa-calendar-alt mr-1"></i> ${banner.startDate || 'Start now'} → ${banner.endDate || 'No expiry'}</span>
                                </div>
                                ${banner.views > 0 ? `<div class="mt-2 text-xs text-gray-500"><i class="fas fa-chart-line mr-1"></i> Views: ${banner.views} | Clicks: ${banner.clicks || 0} | CTR: ${banner.ctr || 0}%</div>` : ''}
                            </div>
                            <div class="flex gap-2 flex-wrap">
                                <button onclick="toggleMarketingBanner('${banner.id}')" class="px-3 py-1 ${banner.isActive ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-green-600 hover:bg-green-700'} rounded-lg text-sm transition">
                                    ${banner.isActive ? 'Deactivate' : 'Activate'}
                                </button>
                                <button onclick="openMarketingForm('${banner.id}')" class="px-3 py-1 bg-purple-600 hover:bg-purple-700 rounded-lg text-sm transition">
                                    <i class="fas fa-edit mr-1"></i>Edit
                                </button>
                                <button onclick="duplicateMarketingBanner('${banner.id}')" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm transition">
                                    <i class="fas fa-copy mr-1"></i>Duplicate
                                </button>
                                <button onclick="deleteMarketingBanner('${banner.id}')" class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded-lg text-sm transition">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        `}
    `;
}

function setMarketingView(mode) {
    marketingViewMode = mode;
    renderMarketing();
}

function openMarketingForm(id) {
    const banner = id ? store.marketingBanners.find(b => b.id === id) : null;
    currentEditId = banner?.id || null;
    document.getElementById('modalTitle').textContent = banner ? 'Edit Marketing Banner' : 'Create Marketing Banner';
    document.getElementById('modalForm').innerHTML = `
        <div><label class="block text-sm mb-1">Banner Name (internal)</label><input type="text" id="bannerName" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" placeholder="e.g., April Special" value="${escapeHtml(banner?.name || '')}"></div>
        <div><label class="block text-sm mb-1">Message *</label><textarea id="bannerMessage" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" rows="2" required placeholder="🎉 Special offer...">${escapeHtml(banner?.message || '')}</textarea></div>
        <div><label class="block text-sm mb-1">CTA Button Text</label><input type="text" id="bannerCtaText" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" value="${escapeHtml(banner?.ctaText || 'Learn More')}"></div>
        <div><label class="block text-sm mb-1">CTA Link</label><input type="text" id="bannerCtaLink" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" value="${escapeHtml(banner?.ctaLink || '/booking.html')}"></div>
        <div><label class="block text-sm mb-1">Start Date</label><input type="date" id="bannerStartDate" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" value="${banner?.startDate || new Date().toISOString().split('T')[0]}"></div>
        <div><label class="block text-sm mb-1">End Date (optional)</label><input type="date" id="bannerEndDate" class="w-full px-4 py-2 bg-gray-800 rounded-lg border border-gray-700" value="${banner?.endDate || ''}"></div>
        <div><label class="flex items-center gap-2"><input type="checkbox" id="bannerActive" ${(banner ? banner.isActive : true) ? 'checked' : ''}> <span class="text-sm">Active</span></label></div>
    `;
    document.getElementById('formModal').classList.remove('hidden');
}

async function saveMarketingBanner() {
    const msg = document.getElementById('bannerMessage').value?.trim();
    if (!msg) { Swal.fire({ icon: 'warning', title: 'Message required', background: '#1e1e2a', color: '#fff' }); return; }
    const payload = {
        type: 'banner',
        name: document.getElementById('bannerName').value || 'Unnamed',
        message: msg,
        ctaText: document.getElementById('bannerCtaText').value || 'Learn More',
        ctaLink: document.getElementById('bannerCtaLink').value || '/booking.html',
        isActive: document.getElementById('bannerActive').checked,
        startDate: document.getElementById('bannerStartDate').value || null,
        endDate: document.getElementById('bannerEndDate').value || null,
        priority: 0
    };
    const isEdit = !!currentEditId;
    const result = isEdit
        ? await apiRequest('PUT', '/api/admin/banners/' + currentEditId, payload)
        : await apiRequest('POST', '/api/admin/banners', payload);
    if (!result?.data) {
        const detail = result?._error ? result.message + (result.status ? ' (HTTP ' + result.status + ')' : '') : 'Unexpected response';
        Swal.fire({ icon: 'error', title: 'Failed to Save Banner', html: '<p>' + detail + '</p><p class="text-sm text-gray-400 mt-2">Check Vercel env vars: SUPABASE_URL, SUPABASE_SERVICE_KEY</p>', background: '#1e1e2a', color: '#fff' });
        return;
    }
    if (!store.marketingBanners) store.marketingBanners = [];
    if (isEdit) {
        const idx = store.marketingBanners.findIndex(b => b.id === currentEditId);
        if (idx > -1) store.marketingBanners[idx] = result.data;
    } else {
        store.marketingBanners.unshift(result.data);
    }
    closeModal();
    renderMarketing();
    Swal.fire({ icon: 'success', title: isEdit ? 'Banner Updated!' : 'Banner Created!', text: isEdit ? 'Changes saved.' : 'Your banner is now live on the homepage', timer: 2000, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
}

function toggleMarketingBanner(id) {
    if (!store.marketingBanners.find(b => b.id === id)) return;
    store.marketingBanners = store.marketingBanners.map(b => b.id === id ? { ...b, isActive: !b.isActive } : b);
    apiRequest('PATCH', `/api/admin/banners/${id}/toggle`);
    renderMarketing();
}

async function deleteMarketingBanner(id) {
    const result = await Swal.fire({ title: 'Delete banner?', text: 'This action cannot be undone', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff' });
    if (result.isConfirmed) {
        store.marketingBanners = store.marketingBanners.filter(b => b.id !== id);
        await apiRequest('DELETE', `/api/admin/banners/${id}`);
        renderMarketing();
        Swal.fire({ icon: 'success', title: 'Deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
    }
}

function duplicateMarketingBanner(id) {
    const original = store.marketingBanners.find(b => b.id === id);
    if (!original) return;
    
    const duplicated = {
        ...original,
        id: Date.now().toString(),
        name: `${original.name} (Copy)`,
        isActive: false,
        createdAt: new Date().toISOString()
    };
    
    store.marketingBanners.push(duplicated);
    apiRequest('POST', '/api/admin/banners', duplicated);
    renderMarketing();
    Swal.fire({ icon: 'success', title: 'Banner Duplicated!', text: 'Edit the copy to activate it', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
}

    // ==================== ENQUIRIES ====================
    // Every enquiry from the public site lands here. This is the team's inbox,
    // so it is built around the two questions they actually ask: "what is new?"
    // and "what is late?" — not around the shape of the database table.

    let enquirySearch = '';
    let enquiryStatus = 'all';
    let enquirySort   = 'newest';

    const SLA_HOURS = 2;   // the response time promised on the public site

    // ---- derived helpers ----
    function enquiryAgeMs(b) {
      const t = new Date(b.createdAt || b.eventDate || Date.now()).getTime();
      return isNaN(t) ? 0 : Date.now() - t;
    }

    function humanAge(ms) {
      const m = Math.floor(ms / 60000);
      if (m < 1)  return 'just now';
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      const d = Math.floor(h / 24);
      return d < 30 ? d + 'd ago' : Math.floor(d / 30) + 'mo ago';
    }

    // Only pending enquiries can breach the SLA — once someone has actioned it,
    // the clock has served its purpose.
    function slaState(b) {
      if (b.status !== 'pending') return 'done';
      return enquiryAgeMs(b) > SLA_HOURS * 3600000 ? 'overdue' : 'ok';
    }

    function daysUntilEvent(b) {
      if (!b.eventDate) return null;
      const d = new Date(b.eventDate + 'T00:00:00');
      if (isNaN(d)) return null;
      return Math.ceil((d - new Date().setHours(0,0,0,0)) / 86400000);
    }

    function servicesText(b) {
      if (!b.services) return '';
      return Array.isArray(b.services) ? b.services.join(', ') : String(b.services);
    }

    // ---- filtering / sorting ----
    function visibleEnquiries() {
      const q = enquirySearch.trim().toLowerCase();
      let list = store.bookings.filter(b => {
        if (enquiryStatus !== 'all' && b.status !== enquiryStatus) return false;
        if (!q) return true;
        // Search everything the team might have to hand: a client says "I'm
        // Jane", or reads out a reference, or only the phone number is known.
        return [b.name, b.phone, b.email, b.bookingReference, b.venue, b.eventType, servicesText(b)]
          .filter(Boolean).join(' ').toLowerCase().includes(q);
      });

      const by = {
        newest:    (a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0),
        oldest:    (a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0),
        eventDate: (a, b) => (a.eventDate || '9999').localeCompare(b.eventDate || '9999'),
        name:      (a, b) => (a.name || '').localeCompare(b.name || ''),
      };
      return list.sort(by[enquirySort] || by.newest);
    }

    // ---- toolbar / header (shared by both views) ----
    function enquiryHeader() {
      const all       = store.bookings;
      const pending   = all.filter(b => b.status === 'pending');
      const overdue   = pending.filter(b => slaState(b) === 'overdue');
      const counts    = {
        all: all.length,
        pending:   pending.length,
        confirmed: all.filter(b => b.status === 'confirmed').length,
        completed: all.filter(b => b.status === 'completed').length,
        cancelled: all.filter(b => b.status === 'cancelled').length,
      };

      const chip = (key, label) => `
        <button onclick="setEnquiryStatus('${key}')"
                aria-pressed="${enquiryStatus === key}"
                class="px-3 py-1.5 rounded-full text-xs font-semibold transition border ${
                  enquiryStatus === key
                    ? 'bg-purple-600 border-purple-500 text-white'
                    : 'bg-gray-900 border-gray-700 text-gray-400 hover:border-gray-600 hover:text-gray-200'}">
          ${label} <span class="opacity-70">${counts[key] ?? 0}</span>
        </button>`;

      return `
        <div class="flex flex-wrap items-start justify-between gap-4 mb-5">
          <div>
            <h2 class="text-xl font-bold flex items-center gap-2">📥 Enquiries
              <span class="text-sm text-gray-400 font-normal">(${counts.all} total)</span>
            </h2>
            <div class="flex flex-wrap items-center gap-3 mt-1.5 text-sm">
              ${counts.pending > 0
                ? `<span class="text-yellow-400 font-medium"><i class="fas fa-inbox mr-1"></i>${counts.pending} awaiting response</span>`
                : `<span class="text-green-400 font-medium"><i class="fas fa-check-circle mr-1"></i>All caught up</span>`}
              ${overdue.length > 0
                ? `<span class="text-red-400 font-semibold px-2 py-0.5 bg-red-500/10 border border-red-500/30 rounded-full">
                     <i class="fas fa-triangle-exclamation mr-1"></i>${overdue.length} past the ${SLA_HOURS}h promise
                   </span>` : ''}
            </div>
          </div>
          <div class="flex gap-2">
            <button onclick="exportEnquiriesCsv()" class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 text-gray-300 hover:bg-gray-700 transition" title="Download the filtered list as a spreadsheet">
              <i class="fas fa-file-csv mr-1"></i> Export
            </button>
            <button onclick="setBookingView('table')" aria-pressed="${bookingViewMode === 'table'}"
              class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${bookingViewMode === 'table' ? 'bg-purple-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}">≡ Table</button>
            <button onclick="setBookingView('pipeline')" aria-pressed="${bookingViewMode === 'pipeline'}"
              class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${bookingViewMode === 'pipeline' ? 'bg-purple-600 text-white' : 'bg-gray-800 text-gray-400 hover:bg-gray-700'}">⬛ Pipeline</button>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-3 mb-5">
          <div class="relative flex-1 min-w-[220px]">
            <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm" aria-hidden="true"></i>
            <input id="enquirySearchInput" type="search" value="${escapeHtml(enquirySearch)}"
                   placeholder="Search name, phone, email, reference, venue…"
                   aria-label="Search enquiries"
                   class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-9 pr-3 py-2 text-sm focus:border-purple-500 focus:outline-none">
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${chip('all','All')}${chip('pending','New')}${chip('confirmed','Confirmed')}${chip('completed','Completed')}${chip('cancelled','Cancelled')}
          </div>
          <select id="enquirySortSelect" aria-label="Sort enquiries"
                  class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-purple-500 focus:outline-none">
            <option value="newest"    ${enquirySort==='newest'?'selected':''}>Newest first</option>
            <option value="oldest"    ${enquirySort==='oldest'?'selected':''}>Oldest first</option>
            <option value="eventDate" ${enquirySort==='eventDate'?'selected':''}>Event date</option>
            <option value="name"      ${enquirySort==='name'?'selected':''}>Client name</option>
          </select>
        </div>`;
    }

    // Re-attach toolbar listeners after every re-render. Search keeps focus and
    // caret position so typing is never interrupted by the list refreshing.
    function wireEnquiryToolbar() {
      const search = document.getElementById('enquirySearchInput');
      if (search) {
        search.addEventListener('input', (e) => {
          enquirySearch = e.target.value;
          const pos = e.target.selectionStart;
          renderBookings();
          const again = document.getElementById('enquirySearchInput');
          if (again) { again.focus(); again.setSelectionRange(pos, pos); }
        });
      }
      const sort = document.getElementById('enquirySortSelect');
      if (sort) sort.addEventListener('change', (e) => { enquirySort = e.target.value; renderBookings(); });
    }

    function setEnquiryStatus(status) { enquiryStatus = status; renderBookings(); }

    function emptyState(hasAnyAtAll) {
      // A blank table is ambiguous — it could mean "no results" or "broken".
      // Say which, and offer the way out.
      return hasAnyAtAll ? `
        <div class="text-center py-16">
          <i class="fas fa-filter text-4xl text-gray-700 mb-3"></i>
          <p class="text-gray-400 font-medium">No enquiries match your filters</p>
          <button onclick="clearEnquiryFilters()" class="mt-3 text-purple-400 text-sm hover:underline">Clear filters</button>
        </div>` : `
        <div class="text-center py-16">
          <i class="fas fa-inbox text-4xl text-gray-700 mb-3"></i>
          <p class="text-gray-300 font-medium">No enquiries yet</p>
          <p class="text-gray-500 text-sm mt-1 max-w-sm mx-auto">When someone submits the booking form on your website, it will appear here instantly.</p>
          <a href="../booking.html" target="_blank" rel="noopener" class="inline-block mt-4 text-purple-400 text-sm hover:underline">Open the booking form →</a>
        </div>`;
    }

    function clearEnquiryFilters() { enquirySearch = ''; enquiryStatus = 'all'; renderBookings(); }

    // ---- table view ----
    function renderBookings() {
      if (bookingViewMode === 'pipeline') { renderBookingPipeline(); return; }
      const container = document.getElementById('sectionContent');
      const list = visibleEnquiries();

      const rows = list.map(b => {
        const sla   = slaState(b);
        const days  = daysUntilEvent(b);
        const soon  = days !== null && days >= 0 && days <= 14;
        const past  = days !== null && days < 0;
        return `
        <tr class="table-row border-t border-gray-800 ${sla === 'overdue' ? 'bg-red-500/[0.04]' : ''}">
          <td class="px-4 py-3">
            <span class="text-xs font-mono text-gray-400">${escapeHtml(b.bookingReference || (b.id||'').slice(0,8))}</span>
            ${sla === 'overdue' ? '<span class="ml-1.5 text-[10px] font-bold text-red-400 bg-red-500/15 px-1.5 py-0.5 rounded">LATE</span>' : ''}
          </td>
          <td class="px-4 py-3">
            <p class="font-medium text-white">${escapeHtml(b.name)}</p>
            <p class="text-xs text-gray-500">${escapeHtml(b.phone || '')}</p>
          </td>
          <td class="px-4 py-3">
            <p class="text-sm">${escapeHtml(b.eventType || '—')}</p>
            <p class="text-xs text-gray-500 truncate max-w-[180px]" title="${escapeHtml(servicesText(b))}">${escapeHtml(servicesText(b) || '—')}</p>
          </td>
          <td class="px-4 py-3 text-sm">
            ${b.eventDate ? new Date(b.eventDate).toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' }) : '—'}
            ${soon ? `<span class="block text-[11px] text-yellow-400 font-medium">in ${days} day${days===1?'':'s'}</span>` : ''}
            ${past ? '<span class="block text-[11px] text-gray-600">past</span>' : ''}
          </td>
          <td class="px-4 py-3 text-sm text-gray-300">${escapeHtml(b.budget || '—')}</td>
          <td class="px-4 py-3">
            <span class="text-xs ${sla === 'overdue' ? 'text-red-400 font-semibold' : 'text-gray-500'}">${humanAge(enquiryAgeMs(b))}</span>
          </td>
          <td class="px-4 py-3">
            <select onchange="updateBookingStatus('${b.id}', this.value)" aria-label="Status for ${escapeHtml(b.name)}"
                    class="bg-gray-800 rounded-lg px-2 py-1 text-xs border border-gray-700 focus:border-purple-500 focus:outline-none">
              <option value="pending"   ${b.status==='pending'?'selected':''}>New</option>
              <option value="confirmed" ${b.status==='confirmed'?'selected':''}>Confirmed</option>
              <option value="completed" ${b.status==='completed'?'selected':''}>Completed</option>
              <option value="cancelled" ${b.status==='cancelled'?'selected':''}>Cancelled</option>
            </select>
          </td>
          <td class="px-4 py-3">
            <div class="flex gap-1">
              <button onclick="openEnquiry('${b.id}')" class="text-purple-400 hover:text-purple-300 px-2 py-1 rounded hover:bg-purple-600/10 transition" title="Open enquiry" aria-label="Open enquiry from ${escapeHtml(b.name)}"><i class="fas fa-eye"></i></button>
              <a href="tel:${encodeURIComponent(b.phone||'')}" class="text-green-400 hover:text-green-300 px-2 py-1 rounded hover:bg-green-600/10 transition inline-block" title="Call ${escapeHtml(b.name)}" aria-label="Call ${escapeHtml(b.name)}"><i class="fas fa-phone"></i></a>
              <button onclick="deleteBooking('${b.id}')" class="text-red-400 hover:text-red-300 px-2 py-1 rounded hover:bg-red-600/10 transition" title="Delete enquiry" aria-label="Delete enquiry from ${escapeHtml(b.name)}"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>`;
      }).join('');

      container.innerHTML = enquiryHeader() + (list.length === 0
        ? `<div class="bg-gray-900 rounded-xl border border-gray-800">${emptyState(store.bookings.length > 0)}</div>`
        : `<div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
             <div class="overflow-x-auto table-responsive">
               <table class="w-full">
                 <caption class="sr-only">Enquiries received from the website</caption>
                 <thead class="bg-gray-800/50"><tr>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Reference</th>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Client</th>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Event &amp; services</th>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Event date</th>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Budget</th>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Received</th>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Status</th>
                   <th scope="col" class="px-4 py-3 text-left text-xs font-semibold text-gray-400">Actions</th>
                 </tr></thead>
                 <tbody>${rows}</tbody>
               </table>
             </div>
             <div class="px-4 py-3 border-t border-gray-800 text-xs text-gray-500">
               Showing ${list.length} of ${store.bookings.length} enquiries
             </div>
           </div>`);

      wireEnquiryToolbar();
    }

    function setBookingView(mode) { bookingViewMode = mode; renderBookings(); }

    // ---- CSV export ----
    function exportEnquiriesCsv() {
      const list = visibleEnquiries();
      if (!list.length) { Swal.fire({ icon:'info', title:'Nothing to export', text:'No enquiries match the current filters.', background:'#1e1e2a', color:'#fff' }); return; }
      const cols = [
        ['Reference','bookingReference'], ['Name','name'], ['Phone','phone'], ['Email','email'],
        ['Event type','eventType'], ['Event date','eventDate'], ['Guests','guestCount'],
        ['Budget','budget'], ['Venue','venue'], ['Status','status'], ['Heard via','source'],
        ['Came from','channel'], ['Received','createdAt'],
      ];
      // Prefix formula characters — a cell starting with = or + is executed by
      // Excel on open, which is a real injection vector for user-supplied text.
      const cell = (v) => {
        let s = v == null ? '' : String(v);
        if (/^[=+\-@]/.test(s)) s = "'" + s;
        return '"' + s.replace(/"/g, '""') + '"';
      };
      const csv = [
        cols.map(c => cell(c[0])).concat(cell('Services'), cell('Special requests'), cell('Internal notes')).join(','),
        ...list.map(b => cols.map(c => cell(b[c[1]]))
          .concat(cell(servicesText(b)), cell(b.specialRequests), cell(b.notes)).join(',')),
      ].join('\r\n');

      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `lawie-enquiries-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ---- mutations ----
    // Optimistic update with rollback. The previous version fired the request
    // and reported success unconditionally, so a failed save looked identical
    // to a successful one and the UI silently drifted from the database.
    async function updateBookingStatus(id, status) {
      const before = store.bookings.find(b => b.id === id);
      if (!before || before.status === status) return;

      store.bookings = store.bookings.map(b => b.id === id ? { ...b, status } : b);
      updateStats(); updateNotifBadge(); renderBookings();

      const result = await apiRequest('PATCH', `/api/admin/bookings/${id}/status`, { status });

      if (result?._error) {
        store.bookings = store.bookings.map(b => b.id === id ? before : b);   // roll back
        updateStats(); updateNotifBadge(); renderBookings();
        Swal.fire({ icon: 'error', title: 'Could not update status', text: result.message, background: '#1e1e2a', color: '#fff' });
        return;
      }
      if (result?.data) store.bookings = store.bookings.map(b => b.id === id ? result.data : b);
      showToast(`Marked as ${status}`, 'success');
    }

    async function deleteBooking(id) {
      const b = store.bookings.find(x => x.id === id);
      const { isConfirmed } = await Swal.fire({
        title: 'Delete this enquiry?',
        html: `<p style="color:#d1d5db">This permanently removes the enquiry from <strong>${escapeHtml(b?.name || 'this client')}</strong>.<br><br>Consider marking it <em>Cancelled</em> instead — that keeps the record for your reports.</p>`,
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
        confirmButtonText: 'Delete permanently', cancelButtonText: 'Keep it',
        background: '#1e1e2a', color: '#fff'
      });
      if (!isConfirmed) return;
      const result = await apiRequest('DELETE', `/api/admin/bookings/${id}`);
      if (result?._error) { Swal.fire({ icon: 'error', title: 'Delete failed', text: result.message, background: '#1e1e2a', color: '#fff' }); return; }
      store.bookings = store.bookings.filter(x => x.id !== id);
      updateStats(); updateNotifBadge(); renderBookings();
      showToast('Enquiry deleted', 'info');
    }

    // ---- detail drawer ----
    // A side drawer rather than a modal: it is wide enough for the full enquiry
    // plus contact actions, and it does not shrink to a scrollbar on a phone the
    // way the old SweetAlert dialog did.
    function ensureEnquiryDrawer() {
      let el = document.getElementById('enquiryDrawer');
      if (el) return el;
      el = document.createElement('div');
      el.id = 'enquiryDrawer';
      el.className = 'fixed inset-0 z-50 hidden';
      el.innerHTML = `
        <div id="enquiryBackdrop" class="absolute inset-0 bg-black/70"></div>
        <aside role="dialog" aria-modal="true" aria-labelledby="enquiryDrawerTitle"
               class="absolute right-0 top-0 h-full w-full sm:max-w-lg bg-gray-900 border-l border-gray-800 shadow-2xl flex flex-col">
          <header class="px-5 py-4 border-b border-gray-800 flex items-start justify-between gap-3 flex-shrink-0">
            <div>
              <h3 id="enquiryDrawerTitle" class="text-lg font-bold">Enquiry</h3>
              <p id="enquiryDrawerRef" class="text-xs font-mono text-gray-500 mt-0.5"></p>
            </div>
            <button id="enquiryDrawerClose" class="text-gray-400 hover:text-white text-2xl leading-none px-2" aria-label="Close">&times;</button>
          </header>
          <div id="enquiryDrawerBody" class="flex-1 overflow-y-auto px-5 py-4"></div>
        </aside>`;
      document.body.appendChild(el);
      el.querySelector('#enquiryBackdrop').addEventListener('click', closeEnquiry);
      el.querySelector('#enquiryDrawerClose').addEventListener('click', closeEnquiry);
      return el;
    }

    let _enquiryLastFocus = null;

    function closeEnquiry() {
      const el = document.getElementById('enquiryDrawer');
      if (el) el.classList.add('hidden');
      document.body.style.overflow = '';
      // Return focus to whatever opened the drawer — losing focus to <body> is
      // disorienting for keyboard and screen-reader users.
      if (_enquiryLastFocus && document.contains(_enquiryLastFocus)) _enquiryLastFocus.focus();
    }

    // ==================== ENQUIRY MONEY ====================
    //
    // Every revenue figure in Analytics is built from these two inputs, so the
    // place to capture them is where the manager already is when the deal
    // closes — not a separate finance screen they would have to remember to
    // visit. One number to agree, then a row per payment as it arrives.

    const KES = (n) => 'KES ' + Number(n || 0).toLocaleString('en-KE', { maximumFractionDigits: 0 });

    const PAYMENT_METHODS = [
      { v: 'mpesa',  l: 'M-Pesa' }, { v: 'cash', l: 'Cash' },
      { v: 'bank',   l: 'Bank transfer' }, { v: 'cheque', l: 'Cheque' },
      { v: 'other',  l: 'Other' },
    ];

    async function renderEnquiryMoney(bookingId) {
      const host = document.getElementById('enquiryMoney');
      if (!host) return;
      const b = store.bookings.find(x => x.id === bookingId);
      if (!b) return;

      host.innerHTML = `<p class="text-xs text-gray-600"><i class="fas fa-spinner fa-spin mr-1"></i>Loading payments…</p>`;

      const res = await apiRequest('GET', `/api/admin/bookings/${bookingId}/payments`);
      // Managers are blocked from financial endpoints server-side. Say so
      // plainly rather than rendering an empty panel that looks broken.
      if (res?._error) {
        host.innerHTML = res.status === 403
          ? `<p class="text-xs text-gray-600"><i class="fas fa-lock mr-1"></i>Payment details are visible to the administrator only.</p>`
          : `<p class="text-xs text-red-400">Could not load payments: ${escapeHtml(res.message || '')}</p>`;
        return;
      }

      const payments  = res.data || [];
      const collected = payments.reduce((s, p) => s + Number(p.amount || 0), 0);
      const agreed    = b.agreedAmount;
      const balance   = agreed === null || agreed === undefined ? null : agreed - collected;
      const pct       = agreed ? Math.min(100, Math.round((collected / agreed) * 100)) : 0;

      host.innerHTML = `
        <h4 class="text-xs text-gray-400 font-semibold mb-2 flex items-center gap-1.5">
          <i class="fas fa-coins text-yellow-500"></i> Money
        </h4>

        <div class="bg-gray-800/60 border border-gray-700 rounded-xl p-3.5 space-y-3">

          <!-- Agreed amount. Named "agreed", not "budget": the budget bracket is
               what the client guessed before we quoted. Analytics used to treat
               the bracket midpoint as revenue, which is why this field exists. -->
          <div>
            <label for="enqAgreedAmount" class="block text-xs text-gray-400 mb-1">
              Agreed price <span class="text-gray-600">(what they will pay us, in KES)</span>
            </label>
            <div class="flex gap-2">
              <input type="number" id="enqAgreedAmount" min="0" step="500" inputmode="numeric"
                value="${agreed ?? ''}" placeholder="e.g. 65000"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-yellow-500 focus:outline-none">
              <button type="button" onclick="saveAgreedAmount('${b.id}')"
                class="px-3 py-2 bg-yellow-600 hover:bg-yellow-500 text-black rounded-lg text-sm font-bold transition">Save</button>
            </div>
            ${b.budget ? `<p class="text-xs text-gray-600 mt-1">Client's stated budget range: ${escapeHtml(b.budget)}</p>` : ''}
            <p id="enqAmountStatus" class="text-xs mt-1" role="status" aria-live="polite"></p>
          </div>

          ${agreed ? `
            <div class="pt-1">
              <div class="flex justify-between text-xs mb-1">
                <span class="text-gray-400">Collected</span>
                <span class="font-semibold ${balance === 0 ? 'text-green-400' : 'text-gray-200'}">
                  ${KES(collected)} of ${KES(agreed)}
                </span>
              </div>
              <div class="h-2 bg-gray-900 rounded-full overflow-hidden">
                <div class="h-2 rounded-full transition-all" style="width:${pct}%;background:${balance === 0 ? '#22c55e' : '#facc15'}"></div>
              </div>
              <p class="text-xs mt-1.5 ${balance > 0 ? 'text-yellow-400' : balance < 0 ? 'text-orange-400' : 'text-green-400'}">
                ${balance > 0 ? `${KES(balance)} still outstanding`
                  : balance < 0 ? `Overpaid by ${KES(Math.abs(balance))} — check the entries`
                  : 'Paid in full'}
              </p>
            </div>` : ''}

          ${payments.length ? `
            <div class="pt-1 space-y-1.5">
              ${payments.map(p => `
                <div class="flex items-center gap-2 text-xs bg-gray-900/70 rounded-lg px-2.5 py-2">
                  <span class="font-semibold text-green-400 w-24 flex-shrink-0">${KES(p.amount)}</span>
                  <span class="text-gray-400 flex-shrink-0">${escapeHtml((PAYMENT_METHODS.find(m => m.v === p.method) || {}).l || p.method)}</span>
                  <span class="text-gray-600 truncate">${p.reference ? escapeHtml(p.reference) + ' · ' : ''}${new Date(p.paidOn).toLocaleDateString('en-KE', { day:'numeric', month:'short', year:'numeric' })}</span>
                  <button type="button" onclick="deletePayment('${p.id}','${b.id}')" title="Remove this payment"
                    class="ml-auto flex-shrink-0 text-gray-600 hover:text-red-400 px-1">
                    <i class="fas fa-xmark"></i>
                  </button>
                </div>`).join('')}
            </div>` : ''}

          <!-- Recording a payment is only meaningful once there is a price to
               measure it against, so this stays hidden until then. -->
          ${agreed ? `
            <details class="pt-1">
              <summary class="text-xs text-yellow-500 cursor-pointer hover:text-yellow-400 select-none">
                <i class="fas fa-plus-circle mr-1"></i>Record a payment received
              </summary>
              <div class="mt-2.5 space-y-2">
                <div class="grid grid-cols-2 gap-2">
                  <input type="number" id="payAmount" min="1" step="500" inputmode="numeric" placeholder="Amount (KES)"
                    class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-green-500 focus:outline-none">
                  <input type="date" id="payDate" value="${new Date().toISOString().split('T')[0]}" max="${new Date().toISOString().split('T')[0]}"
                    class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-green-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                  <select id="payMethod" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-green-500 focus:outline-none">
                    ${PAYMENT_METHODS.map(m => `<option value="${m.v}">${m.l}</option>`).join('')}
                  </select>
                  <input type="text" id="payReference" placeholder="M-Pesa code (optional)" maxlength="40"
                    class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-green-500 focus:outline-none">
                </div>
                <button type="button" onclick="addPayment('${b.id}')"
                  class="w-full py-2 bg-green-600 hover:bg-green-500 rounded-lg text-sm font-semibold transition">
                  Add payment
                </button>
                <p id="payStatus" class="text-xs" role="status" aria-live="polite"></p>
              </div>
            </details>` : ''}
        </div>`;
    }

    async function saveAgreedAmount(bookingId) {
      const input  = document.getElementById('enqAgreedAmount');
      const status = document.getElementById('enqAmountStatus');
      const raw    = input.value.trim();

      status.textContent = 'Saving…';
      status.className   = 'text-xs mt-1 text-gray-500';

      const res = await apiRequest('PATCH', `/api/admin/bookings/${bookingId}/amount`,
        { agreedAmount: raw === '' ? null : Number(raw) });

      if (res?._error) {
        status.textContent = res.message || 'Could not save.';
        status.className   = 'text-xs mt-1 text-red-400';
        return;
      }
      store.bookings = store.bookings.map(x => x.id === bookingId ? res.data : x);
      status.textContent = raw === '' ? 'Cleared.' : 'Saved.';
      status.className   = 'text-xs mt-1 text-green-400';
      renderEnquiryMoney(bookingId);
      if (currentTab === 'bookings') renderBookings();
    }

    async function addPayment(bookingId) {
      const status = document.getElementById('payStatus');
      const amount = document.getElementById('payAmount').value;

      if (!amount || Number(amount) <= 0) {
        status.textContent = 'Enter the amount received.';
        status.className   = 'text-xs text-red-400';
        return;
      }
      status.textContent = 'Saving…';
      status.className   = 'text-xs text-gray-500';

      const res = await apiRequest('POST', `/api/admin/bookings/${bookingId}/payments`, {
        amount:    Number(amount),
        paidOn:    document.getElementById('payDate').value || null,
        method:    document.getElementById('payMethod').value,
        reference: document.getElementById('payReference').value.trim() || null,
      });

      if (res?._error) {
        // Field-level messages from the API are more useful than a generic
        // failure — a duplicate M-Pesa code in particular needs naming.
        status.textContent = res.fields ? Object.values(res.fields)[0] : (res.message || 'Could not save.');
        status.className   = 'text-xs text-red-400';
        return;
      }
      renderEnquiryMoney(bookingId);
      showToast('Payment recorded', 'success');
    }

    async function deletePayment(paymentId, bookingId) {
      const ok = await Swal.fire({
        title: 'Remove this payment?',
        text: 'It stops counting towards collected revenue. Use this to correct a mistake.',
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444',
        confirmButtonText: 'Remove', background: '#1e1e2a', color: '#fff',
      });
      if (!ok.isConfirmed) return;

      const res = await apiRequest('DELETE', `/api/admin/payments/${paymentId}`);
      if (res?._error) {
        Swal.fire({ icon: 'error', title: 'Could not remove', text: res.message, background: '#1e1e2a', color: '#fff' });
        return;
      }
      renderEnquiryMoney(bookingId);
      showToast('Payment removed', 'success');
    }

        <div class="mb-5">

    async function copyJobDesc() {

    function makeModalDraggable() { const modal = document.getElementById('formModal'); const modalHeader = modal?.querySelector('.modal-header'); if (!modalHeader) return; modalHeader.style.cursor = 'move'; modalHeader.style.userSelect = 'none'; modalHeader.addEventListener('mousedown', startDrag); document.addEventListener('mousemove', drag); document.addEventListener('mouseup', stopDrag); function startDrag(e) { if (e.target.closest('.modal-resize-handle')) return; isDragging = true; dragStartX = e.clientX - modal.offsetLeft; dragStartY = e.clientY - modal.offsetTop; modal.style.transition = 'none'; } function drag(e) { if (!isDragging) return; e.preventDefault(); let newLeft = e.clientX - dragStartX; let newTop = e.clientY - dragStartY; newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - modal.offsetWidth)); newTop = Math.max(0, Math.min(newTop, window.innerHeight - modal.offsetHeight)); modal.style.left = newLeft + 'px'; modal.style.top = newTop + 'px'; modal.style.right = 'auto'; modal.style.bottom = 'auto'; } function stopDrag() { isDragging = false; modal.style.transition = ''; } }
    function makeModalResizable() { const modal = document.getElementById('formModal'); const modalContent = modal?.querySelector('.bg-gray-900'); if (!modalContent) return; const resizeHandle = document.createElement('div'); resizeHandle.className = 'modal-resize-handle absolute bottom-0 right-0 w-4 h-4 cursor-se-resize bg-purple-500 rounded-bl-lg'; modalContent.style.position = 'relative'; modalContent.appendChild(resizeHandle); let isResizing = false; let startX, startY, startWidth, startHeight; resizeHandle.addEventListener('mousedown', (e) => { isResizing = true; startX = e.clientX; startY = e.clientY; startWidth = modalContent.offsetWidth; startHeight = modalContent.offsetHeight; e.preventDefault(); }); document.addEventListener('mousemove', (e) => { if (!isResizing) return; const newWidth = Math.max(400, Math.min(startWidth + (e.clientX - startX), window.innerWidth - 100)); const newHeight = Math.max(500, Math.min(startHeight + (e.clientY - startY), window.innerHeight - 100)); modalContent.style.width = newWidth + 'px'; modalContent.style.height = newHeight + 'px'; }); document.addEventListener('mouseup', () => { isResizing = false; }); }

    // Poster media helpers
    // Compress image file to JPEG data URL (max maxWidth px, quality 0–1)
    async function compressImageFile(file, maxWidth = 1200, quality = 0.82) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.naturalWidth, h = img.naturalHeight;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function _isVideoUrl(url) {
      if (!url) return false;
      return /\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(url) || /youtube\.com|youtu\.be|vimeo\.com/.test(url);
    }
    function _isYouTubeUrl(url) {
      return /youtube\.com\/watch\?v=|youtu\.be\//.test(url);
    }
    function _ytEmbedUrl(url) {
      const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
      return m ? `https://www.youtube.com/embed/${m[1]}?autoplay=0` : url;
    }
    function setPosterType(type) {
      const isVid = type === 'video';
      document.getElementById('typeImage').className = `flex-1 py-2 rounded-lg border text-sm font-medium transition ${!isVid ? 'bg-purple-600 border-purple-500 text-white' : 'bg-gray-800 border-gray-700 text-gray-400 hover:bg-gray-700'}`;
      document.getElementById('typeVideo').className = `flex-1 py-2 rounded-lg border text-sm font-medium transition ${isVid ? 'bg-purple-600 border-purple-500 text-white' : 'bg-gray-800 border-gray-700 text-gray-400 hover:bg-gray-700'}`;
      // Show/hide upload zone vs URL zone
      document.getElementById('mediaSrcToggle')?.classList.toggle('hidden', isVid);
      document.getElementById('posterUploadZone')?.classList.toggle('hidden', isVid);
      // For video always show URL zone; for image hide it (user toggled via setPosterSrc)
      const urlZone = document.getElementById('posterUrlZone');
      if (urlZone) urlZone.classList.toggle('hidden', !isVid);
      const label = document.getElementById('mediaUrlLabel');
      const hint = document.getElementById('mediaHint');
      const input = document.getElementById('posterImageUrl');
      if (label) label.textContent = isVid ? 'Video URL *' : 'Image URL *';
      if (hint) hint.textContent = isVid ? '✓ YouTube link or direct .mp4/.webm URL' : '✓ Imgur, Google Drive direct link, or your CDN';
      if (input) input.placeholder = isVid ? 'https://youtube.com/watch?v=... or .mp4 link' : 'https://i.imgur.com/... or direct image URL';
      // Clear final URL when switching to video so stale base64 isn't sent
      if (isVid) document.getElementById('posterFinalUrl').value = input?.value || '';
      updatePosterPreview();

    async function savePoster() {
      const title = document.getElementById('posterTitle').value;
      const imageUrl = (document.getElementById('posterFinalUrl')?.value || document.getElementById('posterImageUrl')?.value || '').trim();
      if (!title || !imageUrl) {
        Swal.fire({ icon: 'error', title: 'Missing Fields', text: 'Title and image URL are required', background: '#1e1e2a', color: '#fff' });
        return;
      }
      const payload = {
        title,
        imageUrl,
        caption: document.getElementById('posterCaption').value,
        startDate: document.getElementById('posterStartDate').value,
        endDate: document.getElementById('posterEndDate').value || null,
        displayOrder: parseInt(document.getElementById('posterOrder').value) || 1,
        isActive: document.getElementById('posterActive').checked,
      };

      const result = await apiRequest(
        currentEditId ? 'PUT' : 'POST',
        currentEditId ? `/api/admin/posters/${currentEditId}` : '/api/admin/posters',
        payload
      );

      if (!result?.data) {
        Swal.fire({ icon: 'error', title: 'Failed to Save Poster', text: result?._error ? result.message : 'Unexpected response from server', background: '#1e1e2a', color: '#fff' });
        return;
      }

      if (currentEditId) {
        store.posters = store.posters.map(p => p.id === currentEditId ? result.data : p);
      } else {
        store.posters.push(result.data);
      }

      closeModal();
      renderPosters();
      Swal.fire({ icon: 'success', title: currentEditId ? 'Poster Updated!' : 'Poster Added!', text: 'Changes are now live on the homepage', timer: 2000, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
    }

    async function togglePoster(id) {
      const poster = store.posters.find(p => p.id === id);
      if (!poster) return;
      store.posters = store.posters.map(p => p.id === id ? { ...p, isActive: !p.isActive } : p);
      await apiRequest('PATCH', `/api/admin/posters/${id}/toggle`);
      renderPosters();
    }

    async function deletePoster(id) {
      const result = await Swal.fire({ title: 'Delete poster?', text: 'This will remove it from the homepage', icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Delete', background: '#1e1e2a', color: '#fff' });
      if (result.isConfirmed) {
        store.posters = store.posters.filter(p => p.id !== id);
        await apiRequest('DELETE', `/api/admin/posters/${id}`);
        renderPosters();
        Swal.fire({ icon: 'success', title: 'Deleted!', timer: 1500, showConfirmButton: false, background: '#1e1e2a', color: '#fff' });
      }
    }

    function renderBeta() {

      const statusCfg = {

      const visibleFeatures = BETA_FEATURES.filter(f => isAdmin || !f.adminOnly);

      const cards = visibleFeatures.map(f => {

          <div class="bg-gray-900 border border-gray-700 rounded-2xl overflow-hidden">

                { q:'Will my changes break the website?', a:'No. All changes through this dashboard are safe. You can always undo — delete something, change a status, or re-upload. Nothing in the dashboard can take the website offline.' },
                { q:'How long before my changes appear on the website?', a:'Immediately. As soon as you save a service, gallery photo, or banner, it appears on your live website within seconds.' },

    }

    // ==================== ANALYTICS ====================
    //
    // A business tool, so it answers business questions in the order an owner
    // asks them: did money come in, is that better or worse than last period,
    // and what should I do about it.
    //
    // Two things this deliberately does NOT do:
    //
    //  1. No composite "health score". The previous version blended conversion,
    //     ratings, content counts and cancellations into one percentage. With a
    //     single booking and zero reviews it reported 90% "Healthy", and it
    //     could not fall below roughly 55% no matter how the business did -
    //     partly because it substituted 4 stars when there were no reviews at
    //     all. A number that cannot go down carries no information, and a
    //     blended one hides which lever to pull.
    //
    //  2. No maths in the browser. Every figure comes from the
    //     analytics_summary() SQL function in one call, so the numbers do not
    //     depend on which pages the client happened to load, and there is one
    //     definition of "revenue" rather than one per screen.

    let analyticsCharts = [];
    let analyticsData   = null;
    let analyticsTimer  = null;

    const analyticsUI = {
      preset: '30d',
      from:   null,
      to:     null,
    };

    const ANALYTICS_PRESETS = {
      '7d':   { label: 'Last 7 days',   days: 7 },
      '30d':  { label: 'Last 30 days',  days: 30 },
      '90d':  { label: 'Last 90 days',  days: 90 },
      '365d': { label: 'Last 12 months', days: 365 },
    };

    function destroyAnalyticsCharts() {
      analyticsCharts.forEach(c => { try { c.destroy(); } catch (_) {} });
      analyticsCharts = [];
      if (analyticsTimer) { clearInterval(analyticsTimer); analyticsTimer = null; }
    }

    function analyticsRange() {
      if (analyticsUI.preset === 'custom' && analyticsUI.from && analyticsUI.to) {
        return { from: analyticsUI.from, to: analyticsUI.to };
      }
      const days = ANALYTICS_PRESETS[analyticsUI.preset]?.days || 30;
      const to   = new Date();
      const from = new Date(); from.setDate(from.getDate() - (days - 1));
      const iso  = d => d.toISOString().split('T')[0];
      return { from: iso(from), to: iso(to) };
    }

    // Percentage change against the previous equal-length window.
    //
    // Growth from zero is the case everyone gets wrong. There is no meaningful
    // percentage increase from nothing, and printing "+100%" or "+Infinity%"
    // both mislead — so we return null and the UI shows "new" instead.
    function pctChange(current, previous) {
      const c = Number(current) || 0, p = Number(previous) || 0;
      if (p === 0) return c === 0 ? 0 : null;
      return ((c - p) / p) * 100;
    }

    // A delta chip. `goodIsUp` is explicit because for costs and for response
    // time, down is the good direction — colouring purely by sign would tell
    // the manager that rising costs are good news.
    function deltaChip(current, previous, { goodIsUp = true, suffix = '' } = {}) {
      const pct = pctChange(current, previous);
      if (pct === null) {
        return `<span class="text-xs px-1.5 py-0.5 rounded bg-blue-500/15 text-blue-400 font-semibold">new</span>`;
      }
      if (Math.round(Math.abs(pct)) === 0) {
        return `<span class="text-xs text-gray-500">no change</span>`;
      }
      const up   = pct > 0;
      const good = up === goodIsUp;
      const cls  = good ? 'text-green-400' : 'text-red-400';
      return `<span class="text-xs ${cls} font-semibold">
                <i class="fas fa-arrow-${up ? 'up' : 'down'} text-[10px]"></i>
                ${Math.abs(pct).toFixed(0)}%${suffix}
              </span>`;
    }

    function kesShort(n) {
      const v = Number(n) || 0;
      if (Math.abs(v) >= 1000000) return 'KES ' + (v / 1000000).toFixed(1) + 'M';
      if (Math.abs(v) >= 1000)    return 'KES ' + Math.round(v / 1000) + 'K';
      return 'KES ' + v.toLocaleString('en-KE');
    }

    async function loadAnalytics() {
      const { from, to } = analyticsRange();
      const res = await apiRequest('GET', `/api/admin/analytics?from=${from}&to=${to}`);
      if (res?._error) return res;
      analyticsData = res.data;
      return null;
    }

    async function renderAnalytics() {
      destroyAnalyticsCharts();
      const container = document.getElementById('sectionContent');

      const err = await loadAnalytics();

          ? `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-12 text-center">

             </div>`;

      }

      const d  = analyticsData;
      const dq = d.dataQuality;

      // ── Honesty banner ────────────────────────────────────────
      // The single most useful thing this screen can tell the manager is
      // whether its own numbers are trustworthy. "We earned nothing" and

      const unpriced = dq.wonMissingAmount;
      const banner = unpriced > 0 ? `
        <div class="mb-5 bg-yellow-600/10 border border-yellow-600/40 rounded-xl px-4 py-3 flex flex-wrap items-center gap-3">
          <i class="fas fa-circle-info text-yellow-500"></i>
          <p class="text-sm text-yellow-200 flex-1">
            <strong>${unpriced}</strong> of ${dq.wonTotal} won ${dq.wonTotal === 1 ? 'booking has' : 'bookings have'}
            no agreed price recorded, so revenue below is understated.
            Open each enquiry and fill in <strong>Agreed price</strong>.
          </p>
          <button onclick="switchTab('bookings')" class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-yellow-600 hover:bg-yellow-500 text-black transition flex-shrink-0">
            Go to enquiries
          </button>

      const noMoneyYet = d.revenue.booked === 0 && d.revenue.collected === 0 && dq.wonTotal === 0;

      // ── KPI tiles ─────────────────────────────────────────────
      const net = Number(d.revenue.collected) - Number(d.costs.payroll);
      const netPrev = Number(d.revenue.collectedPrev) - Number(d.costs.payrollPrev);

      const convRatePrev = d.enquiries.totalPrev ? (d.enquiries.wonPrev / d.enquiries.totalPrev) * 100 : 0;

      const tile = (label, value, delta, hint, accent) => `

        </div>`;

      container.innerHTML = `

          <div>
            <h2 class="text-xl font-bold">Business Analytics</h2>

            ${Object.entries(ANALYTICS_PRESETS).map(([k, v]) => `
              <button onclick="setAnalyticsRange('${k}')"
                class="px-3 py-1.5 rounded-lg text-xs font-medium transition border ${

                    ? 'bg-purple-600 border-purple-500 text-white'
                    : 'bg-gray-800 border-gray-700 text-gray-400 hover:text-white hover:bg-gray-700'}">
                ${v.label}
              </button>`).join('')}
            <button onclick="exportAnalyticsCsv()" title="Download the daily figures as a spreadsheet"
              class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700 transition">
              <i class="fas fa-download mr-1"></i>Export CSV
            </button>
          </div>
        </div>

        ${banner}

        <!-- Money first. This is the question the owner actually opens the tab
             to answer, so it is not below three charts about content counts. -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
          ${tile('Cash collected', kesShort(d.revenue.collected),
                 deltaChip(d.revenue.collected, d.revenue.collectedPrev),
                 'money actually received', 'text-green-400')}
          ${tile('Revenue booked', kesShort(d.revenue.booked),
                 deltaChip(d.revenue.booked, d.revenue.bookedPrev),
                 'agreed on work won', 'text-white')}
          ${tile('Still owed', kesShort(d.revenue.outstanding),
                 `<span class="text-xs text-gray-500">all time</span>`,
                 'across every confirmed job', d.revenue.outstanding > 0 ? 'text-yellow-400' : 'text-gray-400')}
          ${tile('Net after payroll', kesShort(net),
                 deltaChip(net, netPrev),

        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

          ${tile('Win rate', convRate.toFixed(0) + '%',
                 deltaChip(convRate, convRatePrev),

          ${tile('Avg job value', kesShort(d.revenue.avgDeal),
                 deltaChip(d.revenue.avgDeal, d.revenue.avgDealPrev),
                 'per job won', 'text-white')}
        </div>

        ${noMoneyYet ? `
          <div class="bg-gray-900 border-2 border-dashed border-gray-700 rounded-2xl p-10 text-center mb-6">
            <div class="w-16 h-16 bg-yellow-600/10 rounded-full flex items-center justify-center mx-auto mb-4">
              <i class="fas fa-coins text-2xl text-yellow-500"></i>
            </div>
            <h3 class="font-bold text-white mb-2">No financial data in this period yet</h3>
            <p class="text-sm text-gray-500 max-w-md mx-auto mb-5">
              Revenue appears here once you record what a client agreed to pay and the payments they make.

            </p>
            <button onclick="switchTab('bookings')" class="px-5 py-2.5 rounded-xl bg-yellow-600 hover:bg-yellow-500 text-black text-sm font-bold transition">
              Open enquiries
            </button>
          </div>` : ''}

        <div class="grid lg:grid-cols-3 gap-5 mb-5">
          <div class="lg:col-span-2 bg-gray-900 rounded-2xl border border-gray-800 p-5">
            <h3 class="font-semibold mb-1">Cash collected &amp; enquiries</h3>

            <div id="anTrend"></div>
          </div>
          <div class="bg-gray-900 rounded-2xl border border-gray-800 p-5">
            <h3 class="font-semibold mb-1">Where the work comes from</h3>
            <p class="text-xs text-gray-500 mb-3">Enquiries by event type</p>
            <div id="anTypes"></div>
          </div>
        </div>

        <div class="grid lg:grid-cols-3 gap-5">
          <div class="bg-gray-900 rounded-2xl border border-gray-800 p-5">
            <h3 class="font-semibold mb-3">Pipeline</h3>
            <div class="space-y-2.5">
              ${[
                { l: 'Enquiries received', n: d.enquiries.total, c: '#7c4dff' },
                { l: 'Awaiting your reply', n: d.enquiries.pending, c: '#f59e0b' },
                { l: 'Confirmed',           n: d.enquiries.confirmed, c: '#22c55e' },

              ].map(f => `
                <div>
                  <div class="flex justify-between text-xs mb-1">
                    <span class="text-gray-300">${f.l}</span>
                    <span class="font-bold" style="color:${f.c}">${f.n}</span>
                  </div>
                  <div class="h-2 bg-gray-800 rounded-full overflow-hidden">
                    <div class="h-2 rounded-full" style="width:${d.enquiries.total ? Math.round(f.n / d.enquiries.total * 100) : 0}%;background:${f.c}"></div>
                  </div>
                </div>`).join('')}
            </div>
          </div>

          <div class="bg-gray-900 rounded-2xl border border-gray-800 p-5">
            <h3 class="font-semibold mb-3">Service &amp; reputation</h3>
            <dl class="space-y-3 text-sm">
              <div class="flex justify-between items-baseline">
                <dt class="text-gray-400">Median reply time</dt>
                <dd class="font-bold ${d.responsiveness.medianHours === null ? 'text-gray-500'
                     : d.responsiveness.medianHours <= 2 ? 'text-green-400' : 'text-yellow-400'}">
                  ${d.responsiveness.medianHours === null ? 'no data'
                    : d.responsiveness.medianHours < 1 ? '< 1 hr'
                    : d.responsiveness.medianHours.toFixed(1) + ' hrs'}
                </dd>
              </div>
              <p class="text-xs text-gray-600 -mt-2">Your public promise is 2 hours.</p>
              <div class="flex justify-between items-baseline">
                <dt class="text-gray-400">Unanswered enquiries</dt>
                <dd class="font-bold ${d.responsiveness.unanswered > 0 ? 'text-red-400' : 'text-green-400'}">${d.responsiveness.unanswered}</dd>
              </div>
              <div class="flex justify-between items-baseline">
                <dt class="text-gray-400">Published reviews</dt>
                <dd class="font-bold text-white">${d.reviews.published}</dd>
              </div>
              <div class="flex justify-between items-baseline">
                <dt class="text-gray-400">Average rating</dt>
                <dd class="font-bold text-yellow-400">${d.reviews.average === null ? 'no reviews yet' : d.reviews.average + ' ★'}</dd>
              </div>
              ${d.reviews.pending ? `
                <div class="flex justify-between items-baseline">

                  <dd class="font-bold text-yellow-400">${d.reviews.pending}</dd>
                </div>` : ''}
            </dl>
          </div>

          <div class="bg-gray-900 rounded-2xl border border-gray-800 p-5">
            <h3 class="font-semibold mb-3">How clients pay</h3>
            ${d.breakdown.byMethod.length ? `
              <div class="space-y-2.5">
                ${d.breakdown.byMethod.map(m => {
                  const total = d.breakdown.byMethod.reduce((s, x) => s + Number(x.total), 0);
                  const pc = total ? Math.round(Number(m.total) / total * 100) : 0;
                  return `
                    <div>
                      <div class="flex justify-between text-xs mb-1">
                        <span class="text-gray-300">${escapeHtml((PAYMENT_METHODS.find(x => x.v === m.label) || {}).l || m.label)}</span>
                        <span class="text-gray-200 font-semibold">${kesShort(m.total)}</span>
                      </div>
                      <div class="h-2 bg-gray-800 rounded-full overflow-hidden">
                        <div class="h-2 rounded-full bg-green-500" style="width:${pc}%"></div>
                      </div>
                    </div>`;
                }).join('')}
              </div>`
            : `<p class="text-sm text-gray-600 py-6 text-center">No payments recorded in this period.</p>`}

        <p class="text-xs text-gray-600 mt-5 text-center">

        </p>
      `;

      drawAnalyticsCharts();
      markAnalyticsRefreshed();

      // Actually refresh, rather than claiming to. The old tab showed a pulsing
      // "Live data" badge while refreshLiveData() re-rendered only the
      // dashboard, bookings and reviews tabs — analytics was never in that list,
      // so the charts sat stale under a badge asserting they were live.
      analyticsTimer = setInterval(() => {
        if (currentTab === 'analytics') renderAnalytics();
      }, 60000);
    }

    function markAnalyticsRefreshed() {
      const el = document.getElementById('anRefreshed');
      if (el) el.textContent = '· updated ' + new Date().toLocaleTimeString('en-KE');
    }

    function drawAnalyticsCharts() {
      if (typeof ApexCharts === 'undefined' || !analyticsData) return;
      const d = analyticsData;

      const trendEl = document.getElementById('anTrend');
      if (trendEl) {
        const labels = d.series.map(p => p.day);
        // Long ranges produce more points than a phone has pixels; thinning the
        // axis labels keeps them readable without hiding data.
        const every = Math.max(1, Math.ceil(labels.length / 10));
        const t = new ApexCharts(trendEl, {
          chart: { height: 260, background: 'transparent', toolbar: { show: false }, stacked: false },
          series: [
            { name: 'Collected (KES)', type: 'column', data: d.series.map(p => Number(p.collected)) },
            { name: 'Enquiries',       type: 'line',   data: d.series.map(p => p.enquiries) },
          ],
          stroke: { width: [0, 2], curve: 'smooth' },
          colors: ['#22c55e', '#7c4dff'],
          xaxis: {
            categories: labels,
            labels: {
              style: { colors: '#9ca3af', fontSize: '10px' },
              formatter: (v, _t, opts) => {
                const i = opts?.dataPointIndex ?? labels.indexOf(v);
                if (i % every !== 0) return '';
                return new Date(v).toLocaleDateString('en-KE', { day: 'numeric', month: 'short' });
              },
            },
            tooltip: { enabled: false },
          },
          yaxis: [
            { seriesName: 'Collected (KES)', labels: { style: { colors: '#9ca3af' }, formatter: v => kesShort(v) }, min: 0 },
            { seriesName: 'Enquiries', opposite: true, min: 0,
              labels: { style: { colors: '#9ca3af' }, formatter: v => Math.round(v) } },
          ],
          dataLabels: { enabled: false },
          grid: { borderColor: '#374151' },
          legend: { labels: { colors: '#9ca3af' }, position: 'top', horizontalAlign: 'right' },
          plotOptions: { bar: { borderRadius: 3, columnWidth: '60%' } },
          theme: { mode: 'dark' },
          tooltip: {
            theme: 'dark', shared: true, intersect: false,
            x: { formatter: (_v, o) => {
              const day = labels[o?.dataPointIndex ?? 0];
              return day ? new Date(day).toLocaleDateString('en-KE', { weekday: 'short', day: 'numeric', month: 'long' }) : '';
            } },
          },
          noData: { text: 'No activity in this period', style: { color: '#6b7280' } },
        });
        t.render(); analyticsCharts.push(t);
      }

      const typesEl = document.getElementById('anTypes');
      if (typesEl) {
        const rows = d.breakdown.byEventType;
        if (!rows.length) {
          typesEl.innerHTML = '<p class="text-sm text-gray-600 py-12 text-center">No enquiries in this period.</p>';
        } else {
          const p = new ApexCharts(typesEl, {
            chart: { type: 'donut', height: 240, background: 'transparent' },
            series: rows.map(r => r.count),
            labels: rows.map(r => r.label),
            colors: ['#7c4dff', '#22c55e', '#f59e0b', '#3b82f6', '#ef4444', '#8b5cf6', '#14b8a6'],
            dataLabels: { enabled: true, formatter: (_v, o) => rows[o.seriesIndex].count },
            legend: { labels: { colors: '#9ca3af' }, position: 'bottom', fontSize: '11px' },
            theme: { mode: 'dark' },
            tooltip: {
              theme: 'dark',
              y: { formatter: (v, o) => {
                const r = rows[o?.seriesIndex ?? 0];
                return `${v} enquir${v === 1 ? 'y' : 'ies'}${Number(r?.value) > 0 ? ' · ' + kesShort(r.value) : ''}`;
              } },
            },
          });
          p.render(); analyticsCharts.push(p);
        }
      }
    }

    function setAnalyticsRange(preset) {
      analyticsUI.preset = preset;
      renderAnalytics();
    }

    // CSV, not PDF. This is the format an accountant or a bank can actually
    // open and re-total, and it needs no extra library.
    function exportAnalyticsCsv() {
      if (!analyticsData) return;
      const d = analyticsData;

      // Excel decides a field is a formula if it starts with = + - or @, so a
      // leading apostrophe-free value could execute on open. Quote everything
      // and neutralise those prefixes.
      const cell = (v) => {
        const s = String(v ?? '');
        const safe = /^[=+\-@\t\r]/.test(s) ? "'" + s : s;
        return `"${safe.replace(/"/g, '""')}"`;
      };

      const lines = [];
      lines.push(cell('Lawie Sounds — business analytics'));
      lines.push([cell('Period'), cell(d.period.from), cell('to'), cell(d.period.to)].join(','));
      lines.push([cell('Generated'), cell(new Date().toISOString())].join(','));
      lines.push('');
      lines.push([cell('Metric'), cell('This period'), cell('Previous period')].join(','));
      lines.push([cell('Cash collected (KES)'), cell(d.revenue.collected), cell(d.revenue.collectedPrev)].join(','));
      lines.push([cell('Revenue booked (KES)'), cell(d.revenue.booked),    cell(d.revenue.bookedPrev)].join(','));
      lines.push([cell('Payroll cost (KES)'),   cell(d.costs.payroll),     cell(d.costs.payrollPrev)].join(','));
      lines.push([cell('Outstanding, all time (KES)'), cell(d.revenue.outstanding), cell('')].join(','));
      lines.push([cell('Enquiries'), cell(d.enquiries.total), cell(d.enquiries.totalPrev)].join(','));
      lines.push([cell('Jobs won'),  cell(d.enquiries.won),   cell(d.enquiries.wonPrev)].join(','));
      lines.push([cell('Cancelled'), cell(d.enquiries.cancelled), cell('')].join(','));
      lines.push([cell('Average job value (KES)'), cell(d.revenue.avgDeal), cell(d.revenue.avgDealPrev)].join(','));
      lines.push([cell('Median reply time (hours)'), cell(d.responsiveness.medianHours ?? ''), cell('')].join(','));
      lines.push([cell('Won bookings missing an agreed price'), cell(d.dataQuality.wonMissingAmount), cell('')].join(','));
      lines.push('');
      lines.push([cell('Date'), cell('Enquiries'), cell('Jobs won'), cell('Cash collected (KES)')].join(','));
      d.series.forEach(p => lines.push([cell(p.day), cell(p.enquiries), cell(p.won), cell(p.collected)].join(',')));

      // BOM so Excel reads the UTF-8 correctly instead of mangling accents.
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `lawie-sounds-analytics-${d.period.from}-to-${d.period.to}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Spreadsheet downloaded', 'success');
    }

          else if (document.getElementById('featureTitle')) saveFeature();
          else if (document.getElementById('faqQuestion')) saveFaq();
          else if (document.getElementById('serviceName')) saveService();
