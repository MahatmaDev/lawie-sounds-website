  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { font-family: 'Inter', sans-serif; }

    :root {
      --bg:      #08080f;
      --surface: #0f0f1a;
      --card:    #111120;
      --border:  rgba(255,255,255,0.07);
      --yellow:  #facc15;
      --yellow-dim: rgba(250,204,21,0.12);
      --purple:  #7c4dff;
    }

    body { background: var(--bg); color: #fff; margin: 0; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--yellow); border-radius: 4px; }

    /* Skeleton */
    .skeleton {
      background: linear-gradient(90deg,#111122 25%,#1a1a2e 50%,#111122 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0}100%{background-position:-200% 0} }

    /* Hero */
    .hero-img { position:relative; height:420px; overflow:hidden; }
    @media(max-width:640px) { .hero-img { height:260px; } }
    .hero-img img { width:100%; height:100%; object-fit:cover; }
    .hero-img::after {
      content:'';
      position:absolute;
      inset:0;
      background:linear-gradient(to right, rgba(0,0,0,0.85) 40%, rgba(0,0,0,0.3) 100%);
    }
    .hero-text { position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; justify-content:center; padding:2.5rem; }
    @media(max-width:640px) { .hero-text { padding:1.25rem; } }

    /* Package cards */
    .pkg-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
    }
    .pkg-card:hover { transform: translateY(-5px); border-color: rgba(250,204,21,0.3); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5); }
    .pkg-card.popular { border-color: var(--yellow); background: linear-gradient(145deg,#111120,#1a1a08); }

    /* Feature pill */
    .feat-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      text-align: center;
      transition: border-color 0.2s, transform 0.2s;
    }
    .feat-card:hover { border-color: rgba(124,77,255,0.4); transform: translateY(-3px); }

    /* Gallery masonry */
    .masonry { columns: 2; column-gap: 10px; }
    @media(min-width:640px)  { .masonry { columns: 3; column-gap: 12px; } }
    @media(min-width:1024px) { .masonry { columns: 4; column-gap: 14px; } }
    .masonry-item { break-inside:avoid; margin-bottom:10px; display:block; }

    .gallery-card { position:relative; border-radius:10px; overflow:hidden; display:block; cursor:zoom-in; }
    .gallery-card img { width:100%; height:auto; display:block; transition:transform 0.5s cubic-bezier(.4,0,.2,1); }
    .gallery-card:hover img { transform:scale(1.07); }

    /* FAQ accordion */
    .faq-item { border-bottom:1px solid var(--border); }
    .faq-btn  { width:100%; text-align:left; padding:1rem 0; display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-weight:600; background:none; border:none; color:#fff; }
    .faq-btn i { transition:transform 0.25s; flex-shrink:0; color:var(--yellow); }
    .faq-item.open .faq-btn i { transform:rotate(180deg); }
    .faq-answer { max-height:0; overflow:hidden; transition:max-height 0.35s cubic-bezier(0,1,0,1); }
    .faq-item.open .faq-answer { max-height:400px; transition:max-height 0.5s ease; }
    .faq-answer p { padding-bottom:1rem; color:rgba(255,255,255,0.55); font-size:.9rem; line-height:1.7; }

    /* Review stars */
    .stars { color:var(--yellow); letter-spacing:1px; }

    /* Reveal */
    .reveal { opacity:0; transform:translateY(18px); transition:opacity .5s ease,transform .5s ease; }
    .reveal.visible { opacity:1; transform:none; }

    /* Touch targets */
    .btn-touch { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }

    /* Logo hover */
    .logo-img { transition:transform .3s; }
    .logo-img:hover { transform:scale(1.06); }

    html { scroll-behavior:smooth; }
    *:focus-visible { outline:2px solid var(--yellow); outline-offset:2px; border-radius:6px; }

    @media(prefers-reduced-motion:reduce) {
      .reveal, .pkg-card, .feat-card, .gallery-card img { transition:none !important; animation:none !important; }
    }
  </style>
</head>

  function escHtml(s) {

  function getSlugFromUrl() {

  async function fetchService(slug) {
    try {
      const res = await fetch(`/api/services/${encodeURIComponent(slug)}`);
      if (res.ok) {
        const json = await res.json();
        if (json.success && json.data) return json.data;
      }
    } catch {}
    // Fallback to all-services list
    try {
      const res = await fetch('/api/services');
      if (res.ok) {
        const json = await res.json();
        const found = (json.data || []).find(s => s.slug === slug || s.id === slug);
        if (found) return found;
      }
    } catch {}
    return null;
  }

  async function fetchGalleryForService(slug) {
    try {
      const res = await fetch('/api/gallery');
      if (res.ok) {
        const json = await res.json();
        const items = (json.data || []).filter(g =>
          g.serviceSlug === slug || g.service_slug === slug

        if (items.length) return items;
      }
    } catch {}
    return GALLERY_FALLBACK[slug] || [];
  }

  // Filter on the server. This used to download every review in the database

            </a>
            <span class="ml-3 text-xs text-gray-500">/</span>
            <span class="ml-3 text-xs text-gray-300">${escHtml(category)}</span>
          </div>
          <h1 class="text-3xl sm:text-4xl md:text-5xl font-black leading-tight mb-3 max-w-2xl">
            <span class="text-yellow-400">${escHtml(name)}</span>
          </h1>
          <p class="text-gray-300 text-sm sm:text-base max-w-xl leading-relaxed mb-6">${escHtml(longDesc)}</p>
          ${droneCallout}
          <div class="flex flex-wrap gap-3 mt-6">
            <a href="${bookUrl}" class="btn-touch inline-flex items-center gap-2 bg-yellow-400 text-black px-6 py-3 rounded-full font-bold hover:bg-yellow-300 transition shadow-lg text-sm">
              <i class="fas fa-calendar-check"></i> Get a Quote
            </a>
            <a href="https://wa.me/254703925826?text=${waMsg}" target="_blank" rel="noopener"
              class="btn-touch inline-flex items-center gap-2 bg-white/10 backdrop-blur-sm border border-white/20 text-white px-6 py-3 rounded-full font-bold hover:bg-white/20 transition text-sm">
              <i class="fab fa-whatsapp text-green-400"></i> WhatsApp
            </a>
          </div>
        </div>
      </div>

      <!-- Trust bar -->
      <div class="border-y py-4" style="border-color:var(--border);background:var(--surface)">
        <div class="container mx-auto px-4">
          <div class="flex flex-wrap justify-center items-center gap-6 sm:gap-10 text-xs font-semibold text-gray-400">
            <span><i class="fas fa-star text-yellow-400 mr-1.5"></i>500+ Events</span>
            <span><i class="fas fa-thumbs-up text-green-400 mr-1.5"></i>98% Satisfaction</span>
            <span><i class="fas fa-clock text-blue-400 mr-1.5"></i>Quote in 2 Hours</span>
            <span><i class="fas fa-shield-alt text-purple-400 mr-1.5"></i>Fully Insured</span>
          </div>
        </div>
      </div>

      ${packagesHtml}
      ${featuresHtml}
      ${galleryHtml}
      ${reviewsHtml}
      ${faqHtml}
      ${ctaHtml}
    `;

    // Init lightGallery on service gallery
    const lgEl = document.getElementById('serviceGalleryGrid');
    if (lgEl && typeof lightGallery !== 'undefined') {
      lightGallery(lgEl, { plugins:[lgZoom, lgThumbnail], speed:380, thumbnail:true, zoom:true, download:false });
    }

    observeReveal();
  }

  function toggleFaq(idx) {
    const item = document.querySelector(`.faq-item[data-idx="${idx}"]`);
    if (item) item.classList.toggle('open');
  }
  window.toggleFaq = toggleFaq;

  async function init() {
    const slug = getSlugFromUrl();

    // Try API first
    let service = await fetchService(slug);

    // Merge with fallback to fill any gaps (e.g. packages missing from DB)
    const fallback = SERVICES_DATA[slug];
    if (!service) {
      if (!fallback) { window.location.href = 'services.html'; return; }
      service = fallback;
    } else {
      // If DB service is missing packages/features/faqs, fill from fallback
      if (fallback) {
        if (!service.packages?.length)  service.packages  = fallback.packages;
        if (!service.features?.length)  service.features  = fallback.features;
        if (!service.faqs?.length)      service.faqs      = fallback.faqs;
      }
    }

    // Fetch gallery and reviews in parallel
    const [galleryItems, reviews] = await Promise.all([
      fetchGalleryForService(slug),
      service.reviews?.length ? Promise.resolve(service.reviews) : fetchReviewsForService(service.id),
    ]);

    // Hide skeletons and render
    document.getElementById('skeletonHero')?.remove();
    document.getElementById('skeletonBody')?.remove();

    render(service, galleryItems, reviews);

    // Mobile menu
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      document.getElementById('mobile-menu')?.classList.toggle('hidden');
    });
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
